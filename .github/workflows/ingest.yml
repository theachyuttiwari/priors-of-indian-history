name: Ingest current events
# Manual only for now. The site is refreshed by hand. To run on a schedule, add the
# ANTHROPIC_API_KEY repo secret and restore:  schedule: [{ cron: "30 1 * * *" }]  (07:00 IST)
on:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run ingest -- --days 14
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: npm run validate
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: pipeline/current-events
          title: "Pipeline: current events update"
          commit-message: "content: pipeline update for current events"
          body: "Drafted by the ingestion pipeline. Check every source before merging. Set `reviewed: true` on entries you have checked."
          labels: pipeline
