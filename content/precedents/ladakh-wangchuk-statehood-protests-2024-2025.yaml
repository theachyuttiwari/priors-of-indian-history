id: ladakh-wangchuk-statehood-protests-2024-2025
title: Ladakh statehood protests and Sonam Wangchuk's detention, 2024-2026
summary: >
  Groups in Ladakh, including the Leh Apex Body and the Kargil Democratic Alliance, demanded statehood
  and Sixth Schedule safeguards for the Union Territory. In September-October 2024 climate activist
  Sonam Wangchuk led a march from Ladakh to Delhi; Delhi Police detained him and about 120 others at
  the Singhu border and later refused permission for a protest at Jantar Mantar. On 24 September 2025
  a protest in Leh turned violent: the BJP office was set on fire and four people died in firing by
  security forces (early counts ranged from three to five). A curfew and mobile internet shutdown followed, and on 26 September 2025 Wangchuk
  was detained under the National Security Act and moved to Jodhpur jail. The Centre revoked the
  detention on 14 March 2026.
period:
  start: 2024-09-30
  end: 2026-03-14
location:
  states: [Ladakh, Delhi, Rajasthan]
  places: [Leh, Singhu border, Jantar Mantar, Jodhpur Central Jail]
protest:
  cause: Statehood for Ladakh and constitutional safeguards under the Sixth Schedule
  organisers: [Leh Apex Body, Kargil Democratic Alliance, Sonam Wangchuk]
  scale: About 120 marchers detained in Delhi in 2024; a shutdown and protest in Leh in September 2025 that turned violent, leaving four dead and dozens injured
government:
  centre:
    party: BJP
    alliance: NDA
    head: Narendra Modi
    role: Prime Minister
  state:
    party: other (Union Territory administered by the Centre through a Lieutenant Governor)
    head: Kavinder Gupta
    role: Lieutenant Governor (in September 2025)
    name: Ladakh
actions:
  - type: section_144
    date: 2024-09-30
    claim: ordered
    description: "The Delhi Police Commissioner, Sanjay Arora, issued an order under Section 163 of the BNSS barring assemblies of five or more people and sit-ins or dharnas in public areas in the New Delhi, North and Central districts and at police stations along Delhi's borders, from 30 September to 5 October 2024. It was withdrawn by an order dated 2 October."
    actor: police
    legal_basis: Section 163, Bharatiya Nagarik Suraksha Sanhita, 2023
    sources: [s1, s24, s25]
  - type: detention
    date: 2024-09-30
    claim: happened
    description: "Delhi Police detained Sonam Wangchuk and about 120 others from Ladakh at the Singhu border on the night of 30 September 2024, during their 'Delhi Chalo Padyatra', citing the prohibitory order, and took them to police stations including Bawana, Narela Industrial Area and Alipur. PTI reported, citing police, that they were released late on 1 October and detained again when they insisted on marching into central Delhi. On 3 October Solicitor General Tushar Mehta told the Delhi High Court they had been set free; the petitioners' counsel Prashant Bhushan disputed that they were fully free."
    actor: police
    sources: [s1, s24, s26]
    figures:
      - { what: people from Ladakh detained with Wangchuk on 30 September, value: "120", claimed_by: LiveLaw, source: s1 }
      - { what: people from Ladakh detained before entering Delhi, value: "120", claimed_by: Deccan Herald, source: s24 }
      - { what: Ladakhis detained again with Wangchuk after release, value: "150", claimed_by: officials (PTI), source: s26 }
  - type: permission_denied
    date: 2024-10-05
    claim: ordered
    description: "The Delhi Police Commissioner, by a letter of 5 October 2024, rejected the request to hold a peaceful demonstration at Jantar Mantar. According to The Tribune, the letter said the request came too late and lacked details of timing and numbers, and that applications must be made at least 10 days in advance. A petition by the Apex Body Leh challenging the refusal was filed in the Delhi High Court; on 22 October the Solicitor General said Wangchuk had withdrawn his fast after discussions, and the petition was dismissed as withdrawn."
    actor: police
    sources: [s2, s3, s27, s28, s29]
  - type: section_144
    date: 2025-09-24
    claim: ordered
    description: "After the violence, Leh Deputy Commissioner Romil Singh Donk issued an order under Section 163 of the BNSS restricting processions, rallies and marches in Leh district, and announced a ban on demonstrations, public gatherings and inflammatory speech."
    actor: state
    legal_basis: Section 163, Bharatiya Nagarik Suraksha Sanhita, 2023
    sources: [s18, s19, s4]
  - type: firing
    date: 2025-09-24
    claim: happened
    description: "A protest in Leh for statehood and the Sixth Schedule turned violent; protesters set fire to the BJP office and vehicles, including a police vehicle. Police used tear gas and batons, and four men, including Kargil war veteran Tsewang Tharchin, died in firing by security personnel; counts in the first days ranged from three to five. The Home Ministry said a mob incited by Wangchuk's speeches attacked offices and security personnel and that police fired in self-defence. Lieutenant Governor Kavinder Gupta defended the police action; the Kargil Democratic Alliance and Ladakh MP Haji Hanifa Jan demanded an independent judicial probe."
    actor: police
    sources: [s4, s5, s6, s18, s19, s11]
    figures:
      - { what: people killed, value: "at least four", claimed_by: The Tribune, source: s18 }
      - { what: men killed in firing by security personnel, value: "four", claimed_by: ThePrint, source: s5 }
      - { what: people killed, value: "at least four", claimed_by: protest coordinators, source: s7 }
      - { what: people killed, value: "three", claimed_by: Ladakh MP Mohammed Hanifa (on 24 September), source: s19 }
      - { what: people believed killed in police gunfire, value: "three to five", claimed_by: Sonam Wangchuk (quoted by Indian Express, via Al Jazeera), source: s4 }
      - { what: people killed, value: "five", claimed_by: unnamed sources (ETV Bharat, 25 September), source: s30 }
      - { what: casualties in police firing, value: "some casualties", claimed_by: Ministry of Home Affairs, source: s11 }
      - { what: people injured, value: "over 65", claimed_by: The Tribune, source: s18 }
      - { what: people injured, value: "over 45, including 22 police personnel", claimed_by: PTI (24 September), source: s31 }
      - { what: people injured, value: "over 80", claimed_by: PTI (25 September), source: s33 }
      - { what: police and CRPF personnel injured, value: "more than 30", claimed_by: Ministry of Home Affairs, source: s11 }
  - type: curfew
    date: 2025-09-24
    claim: ordered
    description: A curfew was imposed across Leh after the violence; Lieutenant Governor Kavinder Gupta called it a precautionary measure. It was still in force in Leh on 29 September 2025. Many people, including ex-servicemen, were taken into custody.
    actor: state
    sources: [s18, s5, s20, s7, s31, s33]
    figures:
      - { what: people detained in connection with the violence, value: "nearly 50", claimed_by: officials in Leh, source: s20 }
      - { what: people detained, value: "at least 50", claimed_by: police (PTI), source: s33 }
  - type: internet_shutdown
    date: 2025-09-26
    claim: ordered
    description: "By an order dated 26 September 2025, the Union Home Ministry suspended mobile data (2G to 5G) and public Wi-Fi in the entire Leh district from 18:00 that day to 18:00 on 29 September, citing public safety and public order. Further orders dated 29 September, 3 October and 7 October extended the suspension to 18:00 on 9 October 2025."
    actor: centre
    legal_basis: Section 20(2)(b), Telecommunications Act, 2023; Telecommunications (Temporary Suspension of Services) Rules, 2024
    sources: [s14, s15, s16, s17, s7]
  - type: nsa_detention
    date: 2025-09-26
    claim: ordered
    description: "Wangchuk was detained under the National Security Act on an order of the District Magistrate, Leh, which the Home Ministry later said was issued with a view to maintaining public order. Officials said he was detained before a news briefing he was due to hold, and he was moved to Jodhpur Central Jail. On 24 September the Home Ministry had said the mob was incited by his provocative statements; Wangchuk denied the accusations. He had called off his hunger strike that day, saying violence 'only damages our cause'."
    actor: state
    legal_basis: National Security Act, 1980
    sources: [s13, s8, s7, s6, s11, s4]
  - type: other
    date: 2025-09-25
    claim: ordered
    description: "The Home Ministry's Foreigners Division cancelled, with immediate effect, the FCRA registration of the Students' Educational and Cultural Movement of Ladakh (SECMOL), the organisation Wangchuk founded. The order cited violations including a Rs 3.5 lakh deposit into the FCRA account and the receipt of foreign funds for a study it described as on the 'sovereignty of the nation'. SECMOL said the deposit was the sale proceeds of an old bus, and Gitanjali Angmo said the funds were for food sovereignty and that the ministry had misread its reply."
    actor: centre
    legal_basis: Foreign Contribution (Regulation) Act, 2010
    sources: [s20, s21, s22, s7]
  - type: other
    date: 2026-02-11
    claim: happened
    description: "Hearing the habeas corpus petition of Wangchuk's wife Gitanjali Angmo (Gitanjali J. Angmo v. Union of India, W.P.(Crl.) No. 399/2025), a Supreme Court bench of Justices Aravind Kumar and P.B. Varale told the Centre it was 'reading too much into' a speech in which Wangchuk worried that young people were moving away from non-violent methods, and asked it to show a proximate link to the 24 September violence. Additional Solicitor General K.M. Nataraj argued that the test was the potential of his words to disturb public order; Solicitor General Tushar Mehta said Wangchuk should not be compared with Mahatma Gandhi."
    actor: court
    sources: [s9, s23]
  - type: concession
    date: 2026-03-14
    claim: ordered
    description: "The Centre revoked Wangchuk's NSA detention with immediate effect, stating the aim was to foster peace and an atmosphere for dialogue in Ladakh. It said he had already served nearly half of the detention period under the Act."
    actor: centre
    legal_basis: National Security Act, 1980
    sources: [s13, s8]
  - type: negotiation
    date: 2025-09-29
    claim: ordered
    description: The Home Ministry, in a PIB release, said the government had always been open to dialogue with the Apex Body Leh and the Kargil Democratic Alliance and would continue to welcome discussion through the High Powered Committee on Ladakh or any such platform. The Leh Apex Body had said it would stay away from talks until normalcy returned; the Kargil Democratic Alliance said on 30 September it would not talk until its demands were met.
    actor: centre
    sources: [s12, s6, s32]
outcome: >
  Wangchuk was released in March 2026 after the Home Ministry revoked his NSA detention. Leh Apex Body
  and Kargil Democratic Alliance leaders met Home Ministry officials in Leh in August 2026 and demanded an
  elected assembly. The Home Ministry ordered 12 CRPF companies to Ladakh for 31 August to 30 September
  2026, a year after the violence; a Ladakh administration source told ThePrint that compensation promised
  to the families of the four dead had not yet been granted.
