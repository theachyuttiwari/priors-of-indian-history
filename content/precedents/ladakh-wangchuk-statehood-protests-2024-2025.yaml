    statement: "In a press release, said Wangchuk had misled people with references to Arab Spring-style protests and Gen Z protests in Nepal, that a mob instigated by his speeches attacked a party office and a government office and injured more than 30 police and CRPF personnel, and that police fired in self-defence."
    quote:
      text: "It is clear that the mob was incited by Shri Sonam Wangchuk through his provocative statements."
      locator: "para 8"
