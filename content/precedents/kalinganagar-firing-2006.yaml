    role_at_time: Chief Minister of Orissa and Home Minister
    in_power: true
    date: 2006-01-03
    statement: "Called the incident \"very unfortunate\", announced Rs 1 lakh ex gratia per family and a judicial inquiry headed by a sitting High Court judge."
    sources: [s13]
  - party: BJD
    person: Damodar Rout
    role_at_time: BJD secretary-general
    in_power: true
    date: 2006-01-08
    statement: "Called the BJP state president's threat to pull out of the coalition \"both unfortunate and deplorable\"."
    sources: [s14]
  - party: BJP
    person: Jual Oram
    role_at_time: BJP Orissa state president, coalition partner
    in_power: true
    date: 2006-01-08
    statement: "Threatened to withdraw BJP support from the Naveen Patnaik government over the killings, then toned down after talks with the party leadership."
    sources: [s14]
  - party: BJP
    person: Rajnath Singh
    role_at_time: BJP national president; BJP was coalition partner in Orissa
    in_power: true
    date: 2006-01-08
    statement: "Expressed \"grave concern\" over the firing, said the onus was on Naveen Patnaik to prevent a repeat, and said the BJP would not withdraw support."
    sources: [s14]
  - party: INC
    person: J.B. Patnaik
    role_at_time: Leader of Opposition, Orissa Assembly
    in_power: false
    date: 2006-01-03
    statement: "Called the firing \"unfortunate and shocking\"; the Congress demanded the Chief Minister's resignation and a judicial probe."
    sources: [s13, s2]
  - party: INC
    person: Jaydev Jena
    role_at_time: President, Orissa Pradesh Congress Committee
    in_power: false
    date: 2006-02-02
    statement: "Said Naveen Patnaik was trying to give the issue a political colour, and that a planned February rally would show the government's days were numbered."
    sources: [s13, s14]
  - party: INC
    person: Rama Chandra Khuntia
    role_at_time: Congress leader, Orissa
    in_power: false
    date: 2006-01-03
    statement: "Sought Rs 10 lakh compensation for each victim's family."
    sources: [s13]
  - party: CPI(M)
    person: Janardan Pati
    role_at_time: CPI(M) state leader, Orissa
    in_power: false
    date: 2006-01-03
    statement: "Called the state government a \"killer of tribals\" and sought stern action against the police and district officials responsible."
    sources: [s13]
  - party: JMM
    person: Shibu Soren
    role_at_time: JMM president
    in_power: false
    date: 2006-01-03
    statement: "\"This incident is similar to the Jalianwala Bagh massacre.\""
    sources: [s13]
