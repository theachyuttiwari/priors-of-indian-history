id: kalinganagar-firing-2006
title: Kalinganagar police firing
summary: >
  On 2 January 2006, police at Kalinganagar in Jajpur district, Orissa (now Odisha), fired on Adivasi
  villagers who were opposing construction of a boundary wall for a proposed Tata Steel plant on land
  acquired by the state's industrial development corporation. Twelve villagers died on the spot and one
  policeman was killed; later counts put the villager toll at 13 or 14 as injured people died. The
  BJD-BJP state government ordered a judicial inquiry, announced ex gratia payments and transferred the
  district collector and superintendent of police, while the Bisthapan Virodhi Jan Manch blockaded the
  Daitari-Paradip highway for about 14 months.
period:
  start: 2006-01-02
  end: 2007-03-09
location:
  states: [Odisha]
  places: [Kalinganagar, Champakoila, Jajpur district, Daitari-Paradip Express Highway]
protest:
  cause: Opposition to land acquisition and displacement for the Tata Steel plant at Kalinganagar, and to the compensation and rehabilitation package offered
  organisers: [Bisthapan Virodhi Jan Manch, Kalinga Nagar Surakhya Parishad]
  scale: About 800 to 1,000 villagers at the site on 2 January 2006; a statewide bandh on 7 January 2006; a highway blockade that ran for about 14 months
government:
  centre:
    party: INC
    alliance: UPA
    head: Manmohan Singh
    role: Prime Minister
  state:
    party: BJD
    alliance: BJD-BJP
    head: Naveen Patnaik
    role: Chief Minister
    name: Odisha (then Orissa)
actions:
  - type: tear_gas
    date: 2006-01-02
    description: "Police escorting Tata Steel officials and a bulldozer, with about 12 platoons of armed personnel, used tear gas and rubber bullets after a confrontation began near the boundary wall site. Villagers said police fired without provocation; police said they acted after brickbats and arrows were thrown."
    actor: police
    sources: [s1, s2, s7]
  - type: firing
    date: 2006-01-02
    description: "Police opened fire on the crowd. The toll is contested: Amnesty International and PUDR record 12 Adivasis killed, including three women and a 12-year-old boy, plus one policeman; later reports give 13 villagers, and PTI in 2025 reported 14 (12 on the spot and two who died later) with about 60 injured by bullets."
    actor: police
    sources: [s2, s4, s7, s12, s13]
  - type: curfew
    date: 2006-01-02
    description: "A curfew was imposed in the Kalinganagar area on the evening of 2 January and lifted at about 6 a.m. on 3 January."
    actor: state
    sources: [s13]
  - type: other
    date: 2006-01
    description: "The Jajpur district collector (Saswat Mishra) and superintendent of police (Binaytosh Mishra), who were present at the firing, were transferred. By February 2006 Arabinda Padhee was collector. Protesters had demanded their suspension and prosecution."
    actor: state
    sources: [s1, s13, s14]
  - type: other
    date: 2006-01-07
    description: "During the dawn-to-dusk Orissa bandh called by the Kalinga Nagar Surakhya Parishad and backed by opposition parties, the state deployed about 164 platoons of police in sensitive and industrial areas and declared a holiday for educational institutions."
    actor: state
    sources: [s5]
  - type: concession
    date: 2006-01
    description: "Chief Minister Naveen Patnaik first announced ex gratia of Rs 1 lakh for each family of the dead and reimbursement of medical costs for the injured. By 2 February 2006 the state had raised this to Rs 5 lakh per family and the Centre agreed to a further Rs 5 lakh per family. The families refused the money and demanded Rs 20 lakh per death, five acres of land per acre acquired and action against officials. By early 2007 only one of 13 families had accepted the Rs 10 lakh offer."
    actor: state
    sources: [s13, s14, s9, s4]
  - type: commission_of_inquiry
    date: 2006-01
    description: "The state ordered a judicial inquiry headed by a sitting High Court judge, Justice A.S. Naidu. The commission was dissolved in May 2007 after the Supreme Court ruled that sitting judges could not head such inquiries. A Justice R.K. Patra commission formed in January 2008 was dissolved when he became Lokpal. The Justice P.K. Mohanty commission then took over and submitted its report on 3 July 2015."
    actor: state
    sources: [s3, s4, s15]
  - type: barricading
    date: 2006-01
    description: "The Bisthapan Virodhi Jan Manch blocked the Daitari-Paradip Express Highway (reported as NH-200) from the days after the firing, dug up the road surface, and barricaded the plant site and nearby villages against entry by officials. The blockade lasted about 14 months."
    actor: other
    sources: [s2, s8, s9, s14]
  - type: negotiation
    date: 2006-05
    description: "Talks between Adivasi representatives and the state government in May 2006 did not produce a settlement. At a meeting between a Kalinganagar organisation and a government delegation headed by the Chief Minister, the government agreed to return the severed palms of five victims to their families."
    actor: state
    sources: [s4, s16]
  - type: other
    date: 2006-05
    description: "Doctors who severed the palms of five unidentified bodies during post-mortems, reportedly for fingerprint identification, were suspended; the Orissa Human Rights Commission criticised the act. The Mohanty commission later held three doctors responsible but found no oblique intent. In November 2018 the preserved palms, which families had refused pending DNA tests, were found dumped near the memorial."
    actor: state
    sources: [s16, s10, s15, s17]
  - type: section_144
    date: 2007-03
    description: "After the Orissa High Court set a 9 March 2007 deadline for the government to clear the highway, the administration imposed prohibitory orders under Section 144 CrPC and mobilised about 35 platoons of armed police. The Jan Manch lifted the blockade from midnight on 8-9 March 2007 after talks with Collector Arabinda Padhee and SP Asit Kumar Panigrahi, while saying its opposition to land acquisition would continue."
    actor: state
    sources: [s6]
  - type: other
    date: 2017-12
    description: "The Mohanty commission report was tabled in the Odisha Assembly in December 2017, about two years after submission and after the High Court pressed the state to file it. It found the executive magistrate ordered firing only after other measures failed, blamed local leaders and political parties for leading villagers toward confrontation, and recommended welfare schemes for land losers, a job for one member of each bereaved family and extra compensation for the injured. The state's action-taken report said Rs 16.5 lakh in additional ex gratia had been paid to the injured and the Orissa R&R policy had been amended. In 2019 the district still listed 605 pending R&R claims from Tata Steel's package."
    actor: state
    sources: [s3, s11, s17, s18]
outcome: >
  The highway blockade ended on 9 March 2007 under a High Court deadline, and Tata Steel's Kalinganagar plant was later built. Three successive inquiry commissions were set up; the final Mohanty report, submitted in 2015 and tabled in 2017, held the firing to be justified and no official was prosecuted. Families contested the ex gratia and rehabilitation terms for years, and the death toll remains reported as 12, 13 or 14 villagers plus one policeman.
