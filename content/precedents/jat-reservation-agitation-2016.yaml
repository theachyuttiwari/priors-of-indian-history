id: jat-reservation-agitation-2016
title: Jat reservation agitation in Haryana, February 2016
summary: >
  Jat groups seeking OBC reservation blocked highways and rail lines across Haryana from
  7 February 2016, and the agitation turned violent in Rohtak, Jhajjar and other districts
  from 18 February. District authorities stopped mobile internet, issued prohibitory orders
  and imposed curfews, and the state called in the Army and central paramilitary forces.
  A committee under former DGP Prakash Singh, appointed by the state, counted 30 dead and
  208 injured; news reports gave 320 injured. Singh said its report of 13 May 2016 identified
  about 90 officials guilty of deliberate negligence.
period:
  start: 2016-02-07
  end: 2016-02-22
location:
  states: [Haryana]
  places: [Rohtak, Jhajjar, Sonipat, Bhiwani, Hisar, Jind, Kaithal, Panipat]
protest:
  cause: Reservation for Jats in government jobs and educational institutions
  organisers: [Jat community organisations; described by police and Jat leaders as largely leaderless]
  scale: Eight districts particularly affected; 30 dead and 208 injured per the Prakash Singh committee (news reports gave 320 injured); hundreds of trains cancelled or diverted
government:
  centre:
    party: BJP
    alliance: NDA
    head: Narendra Modi
    role: Prime Minister
  state:
    party: BJP
    head: Manohar Lal Khattar
    role: Chief Minister
    name: Haryana
actions:
  - type: internet_shutdown
    date: 2016-02-18
    claim: ordered
    description: "District administrations stopped mobile internet from 18 February. The Rohtak Deputy Commissioner stopped internet services throughout the district by order No. 4011-51/MB of 18 February, to check the misuse of social media for rumour mongering. Orders of 18 February also stopped mobile internet or bulk messaging in Jind, Sonepat and Hisar (in Hisar under Section 144 CrPC), Panipat issued Section 144 orders on 18 and 19 February that included suspending internet, and wireless internet was stopped in Bhiwani, according to the Prakash Singh committee. A senior police official told IANS it was done so that rumours are not spread. The Indian Express reported that mobile internet and SMS were blocked from early on 19 February"
    actor: state
    legal_basis: Section 144 CrPC (named in the Hisar and Panipat orders)
    sources: [s9, s10, s3, s2]
  - type: section_144
    date: 2016-02-18
    claim: ordered
    description: "District Magistrates issued prohibitory orders under Section 144 CrPC on 18 February in Rohtak (the committee report gives the order as No. 3018-57/MB in one place and No. 4011-51/MB, the number of the internet order, in another), Jind, Hisar and Panipat, according to the Prakash Singh committee. The Indian Express reported on 20 February that Section 144 had been imposed in at least six districts"
    actor: state
    legal_basis: Section 144 CrPC
    sources: [s9, s10]
  - type: negotiation
    date: 2016-02-19
    claim: happened
    description: "The state Cabinet met on 18 February. The Chief Minister called an all-party meeting at Haryana Niwas, Chandigarh, at 11 am on 19 February and offered to introduce a reservation bill in the coming session of the Vidhan Sabha; leaders of all parties then appealed for peace. Violence broke out in Rohtak within hours. On 21 February a group of Jat leaders met Union Home Minister Rajnath Singh, who gave an assurance of a central committee under M. Venkaiah Naidu and of a state reservation bill in the coming Budget Session; the blockades were lifted by the evening of 23 February"
    actor: state
    sources: [s9, s10, s3]
  - type: curfew
    date: 2016-02-19
    claim: ordered
    description: "Curfew orders were issued in Rohtak (order No. 4047-5000/MB of 19 February) and Jhajjar on 19 February, in Hisar city and Hansi and in Sonepat and Gohana on 20 February, and in Kaithal city on 21 February, according to the Prakash Singh committee, which treats them as orders under Section 144 CrPC. The Indian Express reported curfew in Rohtak, Bhiwani and Jhajjar and shoot-at-sight orders in Rohtak and Bhiwani by the evening of 19 February. IANS reported curfew in Hisar, Sonipat and Jind towns on 20 February, and the Hindustan Times reported on 21 February that curfew covered eight districts"
    actor: state
    legal_basis: Section 144 CrPC (curfew orders, as described by the Prakash Singh committee)
    sources: [s9, s10, s11, s12, s4]
  - type: other
    date: 2016-02-20
    claim: happened
    description: "Army deployment: the state government decided on the evening of 19 February to requisition the Army, and the DGP said a requisition had been sent for eight districts. The agitators dug up roads leading to Rohtak, so troops were airlifted there; the first columns arrived on 20 February, according to the Prakash Singh committee, whose table counts 38 columns on 20 February rising to 74 by 24 February. The DGP said on 20 February that 13 Army columns had arrived with 10 more being airlifted, and 10 paramilitary companies had arrived with 23 more on the way"
    actor: centre
    sources: [s9, s10, s11, s13, s2, s4]
    figures:
      - what: Army columns received by the state by noon on 20 February (10 more being airlifted)
        value: "13"
        claimed_by: Haryana DGP Yash Pal Singal
        source: s13
      - what: Army columns deployed on 20 February
        value: "38"
        claimed_by: Prakash Singh committee (para 8.11)
        source: s9
      - what: highest number of Army columns deployed on one day (24 February)
        value: "74"
        claimed_by: Prakash Singh committee (para 8.11)
        source: s9
  - type: firing
    date: 2016-02-20
    claim: happened
    description: "At Jhajjar on 20 February a crowd set government buildings on fire near the Jahanaara Bagh stadium. Water cannon, tear gas and a lathi charge did not disperse it, and the committee says the crowd fired at the police; a magistrate then ordered the Army to fire. The Prakash Singh committee gives different death counts in different parts of its report, and IANS and the state police gave other figures"
    actor: centre
    sources: [s9, s11, s4]
    figures:
      - what: killed in firing by the Army (with police) at Jhajjar on 20 February
        value: "6"
        claimed_by: Prakash Singh committee (para 8.15, table of Army firing)
        source: s9
      - what: killed in firing by the Army in Jhajjar district
        value: "5"
        claimed_by: Prakash Singh committee (para 7.11, use-of-force table)
        source: s9
      - what: agitators killed when the Army column opened fire at Jhajjar
        value: "4"
        claimed_by: Prakash Singh committee (para 5.18)
        source: s9
      - what: died in Jhajjar on 20 February when armed forces opened fire
        value: "4"
        claimed_by: Official release (as reported by The Indian Express)
        source: s11
      - what: killed when soldiers fired on a mob in Jhajjar
        value: "1"
        claimed_by: IANS
        source: s4
  - type: fir
    date: 2016-02-20
    claim: ordered
    description: "The DGP said 129 cases had been registered against agitators by 20 February. The Prakash Singh committee recorded 2,122 cases registered across the state in connection with the agitation by 30 April 2016, four of them for murder"
    actor: police
    sources: [s4, s13, s9]
    figures:
      - what: cases registered against agitators by 20 February
        value: "129"
        claimed_by: Haryana DGP Yash Pal Singal
        source: s13
      - what: cases registered in connection with the riots by 30 April 2016
        value: "2,122"
        claimed_by: Prakash Singh committee (Annexure II)
        source: s9
      - what: arrests made by 23 April 2016
        value: "520"
        claimed_by: Prakash Singh committee (Annexure II)
        source: s9
  - type: commission_of_inquiry
    date: 2016-02-25
    claim: ordered
    description: "By an order of 25 February 2016 the Home Department appointed Prakash Singh, IPS (retd), to inquire into acts of omission and commission by police and civil officers during the agitation from 7 to 22 February and to report within 45 days, and to suggest improvements to the law-and-order system within a further month. An order of 3 March appointed Vijai Vardhan (IAS) and K.P. Singh (IPS) to assist him. The committee heard 2,217 persons and reported on 13 May 2016, naming officers in its district chapters. Singh told PTI that about 90 officials were guilty of deliberate negligence, a third of them in Rohtak; The Quint, with agency inputs, reported nearly 30. The report was made public on 31 May. Additional Chief Secretary (Home) P.K. Das was moved from the Home Department a day after it was submitted, and DGP Yashpal Singal had been moved a few days before. In August 2016 Singh said the Home Department had written that his second report was not needed"
    actor: state
    sources: [s9, s7, s1, s6, s17, s16, s8]
    figures:
      - what: killed during the agitation (20 rioters and 10 others)
        value: "30"
        claimed_by: Prakash Singh committee (para 7.5)
        source: s9
      - what: injured during the agitation (123 rioters, 15 others, 55 policemen, 11 CAPF, 4 Army)
        value: "208"
        claimed_by: Prakash Singh committee (para 7.5)
        source: s9
      - what: injured during the agitation
        value: "320"
        claimed_by: The Quint (with agency inputs)
        source: s1
      - what: officials found guilty of deliberate negligence
        value: "about 90"
        claimed_by: Prakash Singh (as reported by PTI)
        source: s7
      - what: officers and officials held responsible for an inadequate response
        value: "nearly 30"
        claimed_by: The Quint (with agency inputs)
        source: s1
outcome: >
  The Prakash Singh committee reported on 13 May 2016, and its main report was made public on
  31 May. Officers were transferred and some suspended. The state government decided in August
  2016 to ask the CBI to inquire into arson in Rohtak.
positions:
  - party: BJP
    person: Manohar Lal Khattar
    role_at_time: Chief Minister of Haryana
    in_power: true
    date: 2016-02-20
    kind: verbatim
    statement: "Appealed on Twitter to all Haryanvis to maintain law and order and harmony, and later in the day asked protesters to return to their homes, saying the government had accepted their demands, without giving details."
    quote:
      text: "I appeal to all my fellow Haryanvis to maintain law & order in the State, and ensure that harmony is maintained in society."
      locator: "Final sentence of the report"
      source: s11
    sources: [s11, s12, s4]
  - party: INC
    person: Bhupinder Singh Hooda
    role_at_time: Former Chief Minister, opposition
    in_power: false
    date: 2016-02-21
    kind: paraphrase
    statement: "Began a fast at Jantar Mantar in New Delhi, saying his only demand was that peace be restored in Haryana, and appealed to all parties, agitators and Haryanvis to restore peace and harmony."
    sources: [s15, s4]
  - party: INC
    person: Bhupinder Singh Hooda
    role_at_time: Former Chief Minister, opposition
    in_power: false
    date: 2016-08-31
    kind: verbatim
    statement: "In the Vidhan Sabha, said he had repeatedly condemned the arson and violence during the agitation, asked for a High Court judge to inquire into the arson, and asked why a pick-and-choose policy was followed in targeting students in MDU."
    quote:
      text: "I had repeatedly condemned incidents of arson and violence during the agitation, as also favoured an inquiry to bring those responsible to book."
      locator: "Paragraph beginning 'Former Chief Minister Bhupinder Singh Hooda intervened'"
      source: s5
    sources: [s5]
  - party: other (Indian National Lok Dal)
    person: Abhay Chautala
    role_at_time: Leader of Opposition, Haryana Assembly
    in_power: false
    date: 2016-02-20
    kind: paraphrase
    statement: "Demanded that the Khattar government be dismissed and President's Rule imposed. On 22 February said the INLD would submit a memorandum to the Governor seeking President's Rule, asked for a judicial inquiry into who instigated the violence, and blamed both BJP MP Raj Kumar Saini and former Chief Minister Hooda."
    sources: [s4, s14]
  - party: INC
    person: Geeta Bhukkal
    role_at_time: MLA, Jhajjar, opposition
    in_power: false
    date: 2016-08-31
    kind: verbatim
    statement: "In the Vidhan Sabha, said the Prakash Singh report found a complete failure on all fronts, that the agitation was a failure of the government, the Chief Minister, his Cabinet and the police, and asked why the CBI probe covered only the arson at the Finance Minister's house."
    quote:
      text: "The agitation was a complete failure of the government, the Chief Minister, his Cabinet and the police."
      locator: "Fourth paragraph, in Bhukkal's quoted speech"
      source: s5
    sources: [s5]
  - party: BJP
    person: Capt Abhimanyu
    role_at_time: Haryana Finance Minister
    in_power: true
    date: 2016-08-31
    kind: verbatim
    statement: "In the Vidhan Sabha, said the CBI probe was not about one house but about 10 members of a family, the Circuit House and the IG's house, and that those who had ruled Haryana neither condemned the wrongdoers nor distanced themselves from them."
    quote:
      text: "The CBI probe is not about one house, but about 10 members of a family, the Circuit House and the IG’s house which was targeted by the mob."
      locator: "Paragraph under 'FM-Hooda duel'"
      source: s5
    sources: [s5]
