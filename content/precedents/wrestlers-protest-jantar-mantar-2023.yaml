id: wrestlers-protest-jantar-mantar-2023
title: Wrestlers' protest at Jantar Mantar, 2023
summary: >
  In January 2023 Olympic medallists Vinesh Phogat, Sakshi Malik and Bajrang Punia led a sit-in at
  Jantar Mantar, New Delhi, accusing Wrestling Federation of India president and BJP MP Brij Bhushan
  Sharan Singh of sexually harassing women wrestlers; he denied the allegations. The sit-in ended
  after the Sports Ministry set up an oversight committee, and resumed in April 2023 when its report
  was not made public. Delhi Police registered FIRs against Singh after the matter reached the Supreme
  Court, detained the wrestlers on 28 May 2023 as they marched towards the new Parliament building,
  cleared the protest site and booked them for rioting. The street protest ended in June 2023 after a
  chargesheet was filed.
period:
  start: 2023-01-18
  end: 2023-06
location:
  states: [Delhi, Haryana, Uttarakhand]
  places: [Jantar Mantar, New Parliament building, Har ki Pauri Haridwar]
protest:
  cause: Arrest of and action against WFI president Brij Bhushan Sharan Singh over sexual harassment allegations by women wrestlers
  organisers: [Vinesh Phogat, Sakshi Malik, Bajrang Punia]
  scale: A sit-in by leading wrestlers at Jantar Mantar, joined at times by farmer and khap groups; Bajrang Punia said over 2,000 supporters were detained on 28 May 2023
