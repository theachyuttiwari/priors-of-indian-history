actions:
  - type: commission_of_inquiry
    date: 2023-01-23
    claim: ordered
    description: "After the first sit-in at Jantar Mantar (18-20 January 2023), the Sports Ministry formed an Oversight Committee headed by M.C. Mary Kom to enquire into the allegations of sexual misconduct, harassment, financial irregularities and administrative lapses, and to run the WFI's day-to-day administration during the enquiry. It gave the committee four weeks and told the WFI executive committee to stop managing day-to-day activities; Sports Minister Anurag Thakur said Singh would step aside meanwhile. The committee submitted its report in April 2023. The report was not made public; the Ministry's 24 April letter to the IOA listed general findings, such as the absence of an Internal Complaints Committee, and did not mention specific charges against Singh. Sakshi Malik said the wrestlers had reasons to believe the accused had been given a clean chit."
    actor: centre
    sources: [s12, s13, s2, s16, s1]
  - type: other
    date: 2023-04-24
    claim: ordered
    description: "As the wrestlers resumed their sit-in, the Sports Ministry wrote to the Indian Olympic Association declaring the WFI election process for 7 May null and void and asking it to form an ad hoc committee to run the WFI and hold elections within 45 days of its formation."
    actor: centre
    sources: [s15, s16, s1]
  - type: fir
    date: 2023-04-28
    claim: held
    description: "During the Supreme Court hearing on the wrestlers' petition, Solicitor General Tushar Mehta, appearing for Delhi Police, stated that since the allegations implicated a cognizable offence, the police had decided to register an FIR that day; the bench of CJI D.Y. Chandrachud and Justice P.S. Narasimha recorded the statement. The court directed the Delhi Police Commissioner to assess the threat to the minor complainant and provide adequate security, and said this did not stop the Commissioner from assessing the threat to the other complainants and providing security to them if needed. Delhi Police registered two FIRs against Singh that day at Connaught Place police station, one of them under the POCSO Act on the minor's complaint. Delhi Police report to the Union Home Ministry."
    actor: court
    sources: [s17, s2, s18, s19]
    court_outcomes:
      - summary: "On 4 May 2023 a bench of CJI D.Y. Chandrachud and Justices P.S. Narasimha and J.B. Pardiwala closed the proceedings, saying the petition's purpose had been served with the registration of FIRs and the provision of security, and gave the petitioners liberty to approach the magistrate or the Delhi High Court. It did not accept a request for a retired judge to monitor the investigation."
        source: s19
  - type: other
    date: 2023-05-03
    claim: happened
    description: "Late on 3 May a scuffle broke out at Jantar Mantar after police stopped protesters from bringing folding beds into the site after rain. Wrestlers alleged that policemen pushed, hit and abused them and that one officer was drunk; The Times of India reported that Bajrang Punia and Vinesh Phogat were injured and that wrestler Dushyant Phogat was taken to hospital with a cut on his forehead. DCP Pranav Tayal said AAP MLA Somnath Bharti had brought the beds and was not allowed in, that some police personnel and wrestlers were injured, and that action would be taken against the policeman alleged to be drunk. Delhi Police denied that its officers assaulted the protesters. Police detained Bharti and two others and barricaded the site."
    actor: police
    sources: [s20, s21, s3]
  - type: detention
    date: 2023-05-28
    claim: happened
    description: "As the new Parliament building was inaugurated, Delhi Police detained Vinesh Phogat, Sakshi Malik, Bajrang Punia and their supporters, who had crossed barricades while marching towards it for a women's 'mahapanchayat', and took them away in buses to police stations across Delhi; the women wrestlers were released that evening. Special Commissioner of Police Dependra Pathak said they broke the barricades, did not follow police directions and created a 'riot-like situation'; Punia denied that the protesters broke barricades and violated law and order. Farmer leaders travelling to support the wrestlers were detained at Delhi's borders and, according to BKU (Charuni), in Haryana. The numbers detained differ (see figures)."
    actor: police
    sources: [s22, s23, s24, s4, s5, s10, s25]
    figures:
      - { what: "persons detained at Jantar Mantar", value: "109", claimed_by: "Special CP Dependra Pathak, Delhi Police", source: s23 }
      - { what: "people detained across Delhi, including 109 at Jantar Mantar", value: "700", claimed_by: "Delhi Police (PTI)", source: s25 }
      - { what: "protesters detained at Jantar Mantar", value: "more than 500", claimed_by: "Gopal Tiwari, protest organiser", source: s23 }
      - { what: "supporters detained", value: "over 2,000", claimed_by: "Bajrang Punia", source: s4 }
  - type: other
    date: 2023-05-28
    claim: happened
    description: Soon after the detentions, police cleared the wrestlers' protest site at Jantar Mantar, taking down the tent and removing cots, mattresses, cooler fans, the tarpaulin cover and other belongings.
    actor: police
    sources: [s22, s23, s24, s4]
  - type: fir
    date: 2023-05-28
    claim: ordered
    description: "Delhi Police registered an FIR at Barakhamba police station against the organisers of the protest, including Bajrang Punia, Sakshi Malik and Vinesh Phogat, and their supporters, on charges including rioting, unlawful assembly and obstructing and assaulting public servants. Reports list the sections differently (see legal basis). On 7 June the wrestlers said the government had agreed to withdraw these FIRs."
    actor: police
    sources: [s24, s22, s25, s10, s5, s26]
    legal_basis: "IPC sections 147, 149, 186, 188, 332 and 353 and Section 3 of the Prevention of Damage to Public Property Act, as reported by The Tribune; PTI also lists IPC section 352. The Indian Express, citing police sources before the FIR was lodged, listed IPC sections 147, 148, 149, 352, 353 and 186."
  - type: negotiation
    date: 2023-06-07
    claim: happened
    description: "After Sports Minister Anurag Thakur publicly invited the wrestlers for talks, Bajrang Punia and Sakshi Malik met him at his residence for about six hours; they had met Home Minister Amit Shah a few days earlier. Thakur said the police probe would be completed and a chargesheet filed by 15 June and that WFI elections would be held by 30 June. The wrestlers said the government had also agreed to withdraw the 28 May FIRs against them. They suspended the protest until 15 June, and Punia said they would resume it if no action was taken by then."
    actor: centre
    sources: [s26, s27, s6]
  - type: other
    date: 2023-06-15
    claim: ordered
    description: "Delhi Police filed a chargesheet in the Rouse Avenue court against Brij Bhushan Sharan Singh under IPC sections 354, 354A and 354D on the complaints of six adult wrestlers, and against former WFI assistant secretary Vinod Tomar under sections including 354A, 109 (abetment) and 506 (criminal intimidation). In the POCSO Act case, police filed a cancellation report in the Patiala House court after the minor complainant and her father withdrew the allegations in fresh statements before a magistrate. The father said he had filed a false complaint out of anger; a protesting wrestler told ThePrint that the father had said his second statement was made under pressure. Singh denied the allegations when questioned by police."
    actor: police
    sources: [s28, s29, s7]
    legal_basis: "IPC sections 354, 354A and 354D (Singh); IPC sections including 109, 354A and 506 (Tomar); cancellation report under Section 173 CrPC (POCSO case)"
    court_outcomes:
      - summary: "On 10 May 2024 Additional Chief Metropolitan Magistrate Priyanka Rajpoot ordered charges to be framed against Singh under IPC sections 354 and 354A for five of the six complainants and under section 506(1) for two of them, and discharged him of the sixth complainant's allegations. She ordered a charge of criminal intimidation against Tomar for one complainant and discharged him of abetment."
        source: s30
      - summary: "On 26 May 2025 a Delhi court accepted the police cancellation report in the POCSO case."
        source: s31
      - summary: "On 3 August 2026 Additional Chief Judicial Magistrate Ashwani Panwar acquitted Singh and Tomar, holding that the prosecution had failed to prove the allegations beyond reasonable doubt. On 28 September 2026 Special Judge Dig Vinay Singh of the Rouse Avenue court issued notice to them on an appeal by four of the wrestlers."
        source: s11
outcome: >
  The wrestlers ended the street protest in June 2023 and continued through the courts. On 3 August 2026
  an Additional Chief Judicial Magistrate acquitted Brij Bhushan Sharan Singh and Vinod Tomar in the
  case filed by six wrestlers, saying the prosecution had failed to prove the allegations beyond
  reasonable doubt. Four wrestlers appealed, and the Rouse Avenue Court issued notice on the appeal in
  September 2026.
positions:
  - party: BJP
    person: Brij Bhushan Sharan Singh
    role_at_time: BJP MP and WFI president, accused
    in_power: true
    date: 2023-01-18
    kind: paraphrase
    statement: Denied the allegations and told reporters that he could be hanged if even one wrestler came forward to say she had been sexually harassed. He later called the allegations politically motivated.
    sources: [s14, s8, s3]
  - party: BJP
    person: Babita Phogat
    role_at_time: BJP leader and former wrestler
    in_power: true
    date: 2023-06-18
    kind: translated
    statement: Denied that she had sought police permission for the wrestlers' Jantar Mantar protest, said she had opposed the sit-in from the start and had urged the wrestlers to meet the Prime Minister or Home Minister, and said Sakshi Malik had become a puppet of the Congress.
    quote:
      text: "Being a female player, I was, am and will always be with all the players of the country, but I was not in favor of this from the beginning of the protest"
      original: "एक महिला खिलाड़ी होने के नाते मैं सदैव देश के सभी खिलाड़ियों के साथ थी, साथ हूँ और सदैव साथ रहूंगी परंतु मैं धरने -प्रदर्शन के शुरुआत से इस चीज़ के पक्ष मैं नहीं थीं"
      language: hi
      translated_by: source
      locator: "Paragraph beginning 'In her tweet Sunday, Phogat wrote'"
      source: s8
    sources: [s8, s32]
  - party: INC
    person: Priyanka Gandhi Vadra
    role_at_time: Congress general secretary, opposition
    in_power: false
    date: 2023-05-28
    kind: translated
    statement: After the 28 May detentions, said the BJP government's arrogance had grown so much that it was trampling the voices of women wrestlers, and called this wrong.
    quote:
      text: "The arrogance of the BJP government has increased so much that the government is mercilessly trampling the voices of our women players under their boots."
      original: "भाजपा सरकार का अहंकार इतना बढ़ गया है कि सरकार हमारी महिला खिलाड़ियों की आवाजों को निर्ममता के साथ बूटों तले रौंद रही है।"
      language: hi
      translated_by: source
      locator: "Paragraph beginning 'The arrogance of the BJP government'"
      source: s22
    sources: [s22, s33]
  - party: INC
    person: Navjot Singh Sidhu
    role_at_time: Congress leader and former cricketer, opposition
    in_power: false
    date: 2023-05-01
    kind: verbatim
    statement: Questioned the delay in registering the FIR against Singh, said the motive was to protect the accused, and asked why he had not been arrested when cases under the POCSO Act are non-bailable.
    quote:
      text: "Intent is questionable and motive is to protect the accused."
      locator: "Paragraph beginning 'Intent is questionable'"
      source: s9
    sources: [s9]
