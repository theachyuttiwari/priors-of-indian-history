id: kashmir-unrest-2016
title: Kashmir unrest after the killing of Burhan Wani, 2016
summary: >
  Security forces killed Hizbul Mujahideen commander Burhan Wani in Kokernag, Anantnag,
  on 8 July 2016. Mass protests followed across the Kashmir Valley. The PDP-BJP state
  government imposed curfew and other restrictions, mobile internet and phone networks were
  suspended, and newspaper printing was halted for several days, while security forces used
  pellet guns on crowds. The Union Home Minister announced an expert committee on
  alternatives to pellet guns on 21 July.
period:
  start: 2016-07-08
  end: 2016-11-02
location:
  states: [Jammu and Kashmir]
  places: [Srinagar, Anantnag, Pulwama, Shopian, Kulgam, Tral, Sopore, Pampore]
protest:
  cause: Protest against the killing of Burhan Wani; separatist demand for self-determination
  organisers: [Separatist leaders Syed Ali Geelani, Mirwaiz Umar Farooq and Asiya Andrabi called valley-wide shutdowns]
  scale: "Valley-wide. Casualty counts differ by source and date: the Union Home Minister told the Lok Sabha on 21 July that 38 civilians had been killed and 2,180 injured; The Hindu reported a toll of 73 by 2 September; petitioners in the J&K High Court put the number injured at about 4,000"
