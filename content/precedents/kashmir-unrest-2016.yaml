      - { what: persons paid ex gratia for partial disablement (Rs 0.50 lakh each), value: "10", claimed_by: J&K Home Department (affidavit), source: s13 }
    court_outcomes:
      - summary: On 21 September 2016 the J&K High Court declined to prohibit pellet guns in rare and extreme situations until the expert committee reported and the government decided, and said whether force was excessive in a given incident needed a factual finding by a competent authority.
        source: s13
      - summary: On 11 March 2020 the High Court dismissed the petition, holding that the state had met its obligation by ex gratia payments to most of the injured, and that individuals could sue for further compensation.
        source: s13
  - type: other
    date: 2016-07-09
    description: "On 9 July the Amarnath pilgrimage convoy from Jammu was halted, vehicle movement on the Jammu-Srinagar highway between Batote and Banihal was suspended, school board exams were postponed, and train services between Baramulla and Banihal were suspended."
    actor: state
    state: Jammu and Kashmir
    sources: [s16, s4, s7]
  - type: commission_of_inquiry
    date: 2016-07-21
    claim: ordered
    description: "Replying to the Lok Sabha debate on 21 July, Home Minister Rajnath Singh announced an expert committee to recommend non-lethal alternatives to pellet guns, to report within two months. On 26 July he approved a seven-member committee chaired by T. V. S. N. Prasad, Joint Secretary in the Ministry of Home Affairs, with officers of the CRPF, BSF, J&K Police and Ordnance Factory Board and experts from TBRL Chandigarh and IIT Delhi. In Srinagar on 25 August he said an alternative would be given within a few days. Tribune News Service reported that the committee favoured chilli-based PAVA shells, and a government official told PTI on 29 August that pellet guns would not be banned but would be used only in the rarest of rare cases."
    actor: centre
    sources: [s11, s31, s13, s1, s5, s6, s32, s33]
outcome: >
  Curfew and restrictions were lifted and reimposed in stages through August and September 2016.
  A state government committee later identified persons disabled in the disturbances of 8 July to
  2 November 2016 for ex gratia payments. The J&K High Court declined to ban pellet guns in
  September 2016 and dismissed the petition in March 2020.
positions:
  - party: BJP
    person: Rajnath Singh
    role_at_time: Union Home Minister
    in_power: true
    date: 2016-07-21
    kind: paraphrase
    statement: "Replying to the Lok Sabha debate, said everyone was deeply sorry for those killed and injured in Kashmir, that Kashmiri youth were also patriots but some had been misled, and that Pakistan had a key role in the unrest. He said he and the Prime Minister had told security forces to exercise maximum restraint, that someone might have made a mistake somewhere, and that an expert committee would report on alternatives to pellet guns within two months."
    sources: [s11, s6]
  - party: INC
    person: Ghulam Nabi Azad
    role_at_time: Leader of the Opposition, Rajya Sabha
    in_power: false
    date: 2016-07-18
    kind: paraphrase
    statement: "Opening the Rajya Sabha discussion, said his party stood with the government against militancy but that a distinction had to be made between militants and ordinary people. He said about 1,800 people had been injured, most by pellet guns and bullets, asked whether the bullet used against militants should be used against children, old men and women, and asked for the use of pellet guns to be stopped."
    sources: [s12, s24]
  - party: PDP
    person: Mehbooba Mufti
    role_at_time: Chief Minister of Jammu and Kashmir
    in_power: true
    date: 2016-07-28
    kind: paraphrase
    statement: "Told reporters that the police and army had said three militants were hiding in the Kokernag house but did not know who they were, and that Wani might have been given a chance had they known he was there. She said her government, unlike the previous one in 2013, had no time to prepare, and that curfew was imposed so that young people would not come out. Published versions of her words differ."
    sources: [s10, s28]
  - party: PDP
    person: Naeem Akhtar
    role_at_time: State Education Minister and government spokesperson
    in_power: true
    date: 2016-07
    kind: paraphrase
    statement: "Said the restrictions on newspapers were aimed at saving lives and strengthening peace efforts."
    sources: [s2, s25]
  - party: BJP
    person: Venkaiah Naidu
    role_at_time: Union Minister of Information and Broadcasting
    in_power: true
    date: 2016-07-10
    kind: verbatim
    statement: "Said Wani was a Hizbul Mujahideen commander, questioned sympathy for him and for protesters he described as sympathising with a terrorist, and accused Pakistan of influencing Wani's sympathisers."
    quote:
      text: "How can any Indian have sympathy for such people?"
      locator: "paragraph beginning \"(Wani) was a Hizbul Mujahideen commander\""
      source: s27
    sources: [s27, s8]
  - party: NC
    person: Ali Mohammad Sagar
    role_at_time: NC general secretary, opposition
    in_power: false
    date: 2016-07-20
    kind: paraphrase
    statement: "In a letter declining the Chief Minister's invitation to an all-party meeting on 21 July, said the National Conference would not attend, that the meeting came almost two weeks after the unrest began, that there was no effective leadership in the state government, and that the government had mishandled the press ban by first enforcing it and then contradicting it."
    sources: [s29, s30]
