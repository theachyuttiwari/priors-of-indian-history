id: manipur-violence-internet-shutdown-2023
title: Manipur ethnic violence and internet shutdown, 2023-2025
summary: >
  On 3 May 2023 a Tribal Solidarity March called by the All Tribal Students Union Manipur against a
  proposed Scheduled Tribe status for the Meitei community was followed by violence between Meitei and
  Kuki-Zo groups across Manipur. The BJP state government under N. Biren Singh imposed curfews, an
  order issued in the Governor's name authorised magistrates to issue shoot-at-sight orders in extreme
  cases, the army and central forces were deployed, and mobile and broadband internet were suspended
  statewide for months. Whether the Centre formally invoked Article 355 is contested. The Supreme Court
  intervened from May 2023 and in August 2023 appointed a committee of three former judges on violence
  against women and relief, and a former police chief to supervise investigations. Amnesty International
  put the toll at more than 250 killed and over 60,000 displaced by February 2025. Biren Singh resigned
  in February 2025 and President's Rule was in force until February 2026.
period:
  start: 2023-05-03
  end: 2026-02
location:
  states: [Manipur]
  places: [Imphal West, Imphal East, Churachandpur, Bishnupur, Kangpokpi, Tengnoupal, Kakching, Thoubal, Jiribam]
protest:
  cause: "Opposition by tribal groups to Scheduled Tribe status for the Meitei community, after a Manipur High Court order of 27 March 2023; the protest was followed by ethnic violence. Later protests included student protests in Imphal in September 2023 over the killing of two Meitei students"
  organisers: [All Tribal Students Union Manipur (ATSUM) (Tribal Solidarity March)]
  scale: "Statewide ethnic violence. The State of Manipur told the Supreme Court of 150 deaths between 3 May and 9 June 2023; Amnesty International put the toll at more than 250 killed and over 60,000 displaced by February 2025"
