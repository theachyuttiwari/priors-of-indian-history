actions:
  - type: internet_shutdown
    date: 2023-05-03
    claim: ordered
    description: "By an order of the Commissioner (Home) dated 3 May 2023, mobile data was suspended statewide for five days, and an order of 4 May extended the suspension to all internet services including broadband and VSAT, according to the Internet Freedom Foundation (IFF). The orders were renewed every five days and cited the spread of disinformation and false rumours through social media. In Churachandpur and Pherzawl districts internet had been suspended earlier: from 27 April according to IFF, which cites an order of that date, and from 28 April according to SFLC.in. On 7 July the Manipur High Court referred to \"the complete ban imposed by the State Government on providing internet service in the State\". Leased-line and fibre broadband were partly restored on 25 July, and the statewide suspension was lifted on 23 September, according to SFLC.in. On 26 September the Home Department again suspended mobile data and VPN services for five days; The Wire reported that the order cited disinformation, false rumours and the mobilisation of mobs of agitators and demonstrators. SFLC.in reported that the suspension was extended in five-day blocks and relaxed on 3 December 2023 except in areas the state described as still volatile. Counts of the length of the first shutdown differ (see figures)."
    actor: state
    state: Manipur
    sources: [s20, s19, s1, s28]
    figures:
      - { what: days of internet suspension before broadband was partly restored on 25 July 2023, value: "83", claimed_by: SFLC.in, source: s1 }
      - { what: days of statewide internet suspension from 3 May to 23 September 2023, value: "142", claimed_by: SFLC.in, source: s1 }
      - { what: days of statewide internet suspension from 3 May to 23 September 2023, value: "143", claimed_by: The Wire, source: s28 }
  - type: curfew
    date: 2023-05-03
    claim: ordered
    legal_basis: Section 144 CrPC, 1973 (as quoted from an Imphal East District Magistrate circular referring to an order of 3 May 2023)
    description: "Deccan Herald reported that curfew was imposed on 3 May in Imphal West, Kakching, Thoubal, Jiribam and Bishnupur districts and in Churachandpur, Kangpokpi and Tengnoupal districts. An Imphal East District Magistrate circular of June 2023, quoted by ANI, referred to a total public curfew under Section 144 CrPC imposed in that district by an order of 3 May 2023, and relaxed it for set hours. Al Jazeera reported in August 2023 that a curfew remained in force in most parts of the state. PTI reported that on 27 September 2023 curfew in Imphal East and Imphal West was relaxed for daytime hours, and quoted the notification as saying the relaxation did not include gatherings, sit-ins or rallies without approval."
    actor: state
    state: Manipur
    sources: [s26, s27, s25, s5, s31]
  - type: other
    date: 2023-05-04
    claim: ordered
    legal_basis: Code of Criminal Procedure, 1973 (as named in Order No. H-3608/2/2023-HD-HD)
    description: "Shoot-at-sight authorisation. By Order No. H-3608/2/2023-HD-HD of 4 May 2023, issued by the Commissioner (Home) in the name of the Governor of Manipur and citing the situation after the Tribal Solidarity March of 3 May, the state authorised all District Magistrates, Sub-Divisional Magistrates and Executive Magistrates/Special Executive Magistrates to issue shoot-at-sight orders 'in extreme cases whereby all forms of persuasion, warning, reasonable force, etc. had been exhausted under the provisions of law under CrPC, 1973 and the situation could not be controlled'."
    actor: state
    state: Manipur
    sources: [s23, s24, s2]
  - type: other
    date: 2023-05-04
    claim: happened
    description: "Article 355 and security control (contested). Media reports on 4 and 5 May, citing unnamed sources, said the Centre had invoked Article 355 of the Constitution and taken charge of security, and that the Home Ministry had appointed Kuldip Singh, a former head of the CRPF, as security adviser. The Wire later reported that the state's then police chief had also said at a press conference that Article 355 had been imposed. The Morung Express reported on 4 May that there was no official notice of this from either the State or the Central Government. In its statement to the Supreme Court on 8 May, the Union Government said a senior former police officer had been appointed Security Adviser by the State Government. On 1 August 2023 The Wire reported that the Ministry of Home Affairs, replying to an RTI application, said it held no information on any notification under Article 355 issued between January and 13 June 2023. Whether Article 355 was formally invoked is contested."
    actor: centre
    sources: [s2, s3, s24, s4, s7]
  - type: other
    date: 2023-05-08
    claim: happened
    description: "The Union Government told the Supreme Court on 8 May that central armed police companies and Army and Assam Rifles columns had been deployed (see figures), flag marches held, and helicopters and drones used to monitor the situation."
    actor: centre
    sources: [s7]
    figures:
      - { what: companies of Central Armed Police Forces deployed, value: "52", claimed_by: Union Government (statement to the Supreme Court), source: s7 }
      - { what: columns of the Army and Assam Rifles deployed, value: "105", claimed_by: Union Government (statement to the Supreme Court), source: s7 }
  - type: other
    date: 2023-07-07
    claim: held
    description: "In Aribam Dhananjoy Sharma v. State of Manipur (PIL No. 25 of 2023 and connected cases), the Manipur High Court on 7 July 2023 directed the Home Department to lift the ban on internet through Internet Lease Lines throughout the state once the safeguards suggested by an expert committee were in place, allowed fibre-to-the-home connections to be restored case by case, and directed the state to carry out a physical trial of internet access for whitelisted mobile numbers and report back. The state challenged the order. On 17 July 2023 the Supreme Court recorded the Solicitor General's statement that the state would take any difficulties in implementation to the High Court, did not enter the merits, and disposed of the petition. On 1 December 2023, according to Bar & Bench and SFLC.in, the High Court said the state could not continue the mobile internet ban in the entire state."
    actor: court
    sources: [s20, s21, s22, s1]
  - type: commission_of_inquiry
    date: 2023-08-07
    claim: ordered
    description: "In Dinganglung Gangmei v. Mutum Churamani Meetei, the Supreme Court constituted a committee of three former High Court judges, Justices Gita Mittal, Shalini Phansalkar Joshi and Asha Menon, to inquire into violence against women in Manipur from 4 May 2023 and to report on relief and rehabilitation. It appointed former Maharashtra DGP Dattatray Padsalgikar to supervise the CBI's investigation of the FIRs transferred to it and the state's investigation of the rest, and asked him to investigate allegations that some police officers colluded with perpetrators. The judgment records figures from the State of Manipur's status report of 1 August 2023 (see figures)."
    actor: court
    sources: [s7]
    figures:
      - { what: FIRs registered as of 25 July 2023, value: "6,523", claimed_by: State of Manipur (status report to the Supreme Court), source: s7 }
      - { what: deaths between 3 May and 9 June 2023, value: "150", claimed_by: State of Manipur (status report to the Supreme Court), source: s7 }
      - { what: persons injured, value: "502", claimed_by: State of Manipur (status report to the Supreme Court), source: s7 }
      - { what: persons arrested in connection with the FIRs, value: "252", claimed_by: State of Manipur (status report to the Supreme Court), source: s7 }
      - { what: preventive arrests, value: "12,740", claimed_by: State of Manipur (status report to the Supreme Court), source: s7 }
  - type: tear_gas
    date: 2023-09-26
    claim: happened
    description: "Students in Imphal protested on 26 September 2023 against the killing of two Meitei students, Hijam Linthoingambi and Phijam Hemjit, who had been missing since July. Police fired tear gas, according to The Wire and Anadolu. The Wire, citing sources and video, and PTI reported that protesters were also baton-charged, and PTI reported that Rapid Action Force personnel fired rubber bullets in Singjamei that night. Counts of the injured differ (see figures). In a press statement reported by The Wire, Manipur Police said some protesters used iron pieces and stones against security forces and that minimum force was used to disperse them. Protests and the use of force continued on 27 September. The state reimposed the mobile internet suspension on 26 September (see the internet shutdown action)."
    actor: police
    state: Manipur
    sources: [s28, s30, s29, s31]
    figures:
      - { what: protesters injured on the night of 26 September, mostly students, value: "45", claimed_by: PTI, source: s31 }
      - { what: students with minor injuries, value: "47", claimed_by: an official at the central control room (to Anadolu), source: s30 }
      - { what: people injured over 26-27 September, value: "at least 83", claimed_by: The Wire, source: s29 }
      - { what: persons detained for violations in different districts, value: "1,697", claimed_by: Manipur Police (press statement), source: s29 }
  - type: other
    date: 2025-02-13
    claim: ordered
    legal_basis: Article 356 of the Constitution
    description: "President's Rule was imposed in Manipur under Article 356 after Chief Minister N. Biren Singh resigned, with the Assembly kept in suspended animation. It was extended in August 2025 for six months. ANI reported that the President revoked the proclamation with effect from 4 February 2026, after the BJP named Yumnam Khemchand Singh as its legislature party leader; he became Chief Minister in February 2026."
    actor: centre
    sources: [s33, s10, s9, s34, s35, s6]
outcome: >
  SFLC.in described the internet shutdown as the longest in India in 2023 and the longest outside
  Kashmir. Biren Singh resigned in February 2025 and President's Rule ran from 13 February 2025 to
  4 February 2026, when it was revoked and a BJP government under Yumnam Khemchand Singh took office.
  Amnesty International put the death toll at more than 250 and the number displaced at over 60,000 by
  February 2025.
positions:
  - party: BJP
    person: Narendra Modi
    role_at_time: Prime Minister
    in_power: true
    date: 2023-07-20
    kind: translated
    statement: "Speaking to the media at the start of the Monsoon Session of Parliament, said the incident in Manipur was a shameful act for any civilised society, asked all Chief Ministers to strengthen law and order, especially for the safety of women, naming Rajasthan, Chhattisgarh and Manipur, and said no wrongdoer would be spared."
    quote:
      text: "Today, as I stand among you in the temple of democracy, my heart is filled with sorrow and anger over the incident in Manipur. This incident is a shameful act for any civilized society."
      original: "आज जब मैं आपके बीच आया हूं इस लोकतंत्र के मंदिर के पास खड़ा हूं तब मेरा ह्दय पीढ़ा से भरा हुआ है, क्रोध से भरा हुआ है मणिपुर की जो घटना सामने आई है किसी भी सभ्य समाज के लिए ये शर्मसार करने वाली घटना है।"
      language: hi
      translated_by: source
      locator: "paragraph beginning \"Today, as I stand among you\" (Hindi original on s15)"
      source: s14
    sources: [s14, s15, s8]
  - party: BJP
    person: Narendra Modi
    role_at_time: Prime Minister, on his first visit to Manipur since the violence began
    in_power: true
    date: 2025-09-13
    kind: translated
    statement: "Speaking in Churachandpur, urged all organisations to move forward on the path of peace and said he and the Government of India were with the people of Manipur. Speaking in Imphal later the same day, said any form of violence in Manipur was most unfortunate and a grave injustice to ancestors and future generations."
    quote:
      text: "Today, I assure you that I am with you, the Government of Bharat is with you, and with the people of Manipur."
      original: "और मैं आज आपको वादा करता हूं, मैं आपके साथ हूं, भारत सरकार आपके साथ है, मणिपुर के लोगों के साथ है।"
      language: hi
      translated_by: source
      locator: "paragraph beginning \"Establishing peace is essential\" (Hindi original on s17)"
      source: s16
    sources: [s16, s17, s18, s12]
  - party: AAP
    person: Sanjay Singh
    role_at_time: Rajya Sabha MP, opposition
    in_power: false
    date: 2025-03-17
    kind: paraphrase
    statement: "Speaking in the Rajya Sabha, asked when the Prime Minister, then visiting Mauritius, would go to Manipur, and asked him to embrace the people of Manipur as he embraced leaders abroad. He also demanded a probe into leaked audio tapes allegedly linking former Chief Minister N. Biren Singh to the conflict; the chair asked him to authenticate the claim."
    sources: [s13]
  - party: BJD
    person: Sulata Deo
    role_at_time: Rajya Sabha MP, opposition
    in_power: false
    date: 2025-03-17
    kind: paraphrase
    statement: "Speaking in the Rajya Sabha, said the Prime Minister had time to travel abroad but not to go to Manipur, that he had not visited the state since 2022 but had gone abroad 40 times, and compared the state and central governments to Nero while Rome burned."
    sources: [s13]
