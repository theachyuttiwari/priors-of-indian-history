id: anti-caa-shaheen-bagh-2019-2020
title: Anti-CAA protests and the Shaheen Bagh sit-in, December 2019 - March 2020
summary: >
  Protests against the Citizenship (Amendment) Act, 2019 spread across India in December 2019.
  Delhi Police entered the Jamia Millia Islamia campus on 15 December 2019, and the same day a
  sit-in led largely by women closed the Kalindi Kunj-Shaheen Bagh road in Delhi. Uttar Pradesh,
  governed by the BJP under Yogi Adityanath, imposed Section 144 statewide, suspended mobile
  internet in many districts and demanded payment for property damage from protesters. Delhi Police
  cleared Shaheen Bagh on 24 March 2020 during the COVID-19 lockdown, and the Supreme Court later
  held that public ways cannot be occupied indefinitely for protest.
period:
  start: 2019-12-15
  end: 2020-03-24
location:
  states: [Delhi, Uttar Pradesh, Karnataka]
  places: [Shaheen Bagh, Jamia Millia Islamia, New Friends Colony, Lucknow, Sambhal, Aligarh, Mau, Ghaziabad, Azamgarh, Rampur, Meerut, Bijnor, Bengaluru]
protest:
  cause: Repeal of the Citizenship (Amendment) Act, 2019 and opposition to the proposed NPR and NRC
  organisers: [Students of Jamia Millia Islamia; local residents and women of Shaheen Bagh; the Supreme Court noted an absence of leadership at Shaheen Bagh]
  scale: Nationwide protests; at least 27 deaths nationwide by 27 December 2019, most of them in Uttar Pradesh; Shaheen Bagh road closed for about 100 days
government:
  centre:
    party: BJP
    alliance: NDA
    head: Narendra Modi
    role: Prime Minister
  state:
    party: AAP
    head: Arvind Kejriwal
    role: Chief Minister
    name: Delhi
actions:
  - type: lathi_charge
    date: 2019-12-15
    claim: happened
    description: "Delhi Police, which reports to the Union Home Ministry, entered the Jamia Millia Islamia campus on the evening of 15 December after clashes nearby in which buses were set on fire, and used batons on people inside, including in the reading rooms of the two library buildings. The chief proctor and the Vice-Chancellor said police entered without permission. Students said police beat people who were studying in the library and not protesting; library staff described broken doors, smashed CCTV cameras and blood on the floor. A senior police officer, Chinmoy Biswal, said about 4,000 people were protesting, police acted to disperse them when the crowd burned buses, police entered the campus to maintain order, and six officers were wounded. In a June 2020 reply to petitions in the Delhi High Court, Delhi Police called the allegations of police brutality an 'utter falsehood' and said it had to enter the university because rioters were using it as a shield to throw stones. Accounts are contested."
    actor: police
    state: Delhi
    sources: [s13, s14, s15, s47, s1, s16]
    figures:
      - { what: "people protesting near Jamia on 15 December", value: "about 4,000", claimed_by: "Chinmoy Biswal, senior Delhi Police officer (quoted by Al Jazeera)", source: s1 }
      - { what: "police officers wounded", value: "6", claimed_by: "Chinmoy Biswal, senior Delhi Police officer (quoted by Al Jazeera)", source: s1 }
      - { what: "people injured", value: "about 200, many of them students", claimed_by: "Najma Akhtar, Jamia Vice-Chancellor", source: s14 }
      - { what: "people with injuries brought to al-Shifa and Holy Family hospitals", value: "more than 100", claimed_by: hospital officials (quoted by Al Jazeera), source: s1 }
  - type: tear_gas
    date: 2019-12-15
    claim: happened
    description: "Students and library staff said police fired tear gas inside the Jamia library reading rooms, and that students broke windows to escape the smoke; reporters found the remains of tear gas shells there the next day. Al Jazeera reported that tear gas was fired into some classrooms. A senior officer, Chinmoy Biswal, said: \"If it had been a peaceful mob, it would have been dispersed peacefully.\""
    actor: police
    state: Delhi
    sources: [s13, s15, s1]
    figures:
      - { what: "people with injuries brought to al-Shifa and Holy Family hospitals", value: "more than 100", claimed_by: hospital officials (quoted by Al Jazeera), source: s1 }
  - type: detention
    date: 2019-12-15
    claim: happened
    description: "Police took students to the Kalkaji and New Friends Colony police stations after the Jamia action and released them early on 16 December, after protests outside Delhi Police headquarters. Students said some of them were injured and were not given medical aid at the police stations; a lawyer said lawyers were at first not allowed to meet them. Counts differ (see figures). In its June 2020 reply to the Delhi High Court, Delhi Police said that students among the persons temporarily apprehended for verification were handed over to the proctor, and that no student was arrested or detained."
    actor: police
    state: Delhi
    sources: [s1, s17, s18, s16]
    figures:
      - { what: "students detained", value: "nearly 100", claimed_by: Al Jazeera (agency report), source: s1 }
      - { what: "persons detained", value: "16 at New Friends Colony and 38 at Kalkaji police station", claimed_by: The Indian Express, source: s17 }
      - { what: "students detained at Kalkaji police station and released around 4 am", value: "35", claimed_by: "DCP (South East) Chinmoy Biswal (quoted by The Hindu)", source: s18 }
  - type: firing
    date: 2019-12-15
    claim: happened
    description: "Three Jamia students were treated in hospital for what they said were bullet injuries. Delhi Police first said no bullets were fired and that any foreign body could have caused the injuries. The Indian Express reported in January 2020, citing sources, that a case diary of the Southeast district police records that two police personnel fired three bullets at New Friends Colony in front of an ACP-rank officer, and that the personnel said they fired in self-defence. The two FIRs on the violence do not mention police firing. Asked again, DCP Chinmoy Biswal declined to comment while the investigation was under way."
    actor: police
    state: Delhi
    sources: [s19, s2]
    figures:
      - { what: "bullets fired by two police personnel at New Friends Colony", value: "3", claimed_by: "police case diary, as reported by The Indian Express from sources", source: s19 }
  - type: firing
    date: 2019-12-20
    claim: happened
    description: "Deaths in Uttar Pradesh during the protests of 19 to 21 December 2019 are contested. Police officials said police did not open fire on protesters: on 21 December IG (Law and Order) Praveen Kumar said none of the deaths was due to police firing, and DGP O.P. Singh said that not a single bullet was fired at protesters and that protesters died in firing among themselves. On 24 December the Bijnor Superintendent of Police said that a constable had shot Mohammad Suleman in self-defence after being shot himself, the first official admission of police firing in the state; Suleman's family said police took him into a lane and shot him. In Meerut, the families of five men killed on 20 December said police shot them; police said they used baton charges, tear gas and firing to control the crowd but killed no one, and that the men must have been killed by armed protesters. In February 2020 the state told the Allahabad High Court that no one lost his life due to police action."
    actor: police
    state: Uttar Pradesh
    sources: [s24, s25, s26, s4, s5, s6]
    figures:
      - { what: "deaths in Uttar Pradesh from 20 to 21 December, plus one in Lucknow on 19 December", value: "15, plus 1", claimed_by: "IG (Law and Order) Praveen Kumar (quoted by Hindustan Times)", source: s26 }
      - { what: "deaths in Uttar Pradesh", value: "19 of 27 nationwide", claimed_by: Al Jazeera (agency report), source: s6 }
      - { what: "deaths in Uttar Pradesh covered by the state's reply to the Allahabad High Court", value: "22", claimed_by: "UP police submissions (as reported by The Caravan)", source: s25 }
      - { what: "men killed in Meerut on 20 December", value: "5", claimed_by: "families and police records (as reported by The Caravan)", source: s25 }
  - type: lathi_charge
    date: 2019-12-15
    claim: happened
    description: "Police and paramilitary forces (PAC and RAF) entered the Aligarh Muslim University campus on the evening of 15 December 2019 after a clash at the Sir Syed Gate, used batons and tear gas, and entered hostels. Students said police beat them and used abusive language and religious slurs. The Superintendent of Police (City) said about 1,500 students broke the gate and threw stones and about 30 policemen were injured. The university said police entered at its call. On 7 January 2020 the Allahabad High Court asked the NHRC to inquire. LiveLaw reported that the NHRC report found the use of force by police justified and necessary, but criticised policemen seen caning apprehended students and damaging motorcycles; it recommended compensation for six grievously injured students and action against those policemen."
    actor: police
    state: Uttar Pradesh
    sources: [s20, s1, s23, s21, s22]
    figures:
      - { what: "students injured", value: "at least 100, six of them seriously", claimed_by: The Hindu, source: s20 }
      - { what: "students who broke the Sir Syed Gate", value: "about 1,500", claimed_by: "SP (City) Abhishek (quoted by The Hindu)", source: s20 }
      - { what: "policemen injured", value: "about 30", claimed_by: "SP (City) Abhishek (quoted by The Hindu)", source: s20 }
      - { what: "persons detained, of whom at least 15 are not AMU students", value: "26", claimed_by: "Aligarh Muslim University (as reported by The Leaflet)", source: s23 }
    court_outcomes:
      - summary: "On 8 September 2022 the Allahabad High Court dismissed the petitions after the state said it had complied with the NHRC recommendations meant for it."
        source: s22
  - type: section_144
    date: 2019-12-18
    claim: ordered
    description: "Section 144 of the CrPC, which bans unlawful assembly, was enforced in all of Uttar Pradesh on the night of 18 December 2019, ahead of protests planned for 19 December. DGP O.P. Singh said in a post on X (then Twitter) that no permission for any gathering had been given for 19 December. The order was also imposed elsewhere in India."
    actor: state
    state: Uttar Pradesh
    sources: [s27, s28, s3, s4]
    legal_basis: Section 144 CrPC
  - type: section_144
    date: 2019-12-18
    claim: ordered
    description: "Bengaluru Police Commissioner Bhaskar Rao prohibited assemblies of five or more people and any protest, procession or public meeting in the city from 6 am on 19 December to 12 am on 21 December 2019, citing calls for an all-India bandh against the CAA and NRC. On 13 February 2020 the Karnataka High Court held that the order did not stand the test of judicial scrutiny under the parameters laid down by the Supreme Court in Anuradha Bhasin and Ramlila Maidan, and did not formally set it aside only because the order had worked itself out."
    actor: police
    state: Karnataka
    sources: [s37]
    legal_basis: "Section 144 CrPC (Order No. SB/Gu.Va/Prohibition/50/2019 dated 18 December 2019, Commissioner of Police, Bengaluru City)"
    court_outcomes:
      - summary: "On 13 February 2020 the Karnataka High Court (Chief Justice Abhay S. Oka and Justice Hemant Chandangoudar) held the order illegal."
        source: s37
  - type: internet_shutdown
    date: 2019-12-19
    claim: ordered
    description: "An order of the Uttar Pradesh Additional Chief Secretary (Home), Awanish Kumar Awasthi, suspended mobile internet and SMS in Lucknow from 3 pm on 19 December to noon on 21 December 2019, citing possible misuse of SMS and social media to inflame the law and order situation. Internet was also suspended in other districts, including Sambhal, Aligarh, Mau, Ghaziabad and Azamgarh (see figures). On 21 December the suspension was extended, and mobile internet was cut again in many parts of the state, including Lucknow, on 26 December."
    actor: state
    state: Uttar Pradesh
    sources: [s29, s41, s3, s31, s26, s4, s5]
    figures:
      - { what: "districts with internet and SMS suspended on 20 December", value: "14", claimed_by: Hindustan Times, source: s31 }
      - { what: "cities in Uttar Pradesh with mobile internet suspended on 20 December", value: "at least 21", claimed_by: MediaNama, source: s29 }
  - type: other
    date: 2019-12
    claim: ordered
    description: "Recovery of property damage: the Uttar Pradesh government sent show-cause notices demanding payment for damage during the protests and threatened to confiscate property. In March 2020 the Lucknow administration put up roadside banners with the photos, names and addresses of people accused of violence. On 9 March 2020 the Allahabad High Court, acting on its own, held the banners an unwarranted interference in privacy and ordered their removal. On 12 March 2020 the Supreme Court referred the state's appeal to a larger bench without staying the High Court order. On 18 February 2022 the state told the Supreme Court it had withdrawn the show-cause notices issued since December 2019, and the court ordered a refund of amounts recovered, leaving the state free to proceed under its 2020 recovery law."
    actor: state
    state: Uttar Pradesh
    sources: [s6, s7, s33, s34, s32]
    legal_basis: "A government order on recovery of damages, which the state said follows the Supreme Court's guidelines in Re: Destruction of Public and Private Properties (2009); later the Uttar Pradesh Recovery of Damage to Public and Private Property Act, 2020"
    figures:
      - { what: "people from whom payment was demanded (late December 2019)", value: "more than 200", claimed_by: "Uttar Pradesh government (as reported by Al Jazeera)", source: s6 }
      - { what: "people named on the Lucknow banners", value: "53", claimed_by: "Lucknow administration (as reported by Scroll.in)", source: s7 }
      - { what: "show-cause notices withdrawn", value: "274", claimed_by: "State of Uttar Pradesh (recorded in the Supreme Court order)", source: s32 }
    court_outcomes:
      - summary: "On 9 March 2020 the Allahabad High Court ordered the Lucknow District Magistrate and Police Commissioner to remove the banners and told the state not to put up such banners without authority of law."
        source: s33
      - summary: "On 12 March 2020 the Supreme Court sent the state's appeal against that order to a bench of at least three judges."
        source: s34
      - summary: "On 18 February 2022 the Supreme Court recorded the withdrawal of the 274 show-cause notices and ordered refunds, without prejudice to proceedings before the Claims Tribunal under the 2020 Act."
        source: s32
  - type: uapa_charge
    date: 2020-03-06
    claim: ordered
    description: "On 6 March 2020 the Delhi Police Crime Branch registered FIR 59/2020. It alleges that the communal riots in north-east Delhi on 23 to 25 February 2020 were the result of a pre-planned conspiracy by JNU student Umar Khalid and associates, including road blockades by women and children near anti-CAA protest sites. Offences under the UAPA were added later, and students and protest organisers were charged. The accused deny the allegations; Natasha Narwal's counsel, for example, said she took part in the sit-in protests but was not involved in any violent protest. On 15 June 2021 the Delhi High Court granted Narwal bail, holding that the charge-sheet did not prima facie show offences under sections 15, 17 or 18 of the UAPA, and said that 'in its anxiety to suppress dissent', the line between the right to protest and terrorist activity seemed to be getting blurred in the mind of the State. On 18 June 2021 the Supreme Court directed that the High Court's judgment not be treated as a precedent, without interfering with the bail. On 5 January 2026 the Supreme Court refused bail to Umar Khalid and Sharjeel Imam, finding that the prosecution material prima facie attributed to them a central role in the alleged conspiracy, and granted bail to five other accused."
    actor: police
    state: Delhi
    sources: [s40, s38, s39]
    legal_basis: "FIR 59/2020, initially under sections 147, 148, 149 and 120B IPC; UAPA sections added later"
    court_outcomes:
      - summary: "On 15 June 2021 the Delhi High Court granted bail to Natasha Narwal and held that no UAPA offence was prima facie made out against her."
        source: s38
      - summary: "On 18 June 2021 the Supreme Court said the High Court judgment was not to be treated as a precedent, and did not interfere with the bail."
        source: s39
      - summary: "On 5 January 2026 the Supreme Court refused bail to Umar Khalid and Sharjeel Imam and granted bail to Gulfisha Fatima, Meeran Haider, Shifa-ur-Rehman, Mohd. Saleem Khan and Shadab Ahmed."
        source: s40
  - type: other
    date: 2020-03-24
    claim: happened
    description: "Delhi Police cleared the Shaheen Bagh protest site on the morning of 24 March 2020, citing the COVID-19 lockdown and prohibitory orders, after the remaining protesters refused a request to leave. Police removed the tents, stage and art installations; police also cleared the protest sites at Jamia and Hauz Rani. Protest graffiti at Jamia and Shaheen Bagh was painted over the same day: protesters blamed the police, while a senior police officer denied any police role and the South Delhi Municipal Corporation said it was not involved. Three protesters charged with disobeying restrictions on gatherings got bail on 30 March 2020. The Supreme Court judgment says the site was cleared with some police action to remove structures."
    actor: police
    state: Delhi
    sources: [s35, s36, s8, s9, s10]
    legal_basis: "Section 144 CrPC prohibitory orders in Delhi; the FIR against those removed cites the IPC and Section 3 of the Epidemic Diseases Act, 1897"
    figures:
      - { what: "people detained at Shaheen Bagh, including six women", value: "9", claimed_by: "Joint CP (Southern Range) Devesh Srivastava (quoted by The Indian Express)", source: s35 }
      - { what: "people arrested at Shaheen Bagh (four men and six women)", value: "10", claimed_by: "DCP (South East) R.P. Meena (quoted by Hindustan Times)", source: s36 }
  - type: other
    date: 2020-10-07
    description: "Supreme Court judgment in Amit Sahni v Commissioner of Police (Civil Appeal No. 3282 of 2020; Kaul, Bose and Murari JJ). The court held that public ways and public spaces cannot be occupied indefinitely, that dissent must be expressed in designated places, and that the administration ought to keep such areas clear. It also noted that court-appointed interlocutors failed to find a solution and criticised the administration for neither negotiating nor acting."
    actor: court
    sources: [s10]
outcome: >
  The Shaheen Bagh site was cleared on 24 March 2020 during the COVID-19 lockdown. The CAA was not
  repealed. On 7 October 2020 the Supreme Court held that public ways cannot be occupied indefinitely
  for protest.
positions:
  - party: BJP
    person: Yogi Adityanath
    role_at_time: Chief Minister of Uttar Pradesh
    in_power: true
    date: 2019-12-19
    kind: translated
    statement: "Said that the property of those involved in the violence would be confiscated to recover the cost of damage to public property, that they had been identified on video and CCTV footage, and that the government would take revenge on them."
    quote:
      text: "The property of each element involved in this violence will be confiscated, and used to recover compensation for public property which was damaged. All their faces have been identified. They are visible in the videography and CCTV footage. We will take revenge by confiscating their properties, I have ordered strict action."
      original: "Iss hinsa mein lipt pratyek tatwa ki property ko zapt karenge, aur uss zapt se sarvajanik sampatti ko hue nuksaan ya kahin par public property ko jo damage kiya gaya hai, iski bharapaee bhi hum un sabhi upadraviyon se karenge. Kyunki yeh sab chinhit chehre hain. Wo sab videography mein aa chuke hain, CCTV ke footage mein aa chuke hain. In sab ki property ko zapt kar ke, inse hum iska badla lenge aur sakhti se nipatne ke liye maine iske baare mein kaha hai,"
      language: hi
      translated_by: source
      locator: "Second paragraph, beginning 'Taking a tough stand, Chief Minister Yogi Adityanath said', and the translation in brackets after it"
      source: s41
    sources: [s41, s42, s5]
  - party: BJP
    person: Yogi Adityanath
    role_at_time: Chief Minister of Uttar Pradesh
    in_power: true
    date: 2019-12-27
    kind: translated
    statement: "His office's official account on X (then Twitter) said that the strictness of his government had silenced rioters and troublemakers, and that those who caused damage would pay for it."
    quote:
      text: "Every rioter is shocked. Every troublemaker is astonished. Looking at the strictness of the Yogi government, everyone is silent,"
      original: "हर दंगाई हतप्रभ है। हर उपद्रवी हैरान है। देख कर योगी सरकार की सख्ती मंसूबे सभी के शांत हैं।"
      language: hi
      translated_by: source
      locator: "Paragraph under the heading 'Every rioter is shocked'"
      source: s6
    sources: [s43, s6]
  - party: BJP
    person: Amit Shah
    role_at_time: Union Home Minister
    in_power: true
    date: 2020-03-12
    kind: paraphrase
    statement: "Told the Rajya Sabha that no documents would be sought from people during NPR enumeration, that no one would be marked as doubtful, and that there was a need to remove apprehensions over the CAA and NPR."
    sources: [s11, s45]
  - party: INC
    person: Priyanka Gandhi Vadra
    role_at_time: Congress General Secretary, opposition
    in_power: false
    date: 2019-12-21
    kind: paraphrase
    statement: "Accused the government of using repression and violence to suppress the voice of people protesting against the amended citizenship law, and said the NRC and the CAA were against the fundamental spirit of the Constitution."
    sources: [s12]
  - party: BSP
    person: Mayawati
    role_at_time: BSP president, opposition
    in_power: false
    date: 2019-12-21
    kind: translated
    statement: "In a post on X (then Twitter), said that with opposition to the CAA and NRC now coming from within the NDA, the Centre should give up its stubborn stand and withdraw the decisions, and appealed to protesters to protest peacefully."
    quote:
      text: "Now that voices opposed to the CAA and NRC have started coming from within the NDA, the central government should give up its stubborn stand and withdraw its decisions,"
      original: "अब तो नए सीएए व एनआरसी के विरोध में केन्द्र सरकार के एनडीए में भी विरोध के स्वर उठने लगे हैं। अतः बीएसपी की मांग है कि वे अपनी ज़िद को छोड़कर इन फैसलों को वापस ले।"
      language: hi
      translated_by: source
      locator: "Live update timed 11.24 am"
      source: s12
    sources: [s44, s12]
  - party: AAP
    person: Arvind Kejriwal
    role_at_time: Chief Minister of Delhi (in power in Delhi, opposition to the BJP at the centre)
    in_power: true
    date: 2020-03-13
    kind: paraphrase
    statement: "In the Delhi Assembly debate on a resolution against the NPR in its present form, said that people without birth certificates, Hindus as well as Muslims, could be sent to detention centres under the NPR and NRC, and on X (then Twitter) appealed to the Centre to stop the NPR and NRC."
    sources: [s11, s46]
