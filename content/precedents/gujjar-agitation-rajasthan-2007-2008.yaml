id: gujjar-agitation-rajasthan-2007-2008
title: Gujjar reservation agitation in Rajasthan, 2007 and 2008
summary: >
  Gujjars in Rajasthan, led by retired Colonel Kirori Singh Bainsla and the Gujjar Aarakshan
  Sangharsh Samiti, blocked highways and rail lines in May-June 2007 and again in May-June 2008
  to demand Scheduled Tribe status. Police firing at Patoli (Dausa), Bundi and Bonli in 2007 and
  at Pilupura near Bayana (Bharatpur) and Sikandra in 2008 killed dozens of people; the Army and
  central paramilitary forces were deployed both years. The Vasundhara Raje government set up the
  Justice Jasraj Chopra committee in 2007, and in June 2008 agreed to a 5 per cent reservation for
  Gujjars and other communities as a special backward class, which the Rajasthan High Court later stayed.
period:
  start: 2007-05-28
  end: 2008-06-18
location:
  states: [Rajasthan, Delhi, Haryana, Uttar Pradesh]
  places: [Patoli, Peepal Khera, Dausa, Bundi, Bonli, Pilupura, Bayana, Bharatpur, Sikandra, Karwadi]
protest:
  cause: Inclusion of Gujjars in the Scheduled Tribe list of Rajasthan
  organisers: [Gujjar Aarakshan Sangharsh Samiti, Kirori Singh Bainsla]
  scale: Tens of thousands blocked national highways and rail lines across eastern Rajasthan; bandhs in Rajasthan and Delhi
government:
  centre:
    party: INC
    alliance: UPA
    head: Manmohan Singh
    role: Prime Minister
  state:
    party: BJP
    alliance: NDA
    head: Vasundhara Raje
    role: Chief Minister
    name: Rajasthan
actions:
  - type: section_144
    date: 2007-05-28
    claim: ordered
    description: Prohibitory orders under Section 144 CrPC imposed at the planned blockade sites and in six districts ahead of the 29 May highway blockade
    actor: state
    state: Rajasthan
    legal_basis: Section 144 CrPC
    sources: [s1, s2]
  - type: lathi_charge
    date: 2007-05-28
    claim: happened
    description: "The PUCL-PUDR-AFDR fact-finding team said police used lathis and tear gas at Patoli-Peepal Khera from the evening of 28 May. Villagers told Frontline that police beat people there the night before the firing, and staff at a highway outlet said they saw villagers beaten at about 1.30 a.m. on 29 May. The official version, as reported by Outlook, was that police used a lathi charge and tear gas on the morning of 29 May after about 30,000 Gujjars blocking the highway refused to disperse"
    actor: police
    state: Rajasthan
    sources: [s1, s34, s2]
  - type: firing
    date: 2007-05-29
    claim: happened
    description: "Police fired on Gujjars at Patoli-Peepal Khera on the Jaipur-Agra highway (Dausa) and at the Dev Narayan temple in Bundi on 29 May, and in Sawai Madhopur district, including Bonli, on 31 May. Home Minister Gulab Chand Kataria said the police fired as a last resort, in self-defence and under extreme provocation from armed crowds. The PUCL-PUDR-AFDR team said the firing was unwarranted, that police fired at Patoli at about 7.30 a.m. when the highway was not blocked, and that at least three of the dead there were shot in the back. Frontline reported that at Bundi and Peepalkheda police fired on unarmed people early in the morning, before the planned blockade began. Death tolls differ by source and by date"
    actor: police
    state: Rajasthan
    sources: [s27, s28, s29, s30, s9, s33, s34, s1, s2, s4]
    figures:
      - { what: killed on 29 May in police firing and violence at Patoli-Peepalkheda and Bundi, including a policeman, value: "13", claimed_by: The Hindu (Sunny Sebastian), source: s27 }
      - { what: killed on 29 May in violence and police firing in Dausa and Bundi districts, including a policeman, value: "14", claimed_by: UNI, source: s4 }
      - { what: killed in police firing at two places in Sawai Madhopur district on 31 May, value: "4", claimed_by: The Hindu (Sunny Sebastian), source: s29 }
      - { what: official death toll of the agitation by 3 June, value: "25", claimed_by: Government of Rajasthan (as reported by The Hindu), source: s30 }
      - { what: killed at the five sites the team visited (police firing and caste attack), including two constables, value: "25", claimed_by: PUCL Rajasthan-PUDR-AFDR fact-finding team, source: s1 }
      - { what: killed in police firing, value: "21", claimed_by: Frontline (T.K. Rajalakshmi), source: s33 }
      - { what: killed in inter-community clashes, value: "5", claimed_by: Frontline (T.K. Rajalakshmi), source: s33 }
  - type: other
    date: 2007-05-29
    claim: happened
    description: "Army columns were called out on 29 May: six columns from Jaipur and two from Mahuwa to Dausa, and two from Kota to Bundi, for flag marches, according to the state Home Minister. The Army was put on alert in Alwar and Bharatpur, and troops held a flag march in Kota on 31 May. The Centre sent 24 companies of central paramilitary forces on 29 May. By 5 June, 39 Army columns and 36 companies of central forces were being withdrawn"
    actor: state
    state: Rajasthan
    sources: [s27, s28, s50, s29, s11, s2, s5]
  - type: detention
    date: 2007-06
    claim: happened
    description: Outlook reported that several hundred Gujjars were arrested on charges including arson, destruction of public property and attacking police, and that Bainsla was charged with murder. The PUCL-PUDR-AFDR team said arrests were being made arbitrarily and asked for the release of those in custody
    actor: police
    state: Rajasthan
    sources: [s9, s1]
  - type: negotiation
    date: 2007-06-04
    claim: happened
    description: Bainsla met Chief Minister Raje at her residence in Jaipur on 4 June, in the fifth round of talks and the first in which the two spoke directly. After about six hours they issued a joint statement, and the Samiti called off the agitation and lifted the blockades
    actor: state
    state: Rajasthan
    sources: [s31, s9, s34, s1, s5]
  - type: commission_of_inquiry
    date: 2007-06-07
    claim: ordered
    description: "The 4 June joint statement provided for a three-member high-level committee, headed by a retired High Court judge, to report within three months. A notification of 7 June 2007 constituted the committee with Justice Jasraj Chopra (retd) as chairperson, and a notification of 12 June 2007 set its terms of reference: to examine the Gujjar demand against the Government of India's criteria for inclusion in the Scheduled Tribes. The committee reported on 15 December 2007. It did not support ST status, and recommended a special development fund and area-based measures for Gujjars in remote areas"
    actor: state
    state: Rajasthan
    sources: [s37, s36, s31, s8, s22]
  - type: concession
    date: 2008-05
    claim: ordered
    description: A committee under BJP leader Ramdas Agarwal, formed to make an action plan on the Chopra committee's suggestions, proposed a special package of Rs 282 crore for Gujjar-dominated areas, which the government announced in May 2008. Bainsla rejected it and called a rail roko for 23 May 2008
    actor: state
    state: Rajasthan
    sources: [s22, s38]
  - type: section_144
    date: 2008-05-23
    claim: ordered
    description: Prohibitory orders under Section 144 CrPC imposed after the Pilupura clash. The Hindu and UNI reported six districts, including Jaipur; PTI, citing official sources, reported four Gujjar-dominated districts
    actor: state
    state: Rajasthan
    legal_basis: Section 144 CrPC
    sources: [s38, s12, s49]
  - type: firing
    date: 2008-05-23
    claim: happened
    description: "On 23 May police fired on Gujjars at the rail roko near Pilupura and Dumariya, Bayana tehsil, Bharatpur, on the Delhi-Mumbai line; a crowd lynched a head constable of the Rajasthan Armed Constabulary. Officials said police fired after tear gas and rubber bullets failed to stop the crowd. The state ordered a judicial inquiry by retired High Court judge F.C. Bansal. On 24 May police fired at Sikandra, Dausa, where the DGP said a crowd of 2,000-2,500 armed protesters attacked the police station. Tolls for both days are contested"
    actor: police
    state: Rajasthan
    sources: [s38, s39, s48, s22, s16, s49, s12, s13, s14, s17, s26, s21]
    figures:
      - { what: killed at Bayana on 23 May (deaths in police firing confirmed by the Home Minister, plus one in mob violence; seven more bodies held by Gujjars), value: "4 + 1", claimed_by: Rajasthan Home Minister Gulab Chand Kataria, source: s38 }
      - { what: killed at Bayana on 23 May, including the head constable, value: "15", claimed_by: Home Minister Kataria and police (as reported by UNI), source: s13 }
      - { what: killed on 23 May (16 in police firing and three police personnel), value: "19", claimed_by: Rajasthan Pradesh Congress Committee, source: s38 }
      - { what: killed on 23 May, value: "14", claimed_by: Kirori Singh Bainsla, source: s12 }
      - { what: killed in police firing at Sikandra on 24 May, value: "4", claimed_by: Home Commissioner V.S. Singh and DGP A.S. Gill, source: s39 }
      - { what: killed in police firing at Sikandra on 24 May, value: "18", claimed_by: The Hindu (Sunny Sebastian), source: s39 }
      - { what: victims of the Sikandra police firing whose post-mortems the state decided to conduct, value: "14", claimed_by: The Tribune (Chitleen K Sethi), source: s48 }
      - { what: firing victims whose bodies were at the Pilupura dharna site, value: "16", claimed_by: Rajasthan official S.N. Thanvi (as reported by UNI), source: s26 }
      - { what: total killed since 23 May, by 25 May, value: "at least 36", claimed_by: UNI, source: s14 }
      - { what: total killed in the 2008 agitation in Rajasthan, value: "39", claimed_by: The Hindu (Sunny Sebastian), source: s45 }
  - type: other
    date: 2008-05-23
    claim: happened
    description: "The Army, the Rapid Action Force and the CRPF were called out; 10 Army columns moved into the Bharatpur-Karauli-Sawai Madhopur belt, and by 27 May a further 22 Army columns and 76 columns of other security forces were deployed in the affected districts. Arab News reported that the Army blockaded the Karwadi-Pilupura area and cut off food supplies, that mobile signals were jammed and that the state took some news channels off air. Chitleen K Sethi wrote in The Tribune that the Army was called in but never used, and that the protest site was fenced in, water and electricity to the villages feeding the protesters were cut off and mobile phone jammers were installed"
    actor: state
    state: Rajasthan
    sources: [s38, s16, s13, s17, s22]
  - type: other
    date: 2008-05-25
    claim: happened
    description: The Union Home Ministry sent about 21 companies of central forces (CRPF, RAF and BSF) to Rajasthan and four to Haryana, issued advisories to Delhi, Haryana and Uttar Pradesh, and put the National Capital Region on high alert before the Gujjars' 29 May NCR bandh
    actor: centre
    sources: [s47, s46, s14, s16]
  - type: negotiation
    date: 2008-05-25
    claim: happened
    description: "The Chief Minister's Office invited Bainsla to talks in Jaipur on 25 May; he declined, stayed at the Pilupura rail-track dharna with the bodies of the dead, and asked that talks be held at the site. Officials said Raje flew to Bayana that day and stayed about 40 minutes to try to meet Bainsla; Bainsla said no effort was made to contact him"
    actor: state
    state: Rajasthan
    sources: [s39, s14, s17]
  - type: concession
    date: 2008-05-26
    claim: ordered
    description: After a Cabinet meeting, Raje wrote to Prime Minister Manmohan Singh recommending 4 to 6 per cent reservation for Gujjars in the category of denotified or nomadic tribes, and asked the Centre to decide the ST question. The Prime Minister referred the letter to the Law Ministry. Bainsla rejected the letter as a farce
    actor: state
    state: Rajasthan
    sources: [s15, s40, s16]
  - type: nsa_detention
    date: 2008-05-27
    claim: ordered
    description: The state invoked the National Security Act in 15 districts and empowered the district collectors to act against agitators. The government said about 150 people had been arrested in agitation-related cases. Police filed cases against Bainsla over the killing of the head constable at Bayana, and the Rajasthan High Court summoned him on a contempt petition filed by the state for breach of an undertaking he gave in 2007 to maintain law and order
    actor: state
    state: Rajasthan
    legal_basis: National Security Act, 1980
    sources: [s16, s41]
    figures:
      - { what: arrested in agitation-related cases, value: "about 150", claimed_by: Government of Rajasthan (as reported by The Tribune), source: s16 }
      - { what: booked under the National Security Act, value: "50", claimed_by: The Hindu (Sunny Sebastian), source: s41 }
  - type: negotiation
    date: 2008-06-08
    claim: happened
    description: The state and the Samiti agreed to hold the first round of talks at Bayana on 9 June, with the main talks in Jaipur. The state's negotiator, Principal Secretary S.N. Thanvi, was camping at Bayana; the government asked Bainsla to cut his 45-member delegation and leave out leaders from other states
    actor: state
    state: Rajasthan
    sources: [s43, s19]
  - type: concession
    date: 2008-06-18
    claim: ordered
    description: "Talks between a Gujjar delegation led by Bainsla and a government team led by BJP leader Ramdas Agarwal concluded on 17 June. On 18 June Raje, Bainsla and Agarwal announced the agreement at a joint press conference, ending the 27-day agitation. It gave 5 per cent special reservation to Gujjars, Banjaras, Gadia Lohars and Raikas. The state enacted it in a 2008 Act that created a 5 per cent quota for special backward classes. Gujjar leaders spoke of a letter to the Centre on ST status; BJP leaders said the letter would reply to a 1999 letter from the Centre"
    actor: state
    state: Rajasthan
    sources: [s45, s44, s20, s36, s37, s21]
  - type: other
    date: 2009-10-12
    claim: held
    description: "The 2008 Act was published in the Rajasthan Gazette on 31 July 2009, and a notification of 25 August 2009 placed the four communities in the special backward class list. On writ petitions by Captain Gurvinder Singh and others, a Division Bench of the Rajasthan High Court passed an interim order on 12 October 2009 restraining reservation above 50 per cent. On 22 December 2010 it found that no quantifiable data had been collected, directed the state not to give effect to Sections 3 and 4 of the 2008 Act, referred the matter to the State Backward Classes Commission for a study within one year, and said the stay would continue until the matter was decided afresh"
    actor: court
    sources: [s36, s37, s23, s24, s25]
outcome: >
  The 2007 agitation ended on 4 June 2007 with a committee that later advised against ST status.
  The 2008 agitation ended on 18 June 2008 with a 5 per cent special backward class quota,
  which the Rajasthan High Court stayed in 2009 and 2010 for breaching the 50 per cent ceiling.
  The ST demand was not conceded.
