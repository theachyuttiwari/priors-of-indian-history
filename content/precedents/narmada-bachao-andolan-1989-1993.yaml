id: narmada-bachao-andolan-1989-1993
title: Narmada Bachao Andolan and Sardar Sarovar, 1989-1993
summary: >
  The Narmada Bachao Andolan (NBA), led by Medha Patkar with Baba Amte, opposed the Sardar
  Sarovar dam over displacement and environmental damage. Patkar led a long march from Madhya
  Pradesh towards the dam site, which police resisted, and undertook a 22-day hunger strike in
  1991. The World Bank set up an independent review (the Morse review), which called the project
  ill-conceived. In 1993 the Government of India stopped drawing on the World Bank loan and chose
  to finish the project with national resources.
