id: narmada-bachao-andolan-1989-1993
title: Narmada Bachao Andolan and Sardar Sarovar, 1989-1993
summary: >
  The Narmada Bachao Andolan (NBA), led by Medha Patkar with Baba Amte, opposed the Sardar
  Sarovar dam over displacement and environmental damage. From 25 December 1990 Patkar led a march
  from Madhya Pradesh towards the dam site; Gujarat police stopped it at Ferkuwa on the state border,
  and Patkar and others began a hunger strike there on 7 January 1991. In June 1991 the World Bank
  commissioned an independent review headed by Bradford Morse, whose June 1992 report found
  deficiencies in the Bank's appraisal and in the project's implementation; the Government of India
  and the Government of Gujarat did not accept it. On 29 March 1993 the Government of India asked the
  World Bank to cancel the rest of its loan and chose to complete the project on its own.
