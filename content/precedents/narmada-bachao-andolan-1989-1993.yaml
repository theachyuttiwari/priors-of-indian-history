actions:
  - type: barricading
    date: 1991-01
    claim: happened
    legal_basis: "Section 144 CrPC: a prohibitory order on assembly between Ferkuwa and the Madhya Pradesh border, as reported in Abhiyan"
    description: "Gujarat police stopped the march at Ferkuwa on the Gujarat-Madhya Pradesh border and did not let the marchers through to the dam site. Abhiyan reported a camp of Gujarat Police and State Reserve Police at Ferkuwa, a Section 144 order on the Gujarat side, and that on 2 January 1991 the district collector, with the police, stopped 25 protesters who then sat on the road all day. Asia Watch reported, citing the Times of India, that marchers who crossed the border on 4 January were pushed back and detained. Asia Watch also reported that on 25 January police from Maharashtra and Gujarat charged into the group, arrested scores and beat them with canes. The Caravan, from later interviews with marchers, reported that many were beaten, arrested and moved kilometres from the border. Gujarat Chief Minister Chimanbhai Patel said in an India Today debate in November 1992: \"There have been no human rights violations.\""
    actor: police
    state: Gujarat
    sources: [s6, s7, s14, s9]
    figures:
      - { what: Gujarat Police and State Reserve Police personnel in the camp at Ferkuwa, value: "about 1,500", claimed_by: Abhiyan (Sheela Bhatt), source: s6 }
      - { what: Adivasi marchers camped on the Madhya Pradesh side of the border, value: "about 2,000", claimed_by: Abhiyan (Sheela Bhatt), source: s6 }
      - { what: marchers detained after crossing the border on 4 January 1991, value: "140", claimed_by: Times of India (cited by Asia Watch), source: s7 }
  - type: detention
    date: 1991-11-17
    claim: happened
    description: "Maharashtra police arrested Medha Patkar in Dhule district shortly before she was to leave for Stockholm to receive the Right Livelihood Award on behalf of the NBA. Asia Watch reported that she was arrested on 17 November 1991 on charges pending from NBA demonstrations since 1990, including unlawful assembly, and released on 19 November. India Today reported that her arrest drew international protest and that she was released the next day. Asia Watch also reported earlier detentions of Patkar at protests in Kevadia (January 1990) and Kasravad (September 1990), and the Goldman Prize citation says she was repeatedly beaten and arrested by police during her protests."
    actor: police
    state: Maharashtra
    sources: [s8, s7, s3]
  - type: other
    date: 1993-03-29
    claim: ordered
    description: "By a letter of 29 March 1993 the Government of India asked the World Bank to cancel the remaining undisbursed portion of its loan for the Sardar Sarovar dam and power project, and decided to complete construction on its own. The World Bank announced the decision on 30 March and put the cancelled amount at about $170 million of a $450 million package approved in 1985. In October 1992 the Bank's Executive Directors had made continued support depend on benchmarks for resettlement and environment, to be met by 31 March 1993. The Bank had commissioned the independent review in June 1991; its President said in June 1992 that the review had identified deficiencies in the Bank's appraisal, in the borrower's implementation and in the Bank's supervision."
    actor: centre
    sources: [s10, s11, s12, s14]
outcome: >
  The World Bank formally cancelled the loan and the government continued the project with its own
  funds. The Supreme Court suspended further construction in 1995. On 18 October 2000 it declined to
  rely on the Morse report, which neither the World Bank nor the Government of India had accepted,
  and directed that construction continue as per the Tribunal Award, with the dam raised beyond 90
  metres only in step with resettlement.
positions:
  - party: other (Narmada Bachao Andolan)
    person: Medha Patkar
    role_at_time: Leader of the Narmada Bachao Andolan
    in_power: false
    date: 1992-11-15
    kind: verbatim
    statement: "In an India Today debate with supporters of the project, said that the government had backed the World Bank's independent review expecting a favourable report, and asked why it now denounced the report."
    quote:
      text: "When the World Bank appointed the Morse Commission to assess the project, the Government backed it because they thought a favourable report would put a stamp of credibility. Why denounce the report when their weapon has boomeranged on them?"
      locator: "India Today, 15 November 1992, debate transcript, Patkar's reply on finance and the World Bank"
      source: s9
    sources: [s9]
  - party: INC
    role_at_time: Government of India
    in_power: true
    date: 1993-03-29
    kind: paraphrase
    statement: "Did not accept the independent review's report, in a letter of 7 August 1992 from the Secretary, Ministry of Environment and Forests, according to the Supreme Court. In March 1993 asked the World Bank to cancel the rest of the loan and said it would complete the project on its own; it said significant progress had been made on the resettlement and environment benchmarks and that it remained committed to the action plan."
    sources: [s10, s11, s13]
  - party: other (Government of Gujarat)
    role_at_time: Government of Gujarat, under Chief Minister Chimanbhai Patel
    in_power: true
    date: 1992-08
    kind: verbatim
    statement: "In its formal comments on the independent review, rejected the report, saying it ignored the project's planning studies and data and that its analysis of the valley's tribal people rested on poor evidence."
    quote:
      text: "The Independent Review report presented in June 1992 was highly disappointing."
      locator: "Section 1, Introduction, p. 1"
      source: s15
    sources: [s15]
