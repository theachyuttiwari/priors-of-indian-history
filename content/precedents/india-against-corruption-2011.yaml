id: india-against-corruption-2011
title: India Against Corruption fast and Anna Hazare arrest
summary: >
  On 16 August 2011 Delhi Police arrested Anna Hazare hours before he was to begin an
  indefinite fast for a Jan Lokpal Bill at JP Park. He refused bail conditions and stayed
  in Tihar Jail for three nights while police and his team negotiated the terms of a fast.
  He left Tihar on 19 August under an agreement that allowed a fast at Ramlila Maidan.
period:
  start: 2011-08-16
  end: 2011-08
location:
  states: [Delhi]
  places: [JP Park, Tihar Jail, Ramlila Maidan, Chhatrasal Stadium]
protest:
  cause: Demand for a Jan Lokpal Bill against corruption
  organisers: [India Against Corruption]
  scale: Several thousand outside Tihar; candlelight marches at India Gate; protests in many cities
government:
  centre:
    party: INC
    alliance: UPA
    head: Manmohan Singh
    role: Prime Minister
  state:
    party: INC
    head: Sheila Dikshit
    role: Chief Minister
    name: Delhi
actions:
  - type: permission_denied
    date: 2011-08-16
    description: "Delhi Police refused unconditional permission for an indefinite fast at JP Park and offered permission with conditions; Hazare's team rejected them."
    actor: police
    sources: [s1, s3]
  - type: preventive_arrest
    date: 2011-08-16
    description: "Police arrested Hazare at about 7 am as he left a flat in Mayur Vihar for JP Park. He refused to sign a bond and was sent to seven days' judicial custody in Tihar Jail. The government ordered his release the same evening; he refused to leave without permission for the fast."
    actor: police
    sources: [s1, s3]
  - type: detention
    date: 2011-08-16
    description: "About 1,500 supporters who defied the police order against protesting were detained and later released. Chhatrasal Stadium was used as a makeshift holding site."
    actor: police
    sources: [s1, s3]
  - type: negotiation
    date: 2011-08-17
    description: "Special Commissioner (Law and Order) Dharmender Kumar led talks with Hazare inside Tihar. Police offered a seven-day, then a 14-day, then a 21-day permission; Hazare asked for 30 days."
    actor: police
    sources: [s1]
  - type: permission_granted
    date: 2011-08-18
    description: "Police and Hazare's team agreed on a fast at Ramlila Maidan. Sources differ on the length: The Tribune reported a 21-day offer; Al Jazeera reported a two-week permission that police agreed to consider extending. Hazare left Tihar on 19 August and began the fast at Ramlila Maidan."
    actor: police
    sources: [s1, s2]
outcome: >
  Hazare left Tihar on 19 August 2011 and began a public fast at Ramlila Maidan with
  police permission.
positions:
  - party: INC
    person: Manmohan Singh
