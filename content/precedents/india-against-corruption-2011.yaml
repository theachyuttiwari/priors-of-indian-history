  - party: BJP
    person: Arun Jaitley
    role_at_time: Leader of Opposition, Rajya Sabha
    in_power: false
    date: 2011-08-16
    statement: "The government is trying to snatch people's right to protest; the political leadership is trying to hide behind uniform (police)."
    sources: [s4]
  - party: BJP
    person: Arun Jaitley
    role_at_time: Leader of Opposition, Rajya Sabha
    in_power: false
    date: 2011-08-17
    statement: "It is a wake-up call for all of us unless we put our house in order. The people of this country are becoming restless."
