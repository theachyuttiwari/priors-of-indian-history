id: india-against-corruption-2011
title: India Against Corruption fast and Anna Hazare arrest
summary: >
  On 15 August 2011 Delhi Police refused permission for Anna Hazare's indefinite fast for a
  Jan Lokpal Bill at JP Park and imposed prohibitory orders there. On 16 August police arrested
  Hazare hours before the fast was to begin. He refused to give a personal bond and stayed
  in Tihar Jail for three nights while police and his team negotiated the terms of a fast.
  He left Tihar on 19 August under an agreement that allowed a fast at Ramlila Maidan.
period:
  start: 2011-08-15
  end: 2011-08
location:
  states: [Delhi]
  places: [JP Park, Tihar Jail, Ramlila Maidan, Chhatrasal Stadium]
protest:
  cause: Demand for a Jan Lokpal Bill against corruption
  organisers: [India Against Corruption]
  scale: Several thousand outside Tihar; candlelight marches at India Gate; protests in many cities
government:
  centre:
    party: INC
    alliance: UPA
    head: Manmohan Singh
    role: Prime Minister
  state:
    party: INC
    head: Sheila Dikshit
    role: Chief Minister
    name: Delhi
actions:
  - type: permission_denied
    date: 2011-08-15
    claim: ordered
    description: "India Against Corruption applied to Delhi Police on 2 August for a month-long fast from 16 August. On 13 August police said permission would be granted at JP Park subject to conditions and an undertaking to abide by them. On 15 August the organisers refused six of the conditions, including a three-day limit, and police refused permission, according to the Prime Minister's statement to Parliament. Home Minister P. Chidambaram said the organisers would not guarantee to limit the protest to 5,000 people and three days. Arun Jaitley told the Rajya Sabha that 22 conditions had been imposed"
    actor: police
    state: Delhi
    sources: [s5, s6, s3]
    figures:
      - what: conditions the organisers refused to accept
        value: "6"
        claimed_by: Prime Minister Manmohan Singh (statement to Parliament)
        source: s5
      - what: conditions imposed on the protest
        value: "22"
        claimed_by: Arun Jaitley, Leader of the Opposition (Rajya Sabha)
        source: s6
  - type: section_144
    date: 2011-08-15
    claim: ordered
    description: "Prohibitory orders under Section 144 CrPC were imposed on 15 August in and around JP Park and some other areas, according to the Prime Minister's statement. Governance Now reported on 16 August that police had sealed the park under Section 144 and taken supporters who tried to enter it to Chhatrasal Stadium"
    actor: police
    state: Delhi
    legal_basis: Section 144 CrPC
    sources: [s5, s6, s10]
  - type: preventive_arrest
    date: 2011-08-16
    claim: happened
    description: "Police arrested Hazare in the morning outside a flat in Mayur Vihar, East Delhi, before he could go to JP Park. The Prime Minister said Hazare and six others were arrested as a preventive measure under Sections 151 and 107 CrPC because police concluded they would defy the prohibitory orders. A magistrate offered release on personal bonds with an undertaking not to violate the orders; Hazare refused and was remanded to seven days' judicial custody in Tihar Jail. That evening Delhi Police asked the magistrate to review the order, and he ordered the release at about 7 pm, according to the Prime Minister. Hazare refused to leave the jail without permission to fast at JP Park without conditions"
    actor: police
    state: Delhi
    legal_basis: Sections 107 and 151 CrPC
    sources: [s5, s6, s7, s10]
  - type: detention
    date: 2011-08-16
    claim: happened
    description: "Supporters who went to JP Park and other places under prohibitory orders were detained through the day, many of them taken by bus to Chhatrasal Stadium, which was used as a holding site. The Prime Minister said all of them were released that evening. Counts of those detained differ"
    actor: police
    state: Delhi
    legal_basis: Section 144 CrPC (detained in areas under prohibitory orders, as stated by the Prime Minister); Section 65 of the Delhi Police Act for Kiran Bedi and Shanti Bhushan, per The Tribune
    sources: [s5, s7, s10, s11, s1, s3]
    figures:
      - what: persons detained in Delhi when going to or in areas under prohibitory orders, all released that evening
        value: "about 2,603"
        claimed_by: Prime Minister Manmohan Singh (statement to Parliament)
        source: s5
      - what: persons detained
        value: "around 1,500"
        claimed_by: Delhi Police (as reported by The Tribune)
        source: s7
      - what: persons who courted arrest during the day
        value: "more than 3,000"
        claimed_by: The Tribune (estimate)
        source: s7
      - what: supporters brought to Chhatrasal Stadium by 10 am
        value: "more than 2,000"
        claimed_by: Governance Now (reporter at the scene)
        source: s10
      - what: supporters held at Chhatrasal Stadium on the evening of 16 August
        value: "about 1,700"
        claimed_by: Outlook (reporters held at the stadium)
        source: s11
      - what: followers detained for defying the police order and later released
        value: "about 1,500"
        claimed_by: Al Jazeera
        source: s3
  - type: negotiation
    date: 2011-08-17
    claim: happened
    description: "Special Commissioner (Law and Order) Dharmender Kumar led talks with Hazare at the office of the Director General (Prisons) in Tihar. Police offered a seven-day, then a 14-day, then a 21-day permission; Hazare asked for 30 days"
    actor: police
    state: Delhi
    sources: [s1, s9]
  - type: permission_granted
    date: 2011-08-18
    claim: ordered
    description: "After a meeting in the early hours of 18 August between Police Commissioner B.K. Gupta and four members of Hazare's team, Delhi Police allowed a 15-day fast at Ramlila Maidan, according to The Tribune; Al Jazeera reported two weeks, with police willing to consider an extension. A senior police official told The Tribune that the organisers signed an undertaking on all 22 conditions, revised so that the limit rose from three to 15 days and from 5,000 to 50,000 people. Arvind Kejriwal said the earlier conditions had been withdrawn. Hazare left Tihar on 19 August and began the fast at Ramlila Maidan"
    actor: police
    state: Delhi
    sources: [s9, s2, s1]
outcome: >
  Hazare left Tihar on 19 August 2011 and began a public fast at Ramlila Maidan with
  police permission.
positions:
  - party: INC
    person: Manmohan Singh
    role_at_time: Prime Minister
    in_power: true
    date: 2011-08-17
    kind: verbatim
    statement: "In a statement to both Houses, said Delhi Police refused permission because the organisers would not accept all its conditions, that the government acknowledged the right to peaceful protest under conditions, and that Hazare's path of imposing his own draft Bill on Parliament was misconceived."
    quote:
      text: "However, the path that he has chosen to impose his draft of a Bill upon Parliament is totally misconceived and fraught with grave consequences for our Parliamentary democracy."
      locator: "Paragraph 13"
      source: s5
    sources: [s5, s6, s3]
  - party: BJP
    person: Sushma Swaraj
    role_at_time: Leader of Opposition, Lok Sabha
    in_power: false
    date: 2011-08-16
    kind: paraphrase
    statement: "With Arun Jaitley, after a meeting of opposition parties, demanded that the Prime Minister make a statement in both Houses followed by a debate. PTI reported that she called the action against Hazare a sign of the government's nervousness and said the opposition was united on a violation of democratic rights, not on the Jan Lokpal Bill."
    sources: [s4, s8]
  - party: BJP
    person: Arun Jaitley
    role_at_time: Leader of Opposition, Rajya Sabha
    in_power: false
    date: 2011-08-16
    kind: verbatim
    statement: "Told reporters that the right to frame laws lay with Parliament but every person and organisation had a right to protest peacefully. PTI reported that he accused the government of trying to take away people's right to protest and the political leadership of hiding behind the police."
    quote:
      text: "Dissent is the essence of democracy. Many questions can be raised on Anna Hazare’s version of the Lokpal Bill. It is also true that the right to frame laws lies solely with Parliament but every organisation and every individual has a right to protest peacefully."
      locator: "Story 'Release Anna' chorus unites Opposition, paragraph beginning 'He said'"
      source: s8
    sources: [s8, s4]
  - party: BJP
    person: Arun Jaitley
    role_at_time: Leader of Opposition, Rajya Sabha
    in_power: false
    date: 2011-08-17
    kind: verbatim
    statement: "Replying to the Prime Minister in the Rajya Sabha, said the government was hiding behind the police, that the conditions on the protest took away the right of an effective protest, that the government was trying to scuttle the right to protest and dissent, and that the protests were a wake-up call."
    quote:
      text: "It is this right to protest and this right to dissent which your Government is trying to scuttle and we are all here to oppose that."
      locator: "Reply of the Leader of the Opposition to the Prime Minister's statement, paragraph beginning 'SHRI ARUN JAITLEY: ...and all that we are'"
      source: s6
    sources: [s6, s3]
  - party: CPI(M)
    person: null
    role_at_time: Polit Bureau statement, opposition
    in_power: false
    date: 2011-08-16
    kind: verbatim
    statement: "Said the government had attacked the democratic right to peaceful protest by banning the hunger strike and arresting Hazare and his supporters, and called on party units to protest across the country on 17 August."
    quote:
      text: "The Manmohan Singh government has attacked the democratic right to conduct peaceful protest with the ban on the hunger strike and the arrest of Anna Hazare and his supporters in Delhi."
      locator: "First paragraph of the statement"
      source: s12
    sources: [s12, s4]
