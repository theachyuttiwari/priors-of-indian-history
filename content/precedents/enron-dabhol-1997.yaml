    role_at_time: Chief Minister of Maharashtra
    in_power: true
    date: 1995-08-03
    kind: paraphrase
    statement: Told the legislature that the project was against the interests of Maharashtra and its people, that the negotiations had been one-sided, and that cancelling the agreement was necessary even if it caused a financial burden.
    sources: [s5, s17, s18]
  - party: SS
    person: Manohar Joshi
    role_at_time: Chief Minister of Maharashtra
    in_power: true
    date: 1996-01-08
    kind: paraphrase
    statement: Announced the renegotiated deal at a news conference and said it cut the tariff from Rs 2.40 to Rs 1.86 per unit. Outlook reported that he regarded it as the best bargain any state government could negotiate.
    sources: [s13, s19]
  - party: SS
    person: Manohar Joshi
    role_at_time: Chief Minister of Maharashtra
    in_power: true
    date: 1997-05-28
    kind: paraphrase
    statement: According to the National Human Rights Commission, as quoted by Human Rights Watch, asked Minister of State for Home Prabhakar More by telephone to deal firmly with Medha Patkar's tour, or else the wrong signal would go to the business world.
    sources: [s3]
  - party: SS
    person: Bal Thackeray
    role_at_time: Shiv Sena chief, not holding office
    in_power: true
    date: 1995-11-01
    kind: paraphrase
    statement: Said Enron had accepted nearly all the state's conditions after Enron officials apologised and offered a renegotiated project.
    sources: [s5]
  - party: BJP
    person: Gopinath Munde
    role_at_time: BJP leader, opposition, during the state election campaign
    in_power: false
    date: 1995
    kind: paraphrase
    statement: Vowed during the 1995 state election campaign to push Enron, or the project, into the Arabian Sea.
    sources: [s26, s11]
  - party: BJP
    person: Gopinath Munde
    role_at_time: Deputy Chief Minister of Maharashtra
    in_power: true
    date: 1997-08
    kind: paraphrase
    statement: Told the press that the government's position on the project would not change, ahead of a proposed public debate with anti-Enron activists. A newspaper quoted him as saying the project was here to stay and a debate was a waste of time.
    sources: [s12, s11]
  - party: INC
    person: Sharad Pawar
    role_at_time: Former Chief Minister of Maharashtra, opposition
    in_power: false
    date: 1996-01
    kind: paraphrase
    statement: Said the revival of the project vindicated his government and proved the allegations against it false, and called Joshi's claims of a better bargain an eyewash.
    sources: [s13, s19]
  - party: INC
    person: Vilasrao Deshmukh
    role_at_time: Chairman, Congress state election campaign committee, opposition
    in_power: false
    date: 1996-01
    kind: paraphrase
    statement: Said the parties that had promised to drop Enron into the sea had themselves brought it back.
    sources: [s13]
  - party: Janata Dal
    person: Mrinal Gore
    role_at_time: Janata Dal leader, opposition in Maharashtra
    in_power: false
    date: 1996-01
    kind: paraphrase
    statement: Said the state government's steps on Enron had been full of contradictions, that criminal charges in the state's High Court suit against Enron remained, and that corruption charges were unresolved.
    sources: [s13]
  - party: other (National Alliance of People's Movements)
    person: Medha Patkar
    role_at_time: NAPM convenor, activist
    in_power: false
    date: 1997-08
    kind: paraphrase
    statement: Vowed to expose what she called the government's convoluted logic in reviving the project.
    sources: [s12]
