actions:
  - type: section_144
    date: 2006-11-30
    claim: ordered
    legal_basis: Section 144, Code of Criminal Procedure, 1973
    description: "Prohibitory orders under Section 144 CrPC were promulgated for the area under Singur police station in four successive orders that ran from 30 November 2006 to 28 January 2007. On 1 December the West Bengal Industrial Development Corporation began fencing the 997-acre plot for Tata Motors in the presence of a large police deployment. UNI reported that about 600 protesters gathered nearby and were stopped from advancing."
    actor: state
    state: West Bengal
    sources: [s22, s24, s5]
  - type: negotiation
    date: 2006-12-28
    description: "Mamata Banerjee ended a 25-day hunger strike in Kolkata around midnight of 28 December. UNI reported that she did so after a fax from President A.P.J. Abdul Kalam and a letter from Prime Minister Manmohan Singh, and that she had scaled down her demand from scrapping the project to the return of 406 of 960 acres. The Tribune reported that the Chief Minister had written to her that day offering to review the land transfer and withdraw Section 144 from Singur."
    actor: centre
    sources: [s16, s25, s26, s27]
  - type: tear_gas
    date: 2007-02-04
    description: "Members of the Trinamool Congress-led Krishi Jami Raksha Committee and other groups pulled up fencing posts at the Tata Motors site at Singur and clashed with police. Police used batons and tear gas; the Hooghly superintendent of police said police also fired rubber bullets after protesters threw stones and bombs. Activist Anuradha Talwar was detained, and The Hindu reported eight arrests."
    actor: police
    state: West Bengal
    sources: [s29, s28, s6]
  - type: section_144
    date: 2007-02-04
    claim: ordered
    legal_basis: Section 144, Code of Criminal Procedure, 1973
    description: "The Sub-Divisional Magistrate, Chandernagore promulgated a fifth Section 144 order for the Singur police station area, effective until midnight of 14 February 2007. It prohibited meetings, rallies, processions, demonstrations and squatting, and cited a police report of damage to the fencing and attacks on police. UNI reported that on 5 February police blocked entry points to Hooghly district to stop Mamata Banerjee from holding a rally at Singur."
    actor: state
    state: West Bengal
    sources: [s22, s6]
    court_outcomes:
      - summary: "On 14 February 2007 the Calcutta High Court (Dipankar Datta J) quashed the order, holding that it was passed before the police report reached the magistrate and was an act of executive highhandedness that unreasonably restricted Article 19 rights."
        source: s22
  - type: firing
    date: 2007-03-14
    description: "Police entered Nandigram, which the Bhoomi Uchhed Pratirodh Committee had blockaded since January, and fired on crowds at two places. The state's account, given in the Assembly and in Parliament, was that police used tear gas and rubber bullets first and fired after stone-throwing, crude bombs and firing from the crowd. Petitioners in the High Court alleged that CPI(M) cadres accompanied the police and that no prohibitory order had been issued. The Telegraph reported that the CBI's preliminary inquiry recovered .315-bore bullets that police had not been issued, and was examining whether outsiders took part in the firing. Death and injury counts differ by source."
    actor: police
    state: West Bengal
    sources: [s1, s13, s23, s40, s3, s31]
    figures:
      - { what: killed in police firing (13 identified), value: "14", claimed_by: Calcutta High Court, source: s1 }
      - { what: injured, value: "162", claimed_by: Calcutta High Court, source: s1 }
      - { what: killed, value: "14", claimed_by: Chief Minister Buddhadeb Bhattacharjee in the Assembly on 15 March (as reproduced in the High Court judgment), source: s1 }
      - { what: injured, value: "70-71, and 42 police personnel", claimed_by: Chief Minister Buddhadeb Bhattacharjee in the Assembly on 15 March (as reproduced in the High Court judgment), source: s1 }
      - { what: killed in police firing, value: "13, and one villager killed by a bomb he was about to throw", claimed_by: official sources (UNI), source: s3 }
      - { what: killed, value: "6", claimed_by: Union Home Minister Shivraj Patil in the Rajya Sabha on 14 March (initial telephone information), source: s23 }
      - { what: injured, value: "about 20, including 8 policemen", claimed_by: Union Home Minister Shivraj Patil in the Rajya Sabha on 14 March (initial telephone information), source: s23 }
      - { what: killed in firing, value: "14", claimed_by: National Human Rights Commission, source: s13 }
      - { what: injured, value: "300, including 52 policemen", claimed_by: National Human Rights Commission, source: s13 }
      - { what: killed, value: "10", claimed_by: counsel for the petitioners (as recorded in the High Court judgment), source: s1 }
      - { what: killed, value: "11, and 34 injured including 14 policemen", claimed_by: The Hindu (first-day report), source: s40 }
      - { what: killed, value: "more than 20, and 200 injured", claimed_by: Trinamool Congress leader Mamata Banerjee, source: s40 }
  - type: commission_of_inquiry
    date: 2007-03-15
    description: "The Calcutta High Court (Nijjar CJ and P.C. Ghose J), acting suo motu, directed a special team of the CBI to go to Nandigram and collect material for a report to the court, and said that the police action was prima facie wholly unconstitutional. UNI reported a seven-day deadline; the CBI filed a preliminary report on 22 March 2007. The Chief Minister told the Assembly the same day that the CBI could hold the inquiry."
    actor: court
    sources: [s1, s20]
  - type: concession
    date: 2007-03-19
    description: "The District Magistrate of East Midnapore issued a notification that the state government would not acquire any land for industry in Nandigram. On 15 March the Chief Minister had told the Assembly that there would be no chemical hub at Nandigram against the will of the people. The Hindu reported that copies were sent to the gram panchayats and political parties, and that the government began shifting two police camps. The NHRC recorded that the blockade continued after the notification. The government later proposed Nayachar island as another site; India Today reported in November 2007 that ecological concerns had ruled it out."
    actor: state
    state: West Bengal
    sources: [s13, s43, s1, s33]
  - type: other
    date: 2007-11-06
    description: "CPI(M) supporters, with outsiders, overran the Nandigram blockade. The NHRC found that the Tehkhali police outpost was withdrawn late on 6 November, which facilitated the attack, and its investigation team reported that the police approach was partisan; the Commission said that neither the CPI(M) nor the Bhoomi Uchhed Pratirodh Committee could escape a share of responsibility. On 9 November The Telegraph reported CPI(M) supporters taking more villages and police officers saying they could not enter. Casualty and displacement counts differ by source."
    actor: state
    state: West Bengal
    sources: [s13, s34, s12, s4]
    figures:
      - { what: killed between 6 and 12 November, value: "7", claimed_by: National Human Rights Commission, source: s13 }
      - { what: injured between 6 and 12 November, value: "32, including 16 police personnel", claimed_by: National Human Rights Commission, source: s13 }
      - { what: villagers driven out, value: "nearly 2,500", claimed_by: National Human Rights Commission, source: s13 }
      - { what: houses damaged between 6 and 12 November, value: "560 completely and 399 partially", claimed_by: Chief Secretary of West Bengal (report cited by the NHRC), source: s13 }
      - { what: houses burnt, value: "about 900", claimed_by: Chief Minister Buddhadeb Bhattacharjee (UNI), source: s4 }
      - { what: killed in Nandigram during 2007, value: "at least 30", claimed_by: Human Rights Watch and Amnesty International India, source: s12 }
  - type: other
    date: 2007-11-11
    description: "The NHRC recorded that the state asked the Centre on 27 October for CRPF for three months, that the Centre replied on 5 November that it could not spare the force because of Assembly elections in other states, and that it ordered six CRPF companies on 11 November. The companies entered Nandigram and began flag marches on 12 November. The Telegraph, citing Union home ministry sources, reported that the CRPF director-general told the Centre the force was let in only after CPI(M) cadres had taken the area."
    actor: centre
    sources: [s13, s35]
  - type: other
    date: 2007-11-16
    description: "The Calcutta High Court (Nijjar CJ and P.C. Ghose J) held that the police firing of 14 March was wholly unconstitutional and could not be justified under any provision of law, held Regulation 155(b) of the Police Regulations, Bengal ultra vires, directed the CBI to complete a detailed investigation within a month, and ordered compensation of Rs 5 lakh for each family of the dead, at least Rs 1 lakh for each injured person and Rs 2 lakh for each rape victim. The state appealed to the Supreme Court."
    actor: court
    sources: [s1, s2, s38]
  - type: other
    date: 2008-10-03
    description: "After a Trinamool Congress dharna outside the Singur plant from late August 2008 demanding the return of 400 acres, Ratan Tata announced that Tata Motors would move the Nano project out of West Bengal, citing the well-being of employees and the safety of contractors and vendors. He said the land had been acquired legally and the dispute was between the state government and the Trinamool Congress, and, according to a 2024 Outlook account, that Ms Banerjee had pulled the trigger. Mamata Banerjee called the decision a joint game plan of the Tatas and the CPI(M). The Supreme Court later recorded that Tata Motors wrote to the state police on 10 November 2008 that it was suspending operations, and that the plant moved to Gujarat."
    actor: state
    state: West Bengal
    sources: [s21, s41, s39, s18, s8]
  - type: other
    date: 2016-08-31
    description: "Supreme Court (Gopala Gowda and Arun Mishra JJ) quashed the 2006 Singur acquisition in Kedar Nath Yadav v State of West Bengal, directed return of possession to landowners within 12 weeks, and held that compensation already paid would not be recovered. Recorded here as the legal outcome; it falls after the protest period."
    actor: court
    sources: [s21, s9]
outcome: >
  The Nandigram SEZ was dropped in March 2007 and Tata Motors left Singur in October 2008.
  The Trinamool government passed the Singur Land Rehabilitation and Development Act in 2011,
  and on 31 August 2016 the Supreme Court in Kedar Nath Yadav v State of West Bengal quashed
  the 2006 Singur acquisition and ordered the land returned to its owners within 12 weeks.
positions:
  - party: INC
    person: Priya Ranjan Dasmunsi
    role_at_time: Union Minister for Information and Broadcasting
    in_power: true
    date: 2006-12-03
    kind: verbatim
    statement: "Held the Chief Minister responsible for the Singur standoff, said land could not be acquired through confrontation, asked for prohibitory orders at Singur to be lifted, and said the plant should be built elsewhere, sparing multi-crop land."
    quote:
      text: "West Bengal needs industrialisation and we are not blocking it. But industry must be set up elsewhere leaving the multicrop land"
      locator: "Sentence beginning 'Mr Dasmunsi clarified'"
      source: s7
    sources: [s7]
  - party: TMC
    person: Mamata Banerjee
    role_at_time: Trinamool Congress chief, opposition
    in_power: false
    date: 2006-12-29
    kind: verbatim
    statement: "Ended her hunger strike after midnight, saying she did so at the request of the President and the Prime Minister, and said the Singur movement would continue in another form."
    quote:
      text: "I am withdrawing the hunger strike at the request of the President and Prime Minister. They will do justice to our cause"
      locator: "Sentence beginning 'The PM's letter provided them the opportunity'"
      source: s16
    sources: [s16]
  - party: CPI(M)
    person: Buddhadeb Bhattacharjee
    role_at_time: Chief Minister of West Bengal
    in_power: true
    date: 2007-03-15
    kind: paraphrase
    statement: "Told the Assembly that police had gone to Nandigram to restore the administration, not to acquire land, and had fired after tear gas and rubber bullets failed; that 14 people had died; that the government would accept the High Court's CBI inquiry instead of a judicial inquiry; and that there would be no chemical hub at Nandigram against the will of the people."
    sources: [s1, s30, s14]
  - party: CPI(M)
    person: Brinda Karat
    role_at_time: Rajya Sabha MP and Polit Bureau member
    in_power: true
    date: 2007-03-15
    kind: verbatim
    statement: "Welcomed the High Court's direction for a CBI inquiry."
    quote:
      text: "We have no problem with CBI or judicial inquiry."
      locator: "Sentence beginning 'CPI (M) leader Brinda Karat'"
      source: s20
    sources: [s20]
  - party: TMC
    person: Mamata Banerjee
    role_at_time: Trinamool Congress chief, opposition
    in_power: false
    date: 2007-03-15
    kind: verbatim
    statement: "Visited the injured at Nandigram after being stopped on the way by CPI(M) supporters, and accused the administration of trying to cover up the killings by blocking her. UNI reported that she demanded the Chief Minister's resignation."
    quote:
      text: "What kind of democracy is this? They’ve killed innocent women and children. On top of that, the administration attempted a cover-up by trying to stop me from coming here."
      locator: "Paragraph beginning 'Before her departure'"
      source: s32
    sources: [s32, s20]
  - party: BJP
    person: L.K. Advani
    role_at_time: Leader of the Opposition, Lok Sabha
    in_power: false
    date: 2007-03-15
    kind: paraphrase
    statement: "Called the firing barbaric and asked the Centre to make the state withdraw the SEZ proposal unconditionally. UNI reported the same day that the NDA compared the killings to the Jallianwala Bagh massacre."
    sources: [s20]
  - party: other (none / constitutional office)
    person: Gopalkrishna Gandhi
    role_at_time: Governor of West Bengal
    in_power: false
    date: 2007-03-14
    kind: verbatim
    statement: "Said the deaths in police firing filled him with horror, asked whether the bloodshed was avoidable and what public purpose the use of force served, and asked the government to mitigate the effects visibly and fast."
    quote:
      text: "The news of deaths by police firing in Nandigram this morning has filled me with a sense of cold horror."
      locator: "Opening paragraph, first quoted sentence"
      source: s3
    sources: [s3, s1]
  - party: other (none / constitutional office)
    person: Gopalkrishna Gandhi
    role_at_time: Governor of West Bengal
    in_power: false
    date: 2007-11-09
    kind: verbatim
    statement: "Said the manner in which the recapture of Nandigram villages was being attempted was totally unlawful and unacceptable, called the area a war zone, and asked the state government for the return of the armed outsiders, relief for the displaced and their return home."
    quote:
      text: "Enough is enough. Peace and security should be restored, without any delay, from where they have been evicted from Nandigram."
      locator: "Last paragraph"
      source: s36
    sources: [s36, s11, s37]
  - party: BJP
    person: Rajnath Singh
    role_at_time: BJP national president
    in_power: false
    date: 2007-11-12
    kind: paraphrase
    statement: "Demanded dismissal of the West Bengal government for failure on all fronts, said its actions in Nandigram symbolised dictatorship and tyranny, and said CPI(M) cadres killed people while the police stood by."
    sources: [s15]
  - party: CPI(M)
    person: Buddhadeb Bhattacharjee
    role_at_time: Chief Minister of West Bengal
    in_power: true
    date: 2007-11-14
    kind: verbatim
    statement: "Said the Bhoomi Uchhed Pratirodh Committee had started the Nandigram violence and stood by his earlier defence of the CPI(M)'s retaliation, while saying he would function as Chief Minister."
    quote:
      text: "They instigated the incident and they were paid back in their own coin in the last two-three days"
      locator: "Sentence beginning 'He said while attempts were being made'"
      source: s4
    sources: [s4, s12]
  - party: CPI(M)
    person: Buddhadeb Bhattacharjee
    role_at_time: Chief Minister of West Bengal
    in_power: true
    date: 2007-12-26
    kind: verbatim
    statement: "On his first visit to Nandigram in ten months, said he would not have sent police on 14 March had he known it would lead to firing, and expressed grief for those who died."
    quote:
      text: "No civil government ever asks police to open fire on its people."
      locator: "Sentence beginning 'The loss of life is sad'"
      source: s17
    sources: [s17, s42]
