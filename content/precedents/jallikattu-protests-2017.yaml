      locator: "Tweet text"
      source: s9
    sources: [s9, s6]
  - party: BJP
    person: Narendra Modi
    role_at_time: Prime Minister (statement by the Prime Minister's Office)
    in_power: true
    date: 2017-01-19
    kind: verbatim
    statement: "After meeting Chief Minister Panneerselvam, the Prime Minister's Office said Modi appreciated the cultural significance of jallikattu but observed that the matter was sub judice, and that the Centre would support steps taken by the state government."
    quote:
      text: "The Centre would be supportive of steps taken by the State Government."
      locator: "Tweet text (fourth post in the PMO thread of 19 January 2017)"
      source: s7
    sources: [s7]
