id: jallikattu-protests-2017
title: Jallikattu protests in Tamil Nadu, January 2017
summary: >
  From 16 January 2017 students and youth gathered in Alanganallur and then on Marina
  Beach, Chennai, to demand that jallikattu be allowed despite a Supreme Court ban. The
  AIADMK government obtained Union clearance for an ordinance, promulgated on 21 January,
  and the Assembly passed a replacement Act on 23 January. On the morning of 23 January
  police evicted the Marina crowd and used lathis and tear gas during clashes. Police later
  imposed Section 144 on the Marina, and the state set up a commission of inquiry into the violence.
period:
  start: 2017-01-16
  end: 2017-01-23
location:
  states: [Tamil Nadu]
  places: [Marina Beach Chennai, Alanganallur Madurai, Coimbatore, Tiruchirappalli]
protest:
  cause: Lifting the ban on jallikattu under the Prevention of Cruelty to Animals Act
  organisers: [Largely leaderless; students and youth groups]
  scale: Thousands along the Marina promenade for six days; parallel protests across Tamil Nadu
government:
  centre:
    party: BJP
    alliance: NDA
    head: Narendra Modi
    role: Prime Minister
  state:
    party: AIADMK
    head: O. Panneerselvam
    role: Chief Minister
    name: Tamil Nadu
actions:
  - type: negotiation
    date: 2017-01-19
    claim: happened
    description: "Chief Minister Panneerselvam met Prime Minister Modi in New Delhi on 19 January. The Prime Minister's Office said Modi observed that the matter was sub judice and that the Centre would be supportive of steps taken by the state government. On 20 January the Home, Law and Environment ministries vetted the state's draft ordinance and the Centre cleared it. Reports differ on whether it went to the President: PTI quoted a Home Ministry spokesman as saying it was sent without the need of referring it to the President, Millennium Post reported it was approved for the President's assent, and the state later said it had obtained the President's prior instructions under Article 213. The Attorney General told the Supreme Court the Centre was in talks with the state, and the Court agreed not to deliver its judgment for a week."
    actor: centre
    sources: [s7, s2, s21, s17, s15]
  - type: concession
    date: 2017-01-21
    claim: ordered
    description: "The Governor, C. Vidyasagar Rao, promulgated the Prevention of Cruelty to Animals (Tamil Nadu Amendment) Ordinance, 2017 (Tamil Nadu Ordinance 1 of 2017), published in a Gazette Extraordinary on 21 January, amending the 1960 Act to permit jallikattu. Protesters at Marina rejected it as a temporary fix and continued the sit-in."
    actor: state
    legal_basis: Article 213 of the Constitution (as cited in the state government's statement, reported by Deccan Herald); Tamil Nadu Ordinance 1 of 2017
    sources: [s10, s17, s15, s3, s6, s13]
  - type: other
    date: 2017-01-23
    claim: happened
    description: "Police eviction: early on 23 January police gave protesters on Marina Beach a copy of the ordinance and asked them to leave, then physically removed those who stayed. Protesters told Scroll that they asked for time to consult lawyers and were refused. Roads to the beach were barricaded, and Hindustan Times reported that most protesters had been cleared by noon. Officials told Hindustan Times that some people seemed to have infiltrated the protests and urged others to stay, forcing the police to use force; WION reported that police said they needed to secure the beachfront before Republic Day."
    actor: police
    sources: [s13, s14, s5, s4]
    figures:
      - what: protesters on Marina Beach when police handed over the ordinance
        value: "at least 7,000"
        claimed_by: Hindustan Times
        source: s14
      - what: protesters evicted from Marina Beach
        value: "as many as 5,000"
        claimed_by: unattributed reports cited by WION
        source: s5
  - type: lathi_charge
    date: 2017-01-23
    claim: happened
    description: "Police used lathis during the eviction and in clashes that followed in Triplicane, Teynampet, Madurai and Coimbatore. Accounts of the sequence differ: protesters told Scroll that police began hitting the crowd with lathis while they were still protesting at Marina, while IANS reported that protesters threw stones at police in Triplicane and police then retaliated with a baton charge. Vehicles outside the Ice House police station in Triplicane were set on fire. Who set the fires is contested. Protesters and residents of the Nadukuppam fishing colony alleged that police set fire to vehicles and the fish market; Assistant Commissioner S. Pandian denied this and showed a video of youths damaging property outside the station. Videos that purported to show police setting fire to autorickshaws circulated on social media."
    actor: police
    sources: [s13, s14, s22, s1, s4, s6]
    figures:
      - what: policemen injured in the violence
        value: "at least 20"
        claimed_by: police (as reported by Hindustan Times)
        source: s14
  - type: tear_gas
    date: 2017-01-23
    claim: happened
    description: "Police fired tear gas shells to disperse crowds on roads leading to Marina and elsewhere in Chennai and the state."
    actor: police
    sources: [s14, s22, s1, s4, s5]
  - type: concession
    date: 2017-01-23
    claim: ordered
    description: "The Tamil Nadu Assembly unanimously passed the Prevention of Cruelty to Animals (Tamil Nadu Amendment) Bill, 2017, introduced by the Chief Minister, by a voice vote. It replaced the ordinance and was deemed in force from 21 January 2017. The Tamil Nadu Government Gazette records the President's assent to the Act, Act No. 1 of 2017, on 31 January 2017; Deccan Chronicle had reported the assent on 30 January."
    actor: state
    legal_basis: Prevention of Cruelty to Animals (Tamil Nadu Amendment) Act, 2017 (Tamil Nadu Act No. 1 of 2017)
    sources: [s11, s12, s15, s1, s3]
    court_outcomes:
      - summary: A Constitution Bench of the Supreme Court held on 18 May 2023 that the Tamil Nadu Amendment Act was a valid law and not directly contrary to the 2014 Nagaraja judgment.
        source: s12
  - type: other
    date: 2017-01-23
    claim: held
    description: "The Madras High Court declined to hear a petition on the police action, saying it would not interfere in administrative matters."
    actor: court
    sources: [s5]
  - type: section_144
    date: 2017-01-28
    claim: ordered
    description: "The Commissioner of Police, Greater Chennai, S. George, issued a prohibitory order covering the Marina, Ice House, Foreshore Estate, Triplicane and Anna Square police station areas until 12 February. It prohibited assemblies, processions, fasts, demonstrations, human chains and meetings; family visits to the beach were exempt. The Commissioner said anti-social elements and anti-nationals had infiltrated the agitation and that some were using social media to gather people at Marina again. The order was rescinded on 4 February 2017, and a regulatory order under Section 41 of the Chennai City Police Act then barred assemblies and demonstrations on the Marina stretch from Napier Bridge to the Lighthouse."
    actor: police
    legal_basis: Section 144 CrPC
    sources: [s23, s24, s25]
  - type: commission_of_inquiry
    date: 2017-01-31
    claim: ordered
    description: "Chief Minister Panneerselvam announced in the Assembly a commission of inquiry under a retired High Court judge into the law and order problems after the protests, including whether the force used by police was appropriate. It was asked to report in three months. Retired judge S. Rajeswaran headed the one-member commission. After repeated extensions it submitted its report to Chief Minister Edappadi K. Palaniswami in January 2020. The Federal reported in January 2021 that the report had not been published."
    actor: state
    sources: [s23, s18, s19, s20]
    figures:
      - what: persons the commission inquired
        value: "1,901"
        claimed_by: Secretariat sources (as reported by DT Next)
        source: s20
outcome: >
  PTI reported that the Marina protest was called off on the evening of 23 January 2017 after
  the Bill passed; Global Voices reported that most protesters in Chennai decided to end it the
  next day. The Tamil Nadu Government Gazette records the President's assent to the Act on
  31 January 2017, and the Supreme Court upheld the Act in May 2023.
