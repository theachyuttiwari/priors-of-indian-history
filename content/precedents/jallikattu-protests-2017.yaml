id: jallikattu-protests-2017
title: Jallikattu protests in Tamil Nadu, January 2017
summary: >
  From 16 January 2017 students and youth gathered in Alanganallur and then on Marina
  Beach, Chennai, to demand that jallikattu be allowed despite a Supreme Court ban. The
  AIADMK government obtained Union clearance for an ordinance, promulgated on 21 January,
  and the Assembly passed a replacement Act on 23 January. On the morning of 23 January
  police evicted the Marina crowd and used lathis and tear gas during clashes.
period:
  start: 2017-01-16
  end: 2017-01-23
location:
  states: [Tamil Nadu]
  places: [Marina Beach Chennai, Alanganallur Madurai, Coimbatore, Tiruchirappalli]
protest:
  cause: Lifting the ban on jallikattu under the Prevention of Cruelty to Animals Act
  organisers: [Largely leaderless; students and youth groups]
  scale: Thousands along the Marina promenade for six days; parallel protests across Tamil Nadu
government:
  centre:
    party: BJP
    alliance: NDA
    head: Narendra Modi
    role: Prime Minister
  state:
    party: AIADMK
    head: O. Panneerselvam
    role: Chief Minister
    name: Tamil Nadu
actions:
  - type: negotiation
    date: 2017-01-19
    description: "Chief Minister Panneerselvam met Prime Minister Modi in New Delhi and an AIADMK MPs' delegation met Home Minister Rajnath Singh. The Home Ministry vetted a draft state ordinance and the Law and Environment ministries approved it for the President's assent on the night of 20 January. The Attorney General told the Supreme Court the Centre was in talks with the state and the Court agreed not to deliver its judgment for a week."
    actor: centre
    sources: [s2]
  - type: concession
    date: 2017-01-21
    description: "The Governor promulgated an ordinance amending the Prevention of Cruelty to Animals Act to permit jallikattu. Protesters at Marina rejected it as a temporary fix and continued the sit-in."
    actor: state
    sources: [s3, s5, s6]
  - type: other
    date: 2017-01-23
    description: "Police eviction: early on 23 January police physically removed protesters from Marina Beach, citing the need to secure the beachfront before Republic Day. WION reported about 5,000 evicted; routes to the beach were cordoned off."
    actor: police
    sources: [s4, s5]
  - type: lathi_charge
    date: 2017-01-23
    description: "After stone-throwing in Triplicane near Marina, police used lathi charges. Clashes spread to Teynampet, Madurai and Coimbatore; vehicles and a police station near Marina were set on fire. Videos alleging that police set fire to vehicles went viral; Global Voices reported these as allegations, and the matter was contested."
    actor: police
    sources: [s1, s4, s5, s6]
  - type: tear_gas
    date: 2017-01-23
    description: "Police fired tear gas shells to disperse crowds on roads leading to Marina."
    actor: police
    sources: [s1, s4]
  - type: concession
    date: 2017-01-23
    description: "The Tamil Nadu Assembly unanimously passed the Prevention of Cruelty to Animals (Tamil Nadu Amendment) Bill, 2017, piloted by the Chief Minister, replacing the ordinance. The President gave assent on 30 January 2017."
    actor: state
    sources: [s1, s3]
  - type: other
    date: 2017-01-23
    description: "The Madras High Court declined to hear a petition on the police action, saying it would not interfere in administrative matters."
    actor: court
    sources: [s5]
outcome: >
  The Marina protest was called off on the evening of 23 January 2017 after the Bill
  passed. The Act received the President's assent on 30 January 2017.
