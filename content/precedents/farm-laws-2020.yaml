id: farm-laws-2020
title: Farm laws protest, 2020-2021
summary: >
  Farmers, mainly from Punjab and Haryana, marched to Delhi from 26 November 2020 to demand
  repeal of three farm laws passed in 2020. Haryana police met the march with barricades,
  trenches, tear gas and water cannon, and farmers then camped at Delhi's borders for about a year.
  Eleven rounds of talks failed, and the Supreme Court stayed the laws in January 2021. Prime
  Minister Narendra Modi announced the repeal on 19 November 2021, Parliament passed the repeal bill
  on 29 November 2021, and farmers left the protest sites on 11 December 2021.
period:
  start: 2020-11-26
  end: 2021-12-11
location:
  states: [Delhi, Haryana, Punjab]
  places: [Singhu border, Tikri border, Ghazipur border, Shambhu border, Sonipat, Meham (Rohtak)]
protest:
  cause: Repeal of three farm laws passed in 2020
  organisers: [Farm unions, mainly from Punjab and Haryana; leaders included Rakesh Tikait]
  scale: "Hundreds of thousands marched to Delhi's borders in November 2020; tens of thousands stayed at camps around Delhi for about a year (The Guardian)"
government:
  centre:
    party: BJP
    alliance: NDA
    head: Narendra Modi
    role: Prime Minister
  state:
    party: BJP
    head: Manohar Lal Khattar
    role: Chief Minister
    name: Haryana
actions:
  - type: barricading
    date: 2020-11-26
    claim: happened
    description: "To stop the Delhi Chalo march, Haryana announced it would seal its border with Punjab, and police placed cement and steel barricades, dumpers and trucks on roads at the Shambhu border and other crossing points. Farmers removed many of these, and at most points police let them through after face-offs. The Tribune reported that the national highway near Karhans village (Panipat) was dug up and stone pillars raised to stop the farmers. The Quint reported trenches dug on highways leading to Delhi on the night of 26-27 November, and an unnamed police officer told NDTV that the aim was to delay farmers from Punjab so that they did not reach Karnal. The Quint also reported that Chief Minister Manohar Lal Khattar had ordered police to stop protesters from reaching the capital. On the Delhi side, PTI reported that the Delhi Police stationed five sand-laden trucks at the Singhu border to stop tractor-trolleys."
    actor: state
    sources: [s10, s3, s1, s12]
  - type: tear_gas
    date: 2020-11-26
    claim: happened
    description: "On 26 November Haryana police used water cannons and tear gas against farmers from Punjab who pushed through barricades at the Shambhu border in Ambala district, and used water cannons at Karnal, Kaithal, Khanauri and other points. Down To Earth reported tear gas and water cannons in Ambala and Kurukshetra. The Tribune reported that police used tear gas shells and water cannons on farmers on the Rohtak-Hisar road in Meham on 26-27 November after farmers removed barricades, that some of the shells were past their expiry date, and that DGP Manoj Yadava said the matter was being examined. The Quint reported tear gas and water cannons at the Singhu and Tikri borders with Delhi on 27 November. Haryana Police said they acted with restraint, that nobody was seriously hurt and that no farmer was arrested (PTI)."
    actor: police
    sources: [s10, s11, s2, s1, s12, s3]
  - type: negotiation
    date: 2021-01-22
    claim: happened
    description: "The Centre and farm unions held eleven rounds of talks. The first, on 14 October 2020, was with the Agriculture Secretary; later rounds were with a panel of Union ministers led by Agriculture Minister Narendra Singh Tomar. The eleventh round, at Vigyan Bhavan on 22 January 2021, ended without agreement, and for the first time no date was set for the next round."
    actor: centre
    sources: [s4, s13]
  - type: concession
    date: 2021-01-20
    claim: ordered
    description: "At the tenth round of talks on 20 January 2021, the government offered to suspend the three laws for a year and a half (reported as 12-18 months or up to 18 months), to file an affidavit in the Supreme Court and to set up a joint committee. ThePrint reported that the committee would look at the disputed provisions and a legal guarantee for minimum support price (MSP); farm leader Kavitha Kuruganti told The Tribune it would discuss the future of the laws, and a union leader said it was finally specified that it would cover only the three laws. The unions rejected the offer on 21 January and held out for full repeal, and Tomar repeated it at the eleventh round on 22 January."
    actor: centre
    sources: [s4, s13, s14]
  - type: other
    date: 2021-01-12
    description: "Supreme Court stay: in Rakesh Vaishnav v. Union of India, the Court stayed implementation of the three farm laws until further orders and ordered that the MSP system in existence before the laws be maintained and that no farmer be dispossessed of land under them. It formed a four-member committee (Bhupinder Singh Mann, Parmod Kumar Joshi, Ashok Gulati, Anil Ghanwat) to hear the farmers' bodies and the government and report within two months of its first sitting, which was to be held within ten days. The order also recorded that a few deaths had taken place at the protest sites, 'though not out of any violence'. Mann recused himself from the committee on 14 January 2021."
    actor: court
    sources: [s15, s5, s9]
    figures:
      - { what: "deaths at the protest sites recorded by 12 January 2021", value: "a few, 'either out of illness or by way of suicide'", claimed_by: Supreme Court order of 12 January 2021, source: s15 }
  - type: internet_shutdown
    date: 2021-01-26
    claim: ordered
    description: "After violence during the Republic Day tractor rally, the Union Home Ministry (MHA) ordered temporary suspension of internet services at Singhu, Ghazipur, Tikri, Mukarba Chowk, Nangloi and adjoining areas of Delhi from 12:00 to 23:59 hrs on 26 January 2021, citing public safety and averting a public emergency. Business Today reported that the order did not say whether mobile or home broadband was covered."
    actor: centre
    sources: [s16, s17, s6]
    legal_basis: "Section 7, Indian Telegraph Act, 1885, read with Rule 2(1) of the Temporary Suspension of Telecom Services (Public Emergency or Public Safety) Rules, 2017 (as quoted from the MHA order by Hindustan Times)"
  - type: internet_shutdown
    date: 2021-01-29
    claim: ordered
    description: "Three further MHA orders suspended internet services in Singhu, Ghazipur and Tikri and their adjoining areas in Delhi: from 23:00 on 29 January to 23:00 on 31 January 2021, from 23:00 on 31 January to 23:00 on 2 February 2021, and from 00:00 to 23:59 on 6 February 2021. Each order cites a letter from the Delhi Police Commissioner of the same date and the approval of the Union Home Secretary, and gives public safety and averting a public emergency as the reason."
    actor: centre
    sources: [s18, s19, s20]
    legal_basis: "Rule 2(1), Temporary Suspension of Telecom Services (Public Emergency or Public Safety) Rules, 2017"
  - type: concession
    date: 2021-11-19
    claim: ordered
    description: "In an address on 19 November 2021, Prime Minister Narendra Modi announced that the government had decided to withdraw all three farm laws and would complete the repeal in the Parliament session starting later that month. He also announced a committee on zero-budget farming, crop patterns and making MSP more effective and transparent, and asked protesting farmers to return home."
    actor: centre
    sources: [s21, s3]
  - type: repeal
    date: 2021-11-29
    claim: ordered
    description: "Parliament passed the Farm Laws Repeal Bill, 2021 on 29 November 2021. Lok Sabha passed it by voice vote without debate amid opposition protests, and Rajya Sabha passed it the same afternoon. Opposition parties had demanded a discussion. The government said a debate was not needed because the Prime Minister had already agreed to the repeal. The President assented on 30 November, and the Farm Laws Repeal Act, 2021 (No. 40 of 2021), which repeals the three 2020 Acts, was published in the Gazette on 1 December 2021. Around the repeal, protest leaders and opposition MPs put the number of farmers who died during the agitation at 700 to 750; the Agriculture Ministry told the Lok Sabha in a written reply that it had no record of such deaths (see figures)."
    actor: centre
    sources: [s22, s7, s24, s26]
    legal_basis: "Farm Laws Repeal Act, 2021 (No. 40 of 2021)"
    figures:
      - { what: "farmers who died during the protest", value: "more than 700", claimed_by: "Rakesh Tikait, Bharatiya Kisan Union (reported by The Guardian, 19 November 2021)", source: s3 }
      - { what: "farmers who died during the agitation", value: "750", claimed_by: "Mallikarjun Kharge, Leader of Opposition, Rajya Sabha (as reported by The Hindu)", source: s7 }
      - { what: "farmers who died during the agitation", value: "700", claimed_by: "Mallikarjun Kharge, Leader of Opposition, Rajya Sabha (as reported by Scroll)", source: s24 }
      - { what: "farmers who died during the agitation", value: "700", claimed_by: "Rahul Gandhi, Congress (to reporters, 29 November 2021)", source: s23 }
      - { what: "farmers who died during the protest", value: "750", claimed_by: "Adhir Ranjan Chowdhury, Congress, in the Lok Sabha", source: s26 }
      - { what: "farmers who died during the agitation", value: "no record", claimed_by: "Union Ministry of Agriculture and Farmers Welfare (written Lok Sabha reply by Narendra Singh Tomar)", source: s26 }
outcome: >
  The three farm laws were repealed by Parliament on 29 November 2021. Farmers dismantled
  their camps at Delhi's borders and went home on 11 December 2021, after the government agreed
  to their demands, including an assurance to consider guaranteed prices for produce. Farm leaders
  and opposition MPs said 700 to 750 farmers died during the protest; the Union Agriculture
  Ministry told the Lok Sabha that it had no record of these deaths.
positions:
  - party: BJP
    person: Narendra Singh Tomar
    role_at_time: Union Agriculture Minister
    in_power: true
    date: 2021-01-22
    kind: paraphrase
    statement: "Said after the eleventh round that the talks were inconclusive because the unions wanted only repeal of the laws despite the government asking for alternatives, and that farmers' welfare was not at the heart of the talks from the unions' side. Asked the unions to reply to the government's proposal by Saturday."
    sources: [s4]
  - party: BJP
    person: Narendra Modi
    role_at_time: Prime Minister
    in_power: true
    date: 2021-11-19
    kind: translated
    statement: "Announced that the government had decided to withdraw all three farm laws and would complete their repeal in the Parliament session starting later that month. Said the laws had been brought for the welfare of farmers, especially small farmers, but the government could not explain them to some farmers despite its efforts. Appealed to protesting farmers to return home."
    quote:
      text: "today I have come to tell you, the whole country, that we have decided to withdraw all three agricultural laws. In the Parliament session starting later this month, we will complete the constitutional process to repeal these three agricultural laws"
      original: "आज मैं आपको, पूरे देश को, ये बताने आया हूं कि हमने तीनों कृषि कानूनों को वापस लेने का निर्णय लिया है। इस महीने के अंत में शुरू होने जा रहे संसद सत्र में, हम इन तीनों कृषि कानूनों को Repeal करने की संवैधानिक प्रक्रिया को पूरा कर देंगे"
      language: hi
      translated_by: source
      locator: "English: paragraph beginning 'The Prime Minister said that the Government brought these laws'; Hindi: embedded @PMOIndia post of 19 November 2021 on the same page"
      source: s21
    sources: [s21, s3]
  - party: BJP
    person: Pralhad Joshi
    role_at_time: Union Minister for Parliamentary Affairs
    in_power: true
    date: 2021-11-29
    kind: paraphrase
    statement: "Said there was little need for a debate because the Prime Minister had already agreed to repeal the laws, and asked what the opposition's intention was in delaying the bill."
    sources: [s7, s25]
  - party: INC
    person: Rahul Gandhi
    role_at_time: Lok Sabha MP, opposition
    in_power: false
    date: 2021-11-29
    kind: verbatim
    statement: "Said it was unfortunate that the laws were repealed without discussion, that the opposition had wanted to discuss MSP, the Lakhimpur Kheri incident and the farmers who died in the agitation, and that the government had avoided a debate because it was 'terrified'."
    quote:
      text: "What is unfortunate is how the bills have been repealed, without any discussion, without any conversation."
      locator: "Paragraph beginning 'What is unfortunate is how the bills have been repealed'"
      source: s23
    sources: [s23, s7]
  - party: INC
    person: Mallikarjun Kharge
    role_at_time: Leader of Opposition, Rajya Sabha
    in_power: false
    date: 2021-11-29
    kind: paraphrase
    statement: "Speaking briefly in the Rajya Sabha before the vote, welcomed the repeal and congratulated the government for what he called its belated wisdom, then raised the deaths of farmers during the agitation (750 in The Hindu's report, 700 in Scroll's) before the chair said his time was up. Said the government had decided on repeal after assessing the effect of the protests on recent by-elections and ahead of elections in five states."
    sources: [s7, s24]
  - party: INC
    person: P. Chidambaram
    role_at_time: Rajya Sabha MP, opposition
    in_power: false
    date: 2021-11-19
    kind: verbatim
    statement: "In a series of posts on X (then Twitter), said the repeal was driven by fear of elections rather than a change of policy, and called it a victory for farmers and for the Congress."
    quote:
      text: "PM’s announcement on the withdrawal of the three farm laws is not inspired by a change of policy or a change of heart. It is impelled by fear of elections!"
      locator: "Paragraph beginning 'An opposition MP, Palaniappan Chidambaram, said in a tweet'"
      source: s3
    sources: [s3, s27]
