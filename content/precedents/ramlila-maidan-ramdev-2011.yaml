id: ramlila-maidan-ramdev-2011
title: Ramlila Maidan midnight police action on Baba Ramdev's camp
summary: >
  Baba Ramdev's Bharat Swabhiman Trust held a permitted yoga camp at Ramlila Maidan from
  1 June 2011 and turned it into a fast against black money on 4 June. Late that night
  Delhi Police withdrew the permission, imposed a Section 144 order and cleared the ground
  after midnight with tear gas; one participant, Rajbala, later died of her injuries. The
  Supreme Court took suo motu notice and in February 2012 found that the action suffered
  from arbitrariness and, to some extent, abuse of power, and ordered compensation and
  action against police personnel.
period:
  start: 2011-06-04
  end: 2011-06-05
location:
  states: [Delhi]
  places: [Ramlila Maidan]
protest:
  cause: Return of black money held abroad and action against corruption
  organisers: [Bharat Swabhiman Trust, Baba Ramdev]
  scale: Over 20,000 people at Ramlila Maidan on the night of 4 June per Delhi Police; 15,000 to 20,000 in the tent per the conceded position before the Supreme Court
