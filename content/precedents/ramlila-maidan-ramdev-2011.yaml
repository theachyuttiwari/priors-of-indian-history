    person: Manmohan Singh
    role_at_time: Prime Minister
    in_power: true
    date: 2011-06-06
    kind: verbatim
    statement: "Told reporters the police operation was unfortunate but that there was no alternative."
    quote:
      text: "It is unfortunate that operation had to be conducted but quite honestly, there was no alternative."
      locator: "Second paragraph"
      source: s3
    sources: [s3]
  - party: INC
    person: P. Chidambaram
    role_at_time: Union Home Minister
    in_power: true
    date: 2011-06-08
    kind: verbatim
    statement: "At a media briefing, acknowledged the right to protest peacefully, said permission is sometimes refused and that Ramlila ground is in a sensitive area, and said decisions on permission and on directions under section 65 of the Delhi Police Act are taken by the police."
    quote:
      text: "A small spark can trigger a conflagration."
      locator: "Final paragraph of the opening statement"
      source: s5
    sources: [s5, s4]
  - party: BJP
    person: Sushma Swaraj
    role_at_time: Leader of Opposition, Lok Sabha
    in_power: false
    date: 2011-06-05
    kind: verbatim
    statement: "Said the police action was carried out at the direction of the Prime Minister with the full approval of the Congress president, after consulting P. Chidambaram and Kapil Sibal."
    quote:
      text: "This is not democracy...the police cannot alone had taken such a step."
      locator: "Paragraph beginning 'Leader of the Opposition in the Lok Sabha Sushma Swaraj'"
      source: s2
    sources: [s2]
  - party: BJP
    person: L.K. Advani
    role_at_time: Senior BJP leader, opposition
    in_power: false
    date: 2011-06-05
    kind: verbatim
    statement: "In Chennai, called the action naked fascism, compared it to the Jallianwala Bagh incident and demanded an apology from the Prime Minister and the Congress president."
    quote:
      text: "The Prime Minister and the Congress president owe an apology not only to Ramdev, but the people of India,"
      locator: "Paragraph beginning 'I did not anticipate'"
      source: s2
    sources: [s2]
  - party: BJP
    person: Nitin Gadkari
    role_at_time: BJP president
    in_power: false
    date: 2011-06-05
    kind: verbatim
    statement: "In Lucknow, recalled the Emergency, called the UPA government fascist and announced a 24-hour satyagraha by BJP leaders at Rajghat."
    quote:
      text: "such brutality against an unarmed sadhu, women and children in the middle of the night is the worst form of tyranny."
      locator: "Paragraph beginning 'Simultaneous satyagrahas'"
      source: s2
    sources: [s2]
  - party: BJP
    person: B.S. Yeddyurappa
    role_at_time: Chief Minister of Karnataka
    in_power: false
    date: 2011-06-06
    kind: paraphrase
    statement: "Called the eviction of Ramdev and the police action at Ramlila ground anti-democratic; the Karnataka government decided to move a resolution in the state assembly condemning it."
    sources: [s3]
