id: delhi-gang-rape-protests-2012
title: December 2012 Delhi gang-rape protests
summary: >
  After the gang rape of a physiotherapy student on a Delhi bus on 16 December 2012, crowds
  gathered at India Gate and Raisina Hill. On 22 and 23 December police used water
  cannon, tear gas and lathis, imposed Section 144 and closed central metro stations and
  roads. A police constable deployed at India Gate died on 25 December; the cause of his
  death was disputed. The Union government set up the Justice Verma Committee on 23 December
  to recommend changes to criminal law on sexual assault.
period:
  start: 2012-12-22
  end: 2012-12
location:
  states: [Delhi]
  places: [India Gate, Raisina Hill, Vijay Chowk, Rajpath, Jantar Mantar]
protest:
  cause: Justice for the victim and tougher laws and policing on sexual violence
  organisers: [Largely unorganised; students and citizens' groups]
  scale: Thousands at India Gate on 23 December; about 3,000 per the Home Minister
