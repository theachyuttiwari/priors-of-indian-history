actions:
  - type: tear_gas
    date: 2012-12-22
    claim: happened
    description: "On 22 December Delhi Police and Rapid Action Force personnel used water cannon, tear gas and baton charges to push back protesters who gathered at Raisina Hill, near Rashtrapati Bhavan and Parliament House, and tried to march towards Rashtrapati Bhavan. Some protesters tried to break through barricades, and buses and police vehicles were damaged. Al Jazeera reported that some women protesters were injured when police charged them near a central government building. Delhi Police registered a case of rioting and damage to public property at Parliament Street police station."
    actor: police
    sources: [s11, s19, s9, s4, s1]
    figures:
      - what: civilians injured on 22 December
        value: "35"
        claimed_by: Delhi Police (spokesperson Rajan Bhagat)
        source: s11
      - what: police personnel injured on 22 December
        value: "37"
        claimed_by: Delhi Police (spokesperson Rajan Bhagat)
        source: s11
  - type: section_144
    date: 2012-12-23
    claim: ordered
    description: "Delhi Police prohibitory orders barred assemblies in central New Delhi, including India Gate, Rajpath and the area near Rashtrapati Bhavan, and police asked protesters to demonstrate at Jantar Mantar or Ramlila Maidan instead. Reports differ on the threshold: PTI reported a ban on four or more people, Al Jazeera on more than five. A public interest petition in the Delhi High Court (WP 8127 of 2012, Anand K. Mishra v. Delhi Police) described the order as dated 22 December and challenged it as a breach of the rights to assemble and move freely; the Additional Solicitor General argued for Delhi Police that protesters were obstructing traffic and that the order was within Section 144, and on 2 January 2013 the Chief Justice's bench reserved orders. The Associated Press reported that on 23 December authorities withdrew the ban on assembly in the high-security zone as crowds converged, while keeping barricades. On 25 December police told protesters at Jantar Mantar that prohibitory orders were in place and no protests were allowed in and around India Gate."
    actor: police
    legal_basis: Section 144 CrPC, 1973 (as reported; the order itself was not found)
    sources: [s13, s17, s22, s1, s26, s36, s27]
  - type: lathi_charge
    date: 2012-12-23
    claim: happened
    description: "On 23 December police used batons, tear gas and water cannon to clear crowds at India Gate and near Vijay Chowk. Reports describe some protesters throwing stones, burning barricades and overturning vehicles; police said the protest had been joined by hooligans. Journalists' bodies protested at the Press Club of India against police action on reporters. Late on 24 December Delhi Police tweeted an apology to any innocent protester who had been hurt or lathi-charged. In its report the Justice Verma Committee wrote: \"The lathi charge on peaceful demonstrators after the December 16 gang rape has scarred the Indian democracy.\""
    actor: police
    sources: [s7, s10, s17, s29, s23, s1, s6, s32]
    figures:
      - what: tear gas shells fired at India Gate on 23 December
        value: "around 150"
        claimed_by: PTI report
        source: s23
      - what: tear gas shells fired at India Gate on 23 December
        value: "about 250"
        claimed_by: The Tribune
        source: s29
      - what: people treated for injuries at a nearby hospital, including several policemen
        value: "at least 30"
        claimed_by: Officials (as reported by Al Jazeera)
        source: s1
      - what: protesters injured, besides some media personnel
        value: "around 100"
        claimed_by: Delhi Police (as reported by PTI)
        source: s23
      - what: civilians hospitalised
        value: "over 50"
        claimed_by: The Tribune
        source: s29
      - what: police personnel hurt
        value: "78"
        claimed_by: Reports cited by The Tribune
        source: s29
      - what: journalists injured
        value: "as many as 40"
        claimed_by: Journalists' protest (as reported by The Tribune)
        source: s6
  - type: barricading
    date: 2012-12-23
    claim: happened
    description: "On Delhi Police directions, the Delhi Metro Rail Corporation announced late on 22 December that four stations near India Gate would close until further orders, and shut four more on the morning of 23 December. The eight stations shut on 23 December were Race Course, Udyog Bhawan, Central Secretariat, Patel Chowk, Barakhamba Road, Mandi House, Khan Market and Pragati Maidan. On 24 December nine were shut, adding Rajiv Chowk. Police barricaded Rajpath and the road from India Gate to Rashtrapati Bhavan, and traffic police closed the arterial roads leading to India Gate. All nine stations reopened on 25 December."
    actor: police
    sources: [s12, s14, s9, s10, s2, s6, s33]
    figures:
      - what: metro stations closed on 23 December
        value: "8"
        claimed_by: Delhi Metro Rail Corporation (as reported by The Hindu)
        source: s12
      - what: metro stations closed on 24 December
        value: "9"
        claimed_by: Millennium Post
        source: s14
  - type: detention
    date: 2012-12-23
    claim: happened
    description: "Early on 23 December police removed protesters who had spent the night at Raisina Hill, taking them away in a bus, and took into custody protesters outside Congress president Sonia Gandhi's residence. Later that morning police forcibly removed protesters from India Gate for defying the prohibitory orders; women protesters alleged that male police personnel manhandled them. The Guardian reported that scores of protesters had been detained or forcibly removed from sit-ins over 24 hours."
    actor: police
    sources: [s9, s22, s27]
  - type: detention
    date: 2012-12-25
    claim: happened
    description: "On 25 December police detained a group of young women protesters from Jantar Mantar and outside Parliament Street police station for violating prohibitory orders, and released them after about four hours. The women alleged that police manhandled them; police sources denied this and said the group had tried to incite others and break through barricades."
    actor: police
    sources: [s13, s16]
    figures:
      - what: women detained
        value: "16"
        claimed_by: NDTV report
        source: s16
  - type: fir
    date: 2012-12-25
    claim: ordered
    description: "Constable Subhash Chand Tomar, deployed at India Gate on 23 December, collapsed during the clashes and died at Ram Manohar Lohia Hospital on 25 December. Delhi Police said protesters attacked him. Police registered a case at Tilak Marg police station against eight people arrested after the protest, first for attempt to murder and rioting, and after his death invoked a murder charge. The eight were granted bail and said they had been wrongly implicated. The cause of death was disputed. The post-mortem report, as released by police, recorded myocardial infarction that could be precipitated by blunt-force injuries to the neck and chest. The hospital's medical superintendent said he had no major external injury marks except some cuts and bruises. Two protesters who helped him said he collapsed while running and was not beaten; a third witness later told the Crime Branch that he saw a stone hit Tomar and men kick him. The investigation was transferred to the Crime Branch."
    actor: police
    legal_basis: Section 302 IPC (murder), as stated by the Police Commissioner
    sources: [s18, s17, s25, s24, s28, s34]
    figures:
      - what: people arrested and charged over the attack on the constable
        value: "8"
        claimed_by: Delhi Police (Commissioner Neeraj Kumar)
        source: s34
  - type: commission_of_inquiry
    date: 2012-12-23
    claim: ordered
    description: "The Union government constituted a three-member Committee on Amendments to Criminal Law, chaired by former Chief Justice of India J. S. Verma, with Justice Leila Seth and Gopal Subramanium, to recommend amendments to criminal law for quicker trial and enhanced punishment in cases of aggravated sexual assault. Its report, dated 23 January 2013, says the committee was constituted in response to the country-wide public outcry."
    actor: centre
    legal_basis: Gazette Notification No. SO 3003(E) dated 23 December 2012
    sources: [s7, s5]
  - type: other
    date: 2012-12-24
    description: "The Home Minister said an inquiry had been ordered into the violence at India Gate and Rashtrapati Bhavan to identify those who started it, and that the government had information that some political elements were behind the violence."
    actor: centre
    sources: [s3, s21, s31]
outcome: >
  The Justice Verma Committee reported on 23 January 2013. Its recommendations fed into
  the Criminal Law (Amendment) Ordinance and Act, 2013.
positions:
  - party: INC
    person: Sushilkumar Shinde
    role_at_time: Union Home Minister
    in_power: true
    date: 2012-12-22
    kind: verbatim
    statement: "In a statement at a press conference, announced measures on women's safety in Delhi, appealed for calm, and said the government would set up a Commission of Inquiry under the Commissions of Inquiry Act, 1952."
    quote:
      text: "The Government also respects the right of legitimate protest."
      locator: "Paragraph beginning 'The government shares the widespread concern'"
      source: s20
    sources: [s20, s19]
  - party: INC
    person: Sushilkumar Shinde
    role_at_time: Union Home Minister
    in_power: true
    date: 2012-12-24
    kind: paraphrase
    statement: "In interviews, defended the use of force at India Gate, saying hooligans and political elements had joined the protesters. Asked why he had not gone to India Gate, said he had already met protest representatives and that if he went there he would also have to meet other demonstrators, such as party workers or armed Maoists."
    sources: [s3, s21, s31]
  - party: INC
    person: Manmohan Singh
    role_at_time: Prime Minister
    in_power: true
    date: 2012-12-24
    kind: verbatim
    statement: "In a televised address, said public anger at the crime was justified but violence would serve no purpose, expressed sadness at the clashes between protesters and police, and appealed for peace and calm."
    quote:
      text: "I also feel deeply sad at the turn of events leading to clashes between protesters and police forces."
      locator: "Second paragraph"
      source: s8
    sources: [s8, s10]
  - party: INC
    person: Sheila Dikshit
    role_at_time: Chief Minister of Delhi
    in_power: true
    date: 2012-12-23
    kind: paraphrase
    statement: "After an emergency meeting of the Delhi Cabinet, criticised the police handling of the India Gate protest, said senior police officers must be held responsible, and met the Home Minister to ask for steps to restore confidence in policing."
    sources: [s2, s15]
  - party: BJP
    person: Vijender Gupta
    role_at_time: Delhi BJP president, opposition
    in_power: false
    date: 2012-12-24
    kind: paraphrase
    statement: "Called for a judicial inquiry into the lathi charge, said media footage showed police assaulting women at a sit-in, and said the Chief Minister and Home Minister should take responsibility."
    sources: [s6]
  - party: BJP
    person: Sushma Swaraj
    role_at_time: Leader of Opposition, Lok Sabha
    in_power: false
    date: 2012-12-22
    kind: paraphrase
    statement: "Said on Twitter that she had asked the Prime Minister to convene a special session of Parliament to frame a law providing exemplary punishment for crimes against women, and that he would consider it."
    sources: [s4]
  - party: BJP
    person: Ravi Shankar Prasad
    role_at_time: BJP chief spokesperson, opposition
    in_power: false
    date: 2012-12-22
    kind: verbatim
    statement: "Said the police should have been sensitive, called the lathi charge, water cannon and handling of the protest regrettable and condemnable, and asked the Prime Minister to speak."
    quote:
      text: "BJP condemns the police action outright,"
      locator: "Paragraph beginning 'The Prime Minister ought to have spoken to them'"
      source: s35
    sources: [s35]
