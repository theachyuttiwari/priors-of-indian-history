    in_power: true
    date: 2018-05-24
    kind: paraphrase
    statement: "Told reporters that police fired after protesters attacked them and set vehicles on fire, that it was natural for someone attacked to defend themselves, and that the firing was not pre-planned. He blamed some political parties and anti-social elements for leading peaceful protesters astray, and said the government was taking legal steps to close the plant."
    sources: [s1, s16, s17]
  - party: DMK
    person: M.K. Stalin
    role_at_time: Working President of DMK and Leader of Opposition, Tamil Nadu Assembly
    in_power: false
    date: 2018-05-24
    kind: paraphrase
    statement: "Said the state government had been unable to answer for the deaths in Thoothukudi and that the DMK's fight would not stop until the Chief Minister and the DGP resigned. He staged a sit-in at the Secretariat demanding their resignations and was removed and detained by police."
    sources: [s1, s16, s18, s23]
  - party: INC
    person: Rahul Gandhi
    role_at_time: President, Indian National Congress
    in_power: false
    date: 2018-05-22
    kind: verbatim
    statement: "On Twitter, called the police shooting of nine people in the protest state sponsored terrorism, said the citizens were murdered for protesting against injustice, and offered prayers for the families and the injured."
    quote:
      text: "The gunning down by the police of 9 people in the #SterliteProtest in Tamil Nadu, is a brutal example of state sponsored terrorism."
      locator: "Tweet text, first sentence"
      source: s19
    sources: [s19]
  - party: DMK
    person: M.K. Stalin
    role_at_time: Chief Minister of Tamil Nadu
    in_power: true
    date: 2022-10-19
    kind: paraphrase
    statement: "Replying to an Assembly debate on the commission report, said those guilty of the firing would be punished, that disciplinary action had been started against the officers named, and that compensation to the families would be raised."
    sources: [s21, s11, s22]
