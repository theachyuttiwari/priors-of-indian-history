actions:
  - type: section_144
    date: 2018-05-21
    claim: ordered
    description: "An order under Section 144 CrPC was passed at 10.30 pm on 21 May, the night before the 100th-day march, according to the Madras High Court. Vedanta had asked the High Court for such an order, and on 18 May the court directed the District Collector to consider its representations and pass orders by 21 May. A petitioner told the court that the order covered only the Thoothukudi South and SIPCOT police station limits, that marchers were never told of it, and that there was no proof it was published. The State said it was announced through television, newspapers, megaphones and the Collector's social media. The Chief Minister said thousands had defied prohibitory orders imposed by the district collector. The Aruna Jagadeesan Commission later found that the SP had not specified routes to the permitted venue, the SAV school grounds, which led protesters to violate the order. Prohibitory orders remained in force in the town after the firing"
    actor: state
    legal_basis: Section 144 CrPC
    sources: [s6, s15, s9, s13, s18]
  - type: firing
    date: 2018-05-22
    claim: happened
    description: "Police fired on protesters at and around the Collectorate on 22 May, and fired again on 23 May, when one more person was killed. Whether the firing was provoked is contested. The Chief Minister said protesters attacked the police and torched vehicles and that the police acted in self-defence. In the High Court the State said the firing was ordered by an Executive Magistrate to disperse a riotous mob; the court noted that the officer who ordered it was not the jurisdictional Executive Magistrate and had assumed powers he did not possess. The Aruna Jagadeesan Commission found that the firing was unprovoked and not in private defence, that police shot from hiding at protesters who were far away and fleeing, and that one constable fired 17 rounds. Deaths are counted as 13 by the police and the commission; The News Minute counts 14, including a person who died in October 2018"
    actor: police
    sources: [s1, s2, s6, s9, s10, s11, s12, s5, s16]
    figures:
      - what: killed in police firing on 22 May
        value: "11"
        claimed_by: PTI
        source: s2
      - what: dead (11 men, 2 women)
        value: "13"
        claimed_by: IG (South Range) Shailesh Kumar
        source: s1
      - what: injured, 19 of them severely
        value: "102"
        claimed_by: IG (South Range) Shailesh Kumar
        source: s1
      - what: injured, including 70 policemen
        value: "more than 140"
        claimed_by: State of Tamil Nadu (Additional Advocate General, Madras High Court)
        source: s6
      - what: dead, counting Justin Selva Mithesh, who died of lathi-charge injuries
        value: "13"
        claimed_by: Aruna Jagadeesan Commission (as reported by The News Minute)
        source: s9
      - what: dead, including one person who died in October 2018
        value: "14"
        claimed_by: The News Minute
        source: s9
      - what: injured by bullets
        value: "at least 33"
        claimed_by: Down To Earth
        source: s11
      - what: rounds fired by one constable, Sudalaikannu
        value: "17"
        claimed_by: Aruna Jagadeesan Commission (as reported by Deccan Herald)
        source: s10
  - type: detention
    date: 2018-05-23
    claim: happened
    description: "Police arrested people over the violence from 23 May. Collector Sandeep Nanduri said 65 people had been arrested and remanded and 68 more would be produced before a magistrate for damaging public property; the Tribune reported that 65 of those arrested were granted bail later that day. In the High Court the State said 94 people were taken for interrogation, 65 of them were arrested on 23 May and remanded the next day, and 244 people had been arrested by 14 June. Rights activists alleged that hundreds of young people were held in illegal custody; SP Murali Rambha denied this. The IG said vehicles worth Rs 1.27 crore were burnt"
    actor: police
    sources: [s1, s6, s14, s18]
    figures:
      - what: arrested and remanded for violence (68 more to be produced before a magistrate)
        value: "65"
        claimed_by: Collector Sandeep Nanduri
        source: s1
      - what: taken into custody and remanded
        value: "145"
        claimed_by: SP Murali Rambha
        source: s14
      - what: cases registered in the district up to 14 June 2018
        value: "243"
        claimed_by: State of Tamil Nadu (Additional Advocate General, Madras High Court)
        source: s6
      - what: persons arrested up to 14 June 2018
        value: "244"
        claimed_by: State of Tamil Nadu (Additional Advocate General, Madras High Court)
        source: s6
      - what: value of vehicles burnt
        value: "Rs 1.27 crore"
        claimed_by: IG (South Range) Shailesh Kumar
        source: s1
  - type: internet_shutdown
    date: 2018-05-23
    claim: ordered
    description: "The Tamil Nadu government suspended internet services in Thoothukudi, Tirunelveli and Kanyakumari districts from 23 May until 27 May. The order said provocative messages with half truths on social media had led to the gathering of about 20,000 people, and that the internet had to be stopped to prevent such rumours. After the Madras High Court asked the State on 25 May why the two other districts were covered, services were restored in Tirunelveli and Kanyakumari while the suspension in Thoothukudi continued. The State told the court that the Home Secretary revoked the order after two days for those districts and two days later for Thoothukudi. In August 2018 the court directed the Home Secretary to form a committee to apply international standards when using the 2017 suspension rules"
    actor: state
    legal_basis: Temporary Suspension of Telecom Services (Public Emergency or Public Safety) Rules, 2017, Rule 2(1); G.O. No. 679
    sources: [s6, s13, s2, s24, s1]
  - type: other
    date: 2018-05-23
    claim: happened
    description: "Officer transfers: District Collector N. Venkatesh and Superintendent of Police P. Mahendran were transferred. Sandeep Nanduri became Collector and Murali Rambha became SP of Thoothukudi."
    actor: state
    sources: [s2, s18, s23, s14]
  - type: commission_of_inquiry
    date: 2018-05-23
    claim: ordered
    description: "The state government appointed retired Madras High Court judge Aruna Jagadeesan as a one-member commission of inquiry into the police firing, a day after it. The commission gave an interim report in May 2021 and its final report to Chief Minister M.K. Stalin on 18 May 2022; the report, about 3,000 pages, was tabled in the Assembly on 18 October 2022. It found the firing unprovoked, recommended departmental action, without prejudice to criminal action, against 17 police personnel including IG Shailesh Kumar Yadav, DIG Kapil Kumar C. Saratkar and SP P. Mahendran, and recommended departmental action against Collector N. Venkatesh and three deputy tahsildars. It called the then Chief Minister's statement that he learnt of the firing from television incorrect, and recommended Rs 50 lakh compensation for each death"
    actor: state
    legal_basis: Commissions of Inquiry Act, 1952 (as reported by The Wire)
    sources: [s15, s11, s9, s10, s12, s5]
    figures:
      - what: police personnel the commission recommended action against
        value: "17"
        claimed_by: Aruna Jagadeesan Commission (as reported by The News Minute)
        source: s9
      - what: total compensation recommended for each death (Rs 20 lakh already paid)
        value: "Rs 50 lakh"
        claimed_by: Aruna Jagadeesan Commission (as reported by The News Minute)
        source: s9
  - type: other
    date: 2018-05-28
    claim: ordered
    description: "Plant closure: by G.O. Ms. No. 72 of the Environment and Forests Department, the Tamil Nadu government endorsed the Pollution Control Board's closure directions of 23 May and directed the Board to seal the unit and close the plant permanently. A committee set up by the National Green Tribunal reported in November 2018 that the closure orders could not be sustained because the company had not been given notice or a hearing, and the Tribunal set aside the orders on 15 December 2018. The Supreme Court set aside the Tribunal's judgment in February 2019 for lack of jurisdiction; the Madras High Court upheld the closure in August 2020, and the Supreme Court dismissed Vedanta's petitions against that judgment in February 2024"
    actor: state
    legal_basis: Section 18(1)(b), Water (Prevention and Control of Pollution) Act, 1974
    sources: [s7, s8, s4]
    court_outcomes:
      - summary: The National Green Tribunal set aside the closure orders on 15 December 2018; the Supreme Court set that judgment aside on 18 February 2019, holding that the appeal to the Tribunal was not maintainable.
        source: s7
      - summary: The Supreme Court dismissed Vedanta's petitions against the Madras High Court judgment of 18 August 2020, which had upheld the closure.
        source: s8
  - type: other
    date: 2018-08-14
    claim: held
    description: "CBI probe: the Madurai bench of the Madras High Court transferred the investigation in two SIPCOT police station cases to the CBI and directed it to register cases on complaints against officials and police and finish within four months. The court said it failed to understand how not a single case, not even under Section 174 CrPC, had been registered on behalf of the injured or the families of the dead. In November 2018 the CBI registered a case against unidentified Tamil Nadu police personnel and revenue officials for criminal conspiracy, criminal intimidation and disobeying law with intent to cause injury."
    actor: court
    sources: [s6, s3]
  - type: other
    date: 2022-10
    claim: ordered
    description: "Action on the commission report: after the report was tabled, the Tamil Nadu government suspended four policemen, among them constable Sudalaikannu, and began penalty proceedings against former Collector N. Venkatesh. Reports differ on whether the senior officer suspended was a DSP or an inspector. The Chief Minister told the Assembly that disciplinary action had been started against the IG, DIG, SP and other officers named in the report, and the government announced an additional Rs 5 lakh for each of the 13 families"
    actor: state
    sources: [s20, s11, s21, s22]
    figures:
      - what: policemen suspended
        value: "4"
        claimed_by: Deccan Herald
        source: s20
      - what: additional compensation for each family of the dead
        value: "Rs 5 lakh"
        claimed_by: Government of Tamil Nadu (as reported by Deccan Herald)
        source: s21
outcome: >
  The state ordered Sterlite Copper shut on 28 May 2018, and the closure was upheld by the Madras
  High Court in 2020 and the Supreme Court in 2024. The CBI took over the investigation after a
  Madras High Court order and registered a case in November 2018 against unnamed police and
  revenue officials. The Aruna Jagadeesan Commission reported that police fired unprovoked and
  recommended action against 17 police personnel and the then Collector; the DMK government began
  disciplinary action in October 2022.
positions:
