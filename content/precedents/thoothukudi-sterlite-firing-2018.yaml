id: thoothukudi-sterlite-firing-2018
title: Thoothukudi anti-Sterlite protest and police firing, May 2018
summary: >
  Residents of Thoothukudi (Tuticorin) protested against the expansion of Vedanta's Sterlite
  Copper smelter. A prohibitory order under Section 144 CrPC was passed on the night of 21 May
  2018. On 22 May police opened fire after clashes, and one more person was shot on 23 May; the
  police said 13 people died and 102 were injured. The Tamil Nadu government suspended internet
  in three districts, appointed retired High Court judge Aruna Jagadeesan to inquire, and ordered
  the plant shut on 28 May 2018. The Madurai bench of the Madras High Court later handed the
  investigation to the CBI. The commission's report, tabled in October 2022, found the firing
  unprovoked.
