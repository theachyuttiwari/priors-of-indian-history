    party: Janata Dal
    alliance: National Front
    head: V. P. Singh
    role: Prime Minister
actions:
  - type: other
    date: 1990-08-13
    description: The Government Order reserving 27 per cent of central government and public sector posts for socially and educationally backward classes was issued. V. P. Singh announced its implementation in his Independence Day speech on 15 August.
    actor: centre
    sources: [s1]
  - type: firing
    date: 1990-09
    description: "Police firing was reported in six states and claimed more than 50 lives, according to Wikipedia's Mandal Commission article. The source does not give dates or places for each firing."
    actor: police
    sources: [s1]
  - type: other
    date: 1990
    description: "Police prevented the extension of student strikes and stopped some strike activity, according to Wikipedia's article on the 1990 protests. The source gives no details."
    actor: police
    sources: [s2]
  - type: other
    date: 1990
    description: A five-judge bench of the Supreme Court, hearing a petition by Indra Sawhney filed in September 1990, stayed the 13 August government order until the case was finally decided.
    actor: court
    sources: [s1, s3]
outcome: >
  V. P. Singh lost a confidence vote and resigned on 7 November 1990, after the BJP withdrew
  support over L. K. Advani's arrest during the Rath Yatra. On 16 November 1992 the Supreme Court
  in Indra Sawhney upheld 27 per cent OBC reservation, excluded the creamy layer, and set a 50 per
  cent ceiling.
