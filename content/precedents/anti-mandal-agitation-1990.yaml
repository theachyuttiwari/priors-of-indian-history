id: anti-mandal-agitation-1990
title: Anti-Mandal agitation, 1990
summary: >
  On 7 August 1990 the National Front government of V. P. Singh announced 27 per cent reservation
  for socially and educationally backward classes in central government jobs and public sector
  undertakings, following the Mandal Commission report. Upper-caste students across north India
  closed colleges, held rallies and clashed with police. On 19 September 1990 Delhi student Rajeev
  Goswami attempted self-immolation, and about 200 attempts followed with more than 60 deaths.
  Police firing was reported in six states, and the Supreme Court stayed the government order.
period:
  start: 1990-08-07
  end: 1990-11
location:
  states: [Delhi, Uttar Pradesh, Bihar, Andhra Pradesh]
  places: [Deshbandhu College, AIIMS intersection Delhi, Hyderabad]
protest:
  cause: Withdrawal of the 27 per cent OBC reservation in central government jobs
  organisers: [College and university students in north India, Delhi University students]
  scale: "Bandhs and campus shutdowns across north India; nearly 200 self-immolation attempts with 62 deaths reported"
