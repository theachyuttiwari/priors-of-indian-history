id: anti-mandal-agitation-1990
title: Anti-Mandal agitation, 1990
summary: >
  On 7 August 1990 Prime Minister V. P. Singh of the National Front government announced that it
  would implement the Mandal Commission report. An Office Memorandum of 13 August reserved 27 per cent
  of vacancies in civil posts and services under the Government of India for socially and
  educationally backward classes. Students across north India closed colleges, held bandhs and rallies
  and clashed with police. After Delhi student Rajeev Goswami set himself on fire on 19 September 1990,
  a wave of self-immolation and suicide attempts followed, and police fired on protesters in several
  states. On 1 October 1990 the Supreme Court stayed the memorandum.
period:
  start: 1990-08-07
  end: 1990-11
location:
  states: [Delhi, Uttar Pradesh, Bihar, Orissa, Andhra Pradesh]
  places: [Deshbandhu College, AIIMS crossing Delhi, Laxmibai Nagar Delhi, Hyderabad]
protest:
  cause: Withdrawal of the 27 per cent OBC reservation in central government jobs
  organisers: [College and university students in north India, Delhi University students]
  scale: "Bandhs and campus shutdowns across north India. Counts of suicide attempts range from more than 80 with 30 deaths by 10 October (Christian Science Monitor) to 202 with 112 deaths by the end of 1990 (a PUDR count cited in Manushi). The historian Ramachandra Guha puts attempts at about 200, with more than 60 deaths (cited in Frontline)"
government:
  centre:
    party: Janata Dal
    alliance: National Front
    head: V. P. Singh
    role: Prime Minister
actions:
  - type: other
    date: 1990-08-13
    claim: ordered
    description: "V. P. Singh announced on 7 August 1990 that the government would implement the Mandal Commission recommendations. Office Memorandum No. 36012/31/90-Estt (SCT) of 13 August 1990 reserved 27 per cent of vacancies in civil posts and services under the Government of India, filled by direct recruitment, for socially and educationally backward classes, with effect from 7 August. It said that similar instructions for public sector undertakings and financial institutions would be issued separately. Singh restated the commitment in his Independence Day speech at the Red Fort."
    actor: centre
    sources: [s1, s3, s7]
    court_outcomes:
      - summary: On 16 November 1992 the Supreme Court held the memorandum valid and enforceable, subject to excluding socially advanced persons (the creamy layer) from the backward classes.
        source: s1
  - type: firing
    date: 1990-09
    description: "Police fired on protesters in several states. By 10 October the Christian Science Monitor reported 40 deaths in police shootings connected with the demonstrations. India Today reported that six people were killed in police firing in Orissa, and Manushi reported three deaths in police firing in Bihar. Accounts of police conduct in Delhi differ: the video magazine Newstrack presented the police firing at Laxmibai Nagar as brutality, while Madhu Kishwar, reviewing that coverage in Manushi, wrote that the police had been mostly on the defensive and fired after days of stone-throwing."
    actor: police
    sources: [s3, s4, s8, s9]
    figures:
      - { what: killed in police shootings connected with the demonstrations, by 10 October, value: "40", claimed_by: The Christian Science Monitor, source: s3 }
      - { what: killed in police firing in Orissa, value: "6", claimed_by: India Today, source: s4 }
      - { what: killed in police firing in Bihar, value: "3", claimed_by: Manushi (Harsh Sethi), source: s8 }
  - type: detention
    date: 1990-09
    description: "Police detained protesting students. India Today reported that more than 3,500 students were rounded up in Uttar Pradesh in connection with the violence. In Delhi, police cleared a student blockade at the AIIMS crossing by loading students into vans, according to Newstrack commentary quoted in Manushi; Madhu Kishwar wrote that the students were let off a short distance away."
    actor: police
    sources: [s4, s9]
    figures:
      - { what: students rounded up in Uttar Pradesh, value: "more than 3,500", claimed_by: India Today, source: s4 }
      - { what: students at the AIIMS crossing blockade, value: "1,000 or so", claimed_by: Newstrack (quoted in Manushi), source: s9 }
  - type: other
    date: 1990-10-01
    description: "On 1 October 1990 a Constitution Bench of the Supreme Court stayed the 13 August memorandum on writ petitions that challenged it, until the case was decided. Counsel K. K. Venugopal moved for the stay. On 21 September a three-judge bench had appealed to the public, and particularly to students, to stay calm while the court decided the question. The memorandum was not acted on while the stay lasted."
    actor: court
    sources: [s1, s3, s5]
outcome: >
  V. P. Singh lost a confidence vote and resigned on 7 November 1990, after the BJP withdrew
  support over L. K. Advani's arrest during the Rath Yatra. On 16 November 1992 the Supreme Court
  in Indra Sawhney upheld 27 per cent OBC reservation, excluded the creamy layer, and set a 50 per
  cent ceiling.
positions:
  - party: Janata Dal
    person: V. P. Singh
    role_at_time: Prime Minister
    in_power: true
    date: 1990-08-09
    kind: verbatim
    statement: "Replying to members in the Rajya Sabha, said that reservation for backward classes aimed to give them a share in decision-making and the power structure, not only jobs. He questioned the merit of a system in which, he said, groups forming 52 per cent of the population held 12.55 per cent of government employment."
    quote:
      text: "What I want to convey is that treating unequals as equals is the greatest injustice."
      locator: "Rajya Sabha debates, 9 August 1990, col. 234"
      source: s2
    sources: [s2, s1]
  - party: other (no party; petitioner)
    person: Indra Sawhney
    role_at_time: Lead petitioner in the Supreme Court
    in_power: false
    date: 1990-10
    kind: paraphrase
    statement: "The petitioners who challenged the order, in the case led by Indra Sawhney, argued through counsel that caste could not be equated with class or used as the basis for identifying backward classes, and that reservation would lower the efficiency of administration."
    sources: [s1, s5]
