id: kashmir-lockdown-article-370-2019
title: Jammu and Kashmir lockdown after the abrogation of Article 370, 2019-2021
summary: >
  On 4-5 August 2019, as Parliament moved to read down Article 370 and split Jammu and Kashmir
  into two union territories, authorities cut mobile, internet, landline and cable TV services in
  the Kashmir Valley, imposed Section 144 orders, and detained mainstream political leaders,
  including three former chief ministers. Former chief ministers Farooq Abdullah, Omar Abdullah and
  Mehbooba Mufti were later held under the Public Safety Act. The Supreme Court ruled in January 2020
  that indefinite internet suspension is not permitted and ordered a review of the orders. Mobile
  internet returned at 2G speed in January 2020, and 4G across the union territory in February 2021.
period:
  start: 2019-08-04
  end: 2021-02-05
location:
  states: [Jammu and Kashmir]
  places: [Srinagar, Kashmir Valley, Jammu, Kishtwar, Rajouri, Banihal]
protest:
  cause: Abrogation of Article 370 and bifurcation of Jammu and Kashmir into two union territories
  organisers: [No single organiser; the restrictions were pre-emptive and targeted mainstream parties, separatists and activists]
  scale: "Valley-wide communications blackout and movement restrictions. Detention counts differ by source and date: an unnamed official told Al Jazeera in August 2019 that over 1,000 people had been detained; an unnamed magistrate told AFP that at least 4,000 were held under the Public Safety Act; the Union Home Ministry told the Lok Sabha in December 2019 that 5,161 people had been taken into preventive custody in the Kashmir Valley since 4 August 2019"
government:
  centre:
    party: BJP
    alliance: NDA
    head: Narendra Modi
    role: Prime Minister
  state:
    party: other (President's rule; Union Territory administration from 31 October 2019)
    head: Satya Pal Malik
    role: Governor
    name: Jammu and Kashmir
actions:
  - type: internet_shutdown
    date: 2019-08-04
    claim: ordered
    legal_basis: "Section 5(2), Indian Telegraph Act, 1885, and the Temporary Suspension of Telecom Services (Public Emergency or Public Safety) Rules, 2017 (as stated by the Union Home Ministry in the Lok Sabha on 20 September 2020; the Supreme Court reviewed the orders under the 2017 Suspension Rules)"
    description: "Mobile phone networks, internet services and landline connectivity were discontinued in the Kashmir Valley on 4 August 2019, as recorded in the Supreme Court judgment. Cable TV was also cut, The Indian Express reported. Hindustan Times reported that landlines were restored between mid-August and September 2019, postpaid mobile services on 14 October 2019, and SMS on 1 January 2020. Before the Supreme Court, the Solicitor General said internet was never restricted in the Jammu and Ladakh regions, and that the limited use of the internet was meant to stop messages from outside the country that could incite violence. The court recorded that the State placed only sample orders on record, citing difficulty in producing orders that were withdrawn and modified day to day."
    actor: state
    sources: [s7, s10, s9, s20]
  - type: section_144
    date: 2019-08-05
    claim: ordered
    legal_basis: Section 144 CrPC (orders by District Magistrates restricting movement and public gatherings, as recorded by the Supreme Court)
    description: "District Magistrates imposed restrictions on movement and public gatherings under Section 144 CrPC, as recorded by the Supreme Court. A J&K government statement on the night of 4 August said there would be no movement of public in Srinagar district and all educational institutions would stay closed. PTI, as carried by The Wire, reported that the Srinagar orders banned assembly of more than four people, that similar orders were imposed in Jammu district, and that night curfew was imposed in Kishtwar and Rajouri districts and the Banihal area. The Srinagar district administration posted that restrictions under Section 144 had been imposed and that there were no curfew orders anywhere; The Indian Express reported that residents were not allowed outside their neighbourhoods and that curfew passes were not being issued. Before the Supreme Court, the Solicitor General said individual movement had never been restricted, that restrictions were never imposed in Ladakh, and that they were being relaxed gradually. On 16 August 2019 Chief Secretary BVR Subrahmanyam said no lives had been lost since the restrictions began; AFP reported a family's account that a 62-year-old man died from tear gas fired by security forces (see figures)."
    actor: state
    sources: [s7, s1, s2, s17, s10, s25, s26, s24]
    figures:
      - { what: "deaths or serious injuries since the restrictions began, as of 16 August 2019", value: "none", claimed_by: "Chief Secretary BVR Subrahmanyam (press conference, as reported by AP)", source: s25 }
      - { what: "loss of life or major injury since 5 August 2019, as of 16 August 2019", value: "none", claimed_by: "Chief Secretary BVR Subrahmanyam (press conference, as reported by The Quint)", source: s26 }
      - { what: "death alleged to have been caused by tear gas fired by security forces, by 18 August 2019", value: "1 (Sidiq Khan, 62)", claimed_by: "his nephew Muddasir Ahmed, to AFP", source: s24 }
  - type: house_arrest
    date: 2019-08-04
    claim: happened
    legal_basis: Section 107 CrPC (for Omar Abdullah, according to his sister's petition in the Supreme Court, as reported by The Wire)
    description: "Omar Abdullah, Mehbooba Mufti and other mainstream leaders were placed under house arrest on the night of 4 August 2019. Al Jazeera reported that both were arrested on 5 August, with Omar Abdullah held at Hari Niwas and Mehbooba Mufti at Chashm-e-Shahi, both government guest houses; The Wire reported on 5 August that Mehbooba Mufti had been shifted to Hari Niwas. Farooq Abdullah, a sitting Lok Sabha MP, was held at his home on Gupkar Road, Al Jazeera reported; The Quint reported the government's claim that he had not been put under house arrest. The administration did not publish detention figures at the time, and AFP reported that the J&K government spokesman said there was no centralised figure. Counts given later by the Union Home Ministry in Parliament, and earlier by unnamed officials to the press, differ (see figures). On 15 September 2020 the Home Ministry told the Lok Sabha that no political leader was under house arrest in the union territory; former Union Minister Saifuddin Soz said in a statement that he had been under house arrest since 5 August 2019."
    actor: state
    sources: [s3, s10, s2, s1, s6, s26, s24, s18, s19, s20, s21, s28]
    figures:
      - { what: "people detained by mid-August 2019, including politicians, separatists and activists", value: "over 1,000", claimed_by: "unnamed official in Jammu and Kashmir, to Al Jazeera", source: s3 }
      - { what: "people arrested and held under the Public Safety Act, by 18 August 2019", value: "at least 4,000", claimed_by: "unnamed magistrate, to AFP", source: s24 }
      - { what: "people medically examined at places in Srinagar after being detained, by 18 August 2019", value: "around 6,000", claimed_by: "unnamed police official, to AFP", source: s24 }
      - { what: "people taken into preventive custody in the Kashmir Valley since 4 August 2019, as of 3 December 2019", value: "5,161", claimed_by: "Union Ministry of Home Affairs (written Lok Sabha reply by G. Kishan Reddy)", source: s18 }
      - { what: "people still under preventive detention, as of 3 December 2019", value: "609", claimed_by: "Union Ministry of Home Affairs (written Lok Sabha reply by G. Kishan Reddy)", source: s18 }
      - { what: "people taken into preventive custody since August 2019, as of 5 February 2020", value: "6,605", claimed_by: "Government of Jammu and Kashmir, as reported by the Union Ministry of Home Affairs (written Rajya Sabha reply)", source: s19 }
      - { what: "people still under preventive detention, none of them minors, as of 5 February 2020", value: "437", claimed_by: "Government of Jammu and Kashmir, as reported by the Union Ministry of Home Affairs (written Rajya Sabha reply)", source: s19 }
      - { what: "people under detention, as of 11 September 2020", value: "223", claimed_by: "Government of Jammu and Kashmir, as reported by the Union Ministry of Home Affairs (written Lok Sabha reply)", source: s20 }
      - { what: "political leaders under house arrest, as of 15 September 2020", value: "none", claimed_by: "Union Ministry of Home Affairs (written Lok Sabha reply)", source: s21 }
  - type: detention
    date: 2019-09-14
    claim: ordered
    legal_basis: Jammu and Kashmir Public Safety Act, 1978
    description: "The District Magistrate of Srinagar, Shahid Iqbal Choudhary, ordered the detention of Farooq Abdullah under the Jammu and Kashmir Public Safety Act, 1978 on 14 September 2019, according to documents reported by The Tribune. The order became public on Monday 16 September 2019. The Tribune reported that the dossier cited 34 media reports and documents, and that the order called the detention necessary to maintain public order."
    actor: state
    sources: [s27, s5, s4]
  - type: detention
    date: 2020-02-06
    claim: ordered
    legal_basis: Jammu and Kashmir Public Safety Act, 1978
    description: "Omar Abdullah and Mehbooba Mufti were booked under the PSA on the night of 6 February 2020, when their six-month preventive custody was ending (The Indian Express of 14 October 2020 gives the date as 5 February). The police dossiers accused Omar Abdullah of instigating the masses against central policies and said Mehbooba Mufti had been promoting separatism. Omar Abdullah's sister challenged the order in the Supreme Court; according to The Wire, her petition called the dossier's material 'patently false and ridiculous'. The J&K government revoked Mehbooba Mufti's detention under Section 19(1) of the PSA on 13 October 2020."
    actor: state
    sources: [s5, s6, s12]
  - type: other
    date: 2020-01-10
    claim: held
    description: "Supreme Court judgment in Anuradha Bhasin v. Union of India: free speech and trade over the internet are protected under Article 19; indefinite suspension of internet is not permitted; all suspension and Section 144 orders must be published and reviewed; a review committee must re-examine suspensions every seven working days; and restoration of e-banking, hospital and government website access must be considered."
    actor: court
    sources: [s7]
  - type: concession
    date: 2020-01-25
    claim: ordered
    description: "The J&K administration said on 24 January 2020 that mobile data would be restored across the union territory at 2G speed from 25 January 2020, limited to a government whitelist of websites with social media and VPNs blocked. The Union Home Ministry later told the Lok Sabha that mobile data at 2G speed had been available since 24 January 2020, and that restrictions on social media sites were lifted on 4 March 2020. A first whitelist and partial 2G restoration in the Jammu division and two Valley districts had been announced on 18 January."
    actor: state
    sources: [s8, s9, s20]
  - type: other
    date: 2020-05-11
    claim: held
    description: "In Foundation for Media Professionals v. Union Territory of Jammu and Kashmir, the Supreme Court did not order 4G restored. It set up a Special Committee headed by the Union Home Secretary, with the Union Communications Secretary and the J&K Chief Secretary, to determine whether the restrictions needed to continue, and to examine limiting them to areas where necessary and allowing faster internet on a trial basis in some areas."
    actor: court
    sources: [s23]
  - type: concession
    date: 2021-02-05
    claim: ordered
    description: "The J&K administration ordered restoration of 4G mobile internet across the union territory on 5 February 2021, more than 17 months after it was suspended. The order cited an assessment by a special committee set up on the Supreme Court's 11 May 2020 directions. 4G had been restored on trial in Ganderbal and Udhampur districts from 16 August 2020."
    actor: state
    sources: [s22, s9, s23]
outcome: >
  Mobile internet was restored in stages, with 4G across Jammu and Kashmir from February 2021.
  The J&K government revoked Mehbooba Mufti's PSA detention on 13 October 2020, fourteen months
  after her arrest and two days before the Supreme Court was to hear her daughter's petition.
