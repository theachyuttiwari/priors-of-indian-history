id: punjab-farmers-delhi-chalo-2024
title: Punjab farmers' Delhi Chalo march, 2024-2025
summary: >
  In February 2024 farm unions from Punjab, with leaders including Sarwan Singh Pandher and Jagjit
  Singh Dallewal, began a march to Delhi demanding a legal guarantee of minimum support prices (MSP),
  loan waivers and other measures. The BJP government in Haryana sealed its border with Punjab at
  Shambhu and Khanauri with multi-layered concrete barricades, police used tear gas (including shells
  dropped from drones) and rubber bullets, and mobile internet was suspended in several Haryana
  districts. Union ministers held several rounds of talks. A young farmer, Shubhkaran Singh, died at
  Khanauri in February 2024; the Punjab and Haryana High Court ordered a judicial inquiry and later
  ordered Shambhu to be unblocked. Farmers stayed at the border points until the Punjab government
  cleared them in March 2025.
period:
  start: 2024-02-13
  end: 2025-03-19
location:
  states: [Punjab, Haryana, Delhi]
  places: [Shambhu border, Khanauri border, Ambala]
protest:
  cause: Legal guarantee of MSP for crops, loan forgiveness and other farm demands
  organisers: [Punjab farm unions led by Sarwan Singh Pandher and Jagjit Singh Dallewal]
  scale: Thousands of farmers with tractors camped at the Shambhu and Khanauri border points for about a year
government:
  centre:
    party: BJP
    alliance: NDA
    head: Narendra Modi
    role: Prime Minister
  state:
    party: BJP
    head: Manohar Lal Khattar
    role: Chief Minister (Haryana, which handled the border policing)
    name: Haryana
actions:
  - type: barricading
    date: 2024-02-13
    claim: happened
    description: "By 13 February Haryana had sealed its border with Punjab at Shambhu and other points with layered concrete barricades, iron nails and barbed wire to stop the march to Delhi. Reports differ on the number of layers at Shambhu (see figures). Police sealed entry points into Delhi with barbed wire, spikes, cement blocks and iron nails. On 24 July 2024 the Supreme Court directed Haryana and Punjab to submit proposals to remove the barricades at Shambhu in a phased manner. The highway at Shambhu stayed closed until March 2025; Haryana began removing the cement barricades on 20 March 2025, after Punjab Police cleared the protest sites."
    actor: state
    sources: [s2, s1, s10, s33, s23, s32]
    figures:
      - { what: "layers of concrete barricades at Shambhu", value: "six", claimed_by: "Al Jazeera (photo caption, Rohit Lohia)", source: s2 }
      - { what: "layers of the barricade at the Shambhu barrier", value: "12", claimed_by: Business Today, source: s10 }
  - type: section_144
    date: 2024-02-12
    claim: ordered
    description: "Delhi Police Commissioner Sanjay Arora issued an order under Section 144 CrPC on 12 February for a month. It prohibited rallies, processions and the blocking of roads, and banned tractor rallies from crossing into Delhi; Business Today reported that it also restricted the entry of tractors and trolleys. Business Today reported that Rajasthan sealed its borders with Punjab and Haryana on 11 February and imposed prohibitory orders under Section 144 CrPC in Sri Ganganagar and Hanumangarh districts. The Supreme Court recorded in September 2024 that prohibition orders had been imposed to stop the movement of tractors and trolleys on the national highways."
    actor: police
    legal_basis: Section 144 CrPC
    sources: [s33, s10, s1, s24]
  - type: internet_shutdown
    date: 2024-02-10
    claim: ordered
    description: "The Haryana Home Department ordered the suspension of mobile internet, bulk SMS and dongle services, except voice calls, in Ambala, Kurukshetra, Kaithal, Jind, Hisar, Fatehabad and Sirsa districts from 06:00 on 11 February to 23:59 on 13 February 2024. The order cited a request from the Additional Director General of Police, CID, and the risk that inflammatory material and rumours would spread on mobile internet. Extension orders followed; the order of 23 February extended the suspension in the seven districts to 24 February. PTI reported that the Union government ordered internet services suspended in areas of Patiala, Sangrur and Fatehgarh Sahib districts of Punjab from 12 to 16 February, and from 17 to 24 February in areas of six Punjab districts near the border points."
    actor: state
    legal_basis: "Section 5, Indian Telegraph Act, 1885, read with Rule 2, Temporary Suspension of Telecom Services (Public Emergency or Public Safety) Rules, 2017 (Haryana orders); the Union order for the Punjab areas cites Section 7 of the Telegraph Act read with Rule 2(1) of the same Rules, as quoted by PTI"
    sources: [s12, s13, s14, s1, s9]
  - type: tear_gas
    date: 2024-02-13
    claim: happened
    description: "From 13 February Haryana Police fired tear gas and rubber bullets, and used water cannon, to stop farmers at the Shambhu border near Ambala, including when farmers tried to remove the barricades. Al Jazeera and The Tribune reported that drones were used to drop tear gas shells. The Ambala Deputy Commissioner said only tear gas and rubber bullets were used. Farmers alleged that police also fired pellets; Haryana DGP Shatrujeet Kapur told The Hindu that police did not use pellet guns and that their procedure was tear gas, water cannon, cane charge and then rubber bullets fired at the ground. The Punjab government said three farmers had lost their eyesight to pellet injuries. A Supreme Court order of September 2024 records allegations that the agitators had gathered with weapons and modified tractors, and that the agitation was marred by violence on 13, 14 and 21 February. Injury counts differ (see figures)."
    actor: police
    sources: [s2, s15, s3, s16, s9, s1, s24]
    figures:
      - { what: "people seriously injured, including by pellet guns", value: "around 200", claimed_by: "Amrik Singh, farm union member (to The Hindu)", source: s16 }
      - { what: "people in hospital with rubber bullet and smoke shell injuries", value: "over 50", claimed_by: "Sukvindra Kaur, protester (to Al Jazeera)", source: s2 }
      - { what: "farmers who lost their eyesight to pellet injuries", value: "3", claimed_by: "Punjab government (as reported by Al Jazeera)", source: s3 }
      - { what: "agitators gathered near the Shambhu border at the start", value: "15,000-20,000", claimed_by: "allegation recorded in the Supreme Court order of 2 September 2024", source: s24 }
  - type: negotiation
    date: 2024-02-18
    claim: happened
    description: "Union ministers Arjun Munda, Piyush Goyal and Nityanand Rai held rounds of talks with farm leaders in Chandigarh. Talks on 12 February ended without agreement, and the march began the next day. In the fourth round, on 18 February, the ministers proposed that government agencies buy pulses, maize and cotton at MSP for five years under agreements with farmers. On 19 February the farm leaders rejected the proposal; they said it was not in farmers' interest and kept their demand for a legal guarantee of MSP for all 23 crops."
    actor: centre
    sources: [s3, s17, s1, s16]
  - type: firing
    date: 2024-02-21
    claim: happened
    description: "Shubhkaran Singh, 21, of Bathinda district, died at the Khanauri border on 21 February 2024 (The Tribune later gave his age as 22). Farmers alleged he died in police firing. In the FIR registered by Punjab Police on 28 February, his father said a bullet fired from the Haryana side hit him in the head; the investigating officer wrote that the source of the bullet was a matter of investigation. Hospital documents seen by Newslaundry said he was 'brought dead'. On the afternoon of 21 February Haryana Police said on X that, according to information received so far, no farmer had died and that this was a rumour, and that two police personnel and one protester had been injured at the Data Singh-Khanauri border. The Tribune reported that the autopsy found a fatal blow to the back of the head and that a 'pellet' sample was sent for ballistic examination. 46 farmers had been admitted to Rajindra Hospital, Patiala, by 23 February, 18 of them reportedly with gunshot injuries. The Supreme Court recorded in September 2024 that he lost his life and that related issues were before a committee appointed by the High Court. The cause of death is contested."
    actor: police
    sources: [s19, s4, s18, s20, s21, s24]
    legal_basis: "Zero FIR No. 0041 at Patran police station, Patiala, under Sections 302 and 114 IPC, against unidentified persons (as reported by The Tribune)"
    figures:
      - { what: "farmers admitted to Rajindra Hospital, Patiala, with severe injuries by 23 February", value: "46", claimed_by: "Rajindra Hospital documents (as reported by Newslaundry)", source: s4 }
      - { what: "of those, hit by 'gunshots'", value: "18", claimed_by: "Rajindra Hospital documents (as reported by Newslaundry)", source: s4 }
      - { what: "protesters who died at Shambhu and Khanauri by 23 February", value: "at least 4, including 3 of cardiac arrest", claimed_by: "Rajindra Hospital documents (as reported by Newslaundry)", source: s4 }
      - { what: "people injured at the Data Singh-Khanauri border on 21 February (afternoon)", value: "two police personnel and one protester", claimed_by: Haryana Police, source: s18 }
      - { what: "police and paramilitary personnel injured in the agitation", value: "67", claimed_by: "submission to the High Court bench (as reported by The Tribune)", source: s21 }
  - type: commission_of_inquiry
    date: 2024-03-07
    claim: held
    description: "A Punjab and Haryana High Court bench of Acting Chief Justice G.S. Sandhawalia and Justice Lapita Banerji constituted a committee headed by retired High Court judge Jaishree Thakur, assisted by ADGPs Parmod Ban (Punjab) and Amitabh Singh Dhillon (Haryana), to inquire into the death of Shubhkaran Singh. The Tribune reported that the bench said the investigation could not be entrusted solely to either state, and asked the committee to report on which police had jurisdiction, the cause of death, the weapon used and whether the force used was commensurate. Haryana challenged the judgment in the Supreme Court through a Special Leave Petition (SLP(C) Nos. 6950-6953/2024)."
    actor: court
    sources: [s24, s22, s21, s6]
  - type: other
    date: 2024-07-10
    claim: held
    description: "A Punjab and Haryana High Court bench of Justices G.S. Sandhawalia and Vikas Bahl directed Punjab and Haryana to open the barricades at Shambhu within a week, to maintain law and order, and directed Punjab to remove obstructions on the highway. LiveLaw reported that the order called the border a 'lifeline'. Haryana appealed to the Supreme Court. On 24 July the Supreme Court directed that status quo be maintained at the Shambhu border until the next hearing, and asked both states to submit proposals to remove the barricades in a phased manner. In oral remarks reported by LiveLaw, Justice Surya Kant told Haryana there was a 'trust deficit' with the farmers."
    actor: court
    sources: [s24, s23, s6, s7]
  - type: negotiation
    date: 2024-09-02
    claim: held
    description: "The Supreme Court (Justices Surya Kant and Ujjal Bhuyan) constituted a High-Powered Committee chaired by retired High Court judge Nawab Singh to reach out to the protesting farmers, and asked it to persuade them to move their tractors, trolleys and tents off the national highway. The order cautioned the farmers to keep a safe distance from political parties and political issues. It recorded that both states had earmarked alternative sites for the protest."
    actor: court
    sources: [s24, s8]
  - type: other
    date: 2025-03-19
    claim: happened
    description: "Punjab Police detained farmer leaders including Jagjit Singh Dallewal and Sarwan Singh Pandher in Mohali as they returned from the seventh round of talks with a Union delegation in Chandigarh, and cleared the Shambhu and Khanauri protest sites in a late-evening operation, removing tents, stages and trolleys. The Indian Express reported that the Patiala Range DIG told protesters that police did not want to use force and asked them to board buses voluntarily. Punjab Finance Minister Harpal Singh Cheema said the closure of the highways had hit trade and industry. On 28 March the Punjab government told the Supreme Court that it had cleared the protesters and reopened the national highway, and that Dallewal, on hunger strike since November 2024, had ended his fast. LiveLaw reported that a contempt petition alleging violation of the status quo order was withdrawn after the bench called it misconceived; the Court's signed order says the contempt proceedings against Punjab's Chief Secretary and DGP were dropped at this stage in light of subsequent events. Counts of detained farmers and police differ (see figures)."
    actor: state
    sources: [s26, s5, s25, s27, s32]
    figures:
      - { what: "farmers detained", value: "more than 300", claimed_by: "The Tribune, citing sources", source: s27 }
      - { what: "farmers present when the operation began", value: "nearly 500", claimed_by: The Indian Express, source: s26 }
      - { what: "police personnel at the two sites", value: "over 3,000", claimed_by: "DIG Mandeep Singh Sidhu (quoted by The Indian Express)", source: s26 }
      - { what: "police personnel stationed at the Shambhu and Khanauri border points", value: "over 5,000", claimed_by: "The Tribune (live blog)", source: s27 }
outcome: >
  No law guaranteeing MSP was enacted. In January 2025 the Union government agreed to resume talks
  with the farm leaders, which began in Chandigarh in February 2025. The Punjab government (AAP)
  cleared the Shambhu and Khanauri sites in March 2025 and the highway reopened. A Supreme
  Court-appointed committee continued to engage with the farmers.
positions:
  - party: BJP
    person: Manohar Lal Khattar
    role_at_time: Chief Minister of Haryana
    in_power: true
    date: 2024-02-15
    kind: paraphrase
    statement: "Asked about farmer leader Jagjit Singh Dallewal's remark about bringing down Prime Minister Modi's popularity, called it a political statement and said a message was circulating among the public that this was not the right way to protest. He also said the Punjab government could have stopped the farmers but did not. Alt News, a fact-checker, reported that the widely shared clip of Dallewal's remark had been edited to remove context."
    sources: [s28, s11, s31]
  - party: INC
    person: Rahul Gandhi
    role_at_time: Lok Sabha MP (INC); INC was the main opposition party
    in_power: false
    date: 2024-02-13
    kind: paraphrase
    statement: Said on X that the Congress had decided to give every farmer a legal guarantee of MSP on crops as recommended by the Swaminathan Commission, and called it the party's first guarantee. Al Jazeera reported this as a promise to legalise MSP if the Congress was elected.
    sources: [s29, s3]
  - party: AAP
    person:
    role_at_time: Governing party in Punjab (opposition at the Centre), speaking as the Punjab government
    in_power: true
    date: 2024-02
    kind: paraphrase
    statement: The Punjab government said three farmers had lost their eyesight after being hit by Haryana Police pellets and that about a dozen others had pellet injuries (as reported by Al Jazeera). The Mooknayak attributed the claim about three farmers to Punjab Health Minister Balbir Singh.
    sources: [s3, s30]
