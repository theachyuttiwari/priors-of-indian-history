  - party: INC
    person: Rahul Gandhi
    role_at_time: Congress vice-president, opposition
    in_power: false
    date: 2016-02-12
    kind: verbatim
    statement: "Said on Twitter that anti-India sentiment was unacceptable but that dissent and debate were essential to democracy, and condemned the Modi government and the ABVP for bullying JNU."
    quote:
      text: "Modi Govt & ABVP bullying an institution like JNU simply because it won't toe their line is completely condemnable"
      locator: "Second of two tweets of 12 February 2016 (2/2)"
      source: s15
    sources: [s14, s15, s3, s8]
  - party: INC
    person: Abhishek Manu Singhvi
    role_at_time: Congress spokesperson, opposition
    in_power: false
    date: 2016-02-12
    kind: paraphrase
    statement: "Accused the government of intolerance of dissent in Hyderabad, Delhi and JNU, and said each time it happened at the instance of the ABVP or what he called parivar elements."
    sources: [s3]
  - party: AAP
    person: Arvind Kejriwal
    role_at_time: Chief Minister of Delhi (in power in Delhi, opposition to the BJP at the centre)
    in_power: true
    date: 2016-02-12
    kind: verbatim
    statement: "Said on Twitter that no one supports anti-national forces, but that targeting innocent students on that excuse would prove very costly to the Modi government."
    quote:
      text: "No one supports anti-national forces. But targetting innocent students using that as an excuse will prove v costly to Modi govt"
      locator: "Tweet of 12 February 2016"
      source: s16
    sources: [s16, s8]
  - party: CPI(M)
    person: CPI(M) Polit Bureau
    role_at_time: Party statement, opposition
    in_power: false
    date: 2016-02-12
    kind: verbatim
    statement: "Condemned the arrests of student leaders from the JNU campus and police raids on hostels, compared them to the Emergency, and demanded the release of those arrested and an independent enquiry."
    quote:
      text: "The presence of police in the campus and such indiscriminate arrests from hostels had last happened during the Emergency."
      locator: "Second paragraph of the statement"
      source: s19
    sources: [s19, s8]
  - party: CPI(M)
    person: CPI(M) Polit Bureau
    role_at_time: Party statement, opposition
    in_power: false
    date: 2016-02-15
    kind: verbatim
    statement: "Condemned the violence at Patiala House Courts, blamed lawyers and others it said owed allegiance to the BJP, criticised the inaction of the Delhi Police, and demanded the arrest of those responsible and Kumar's release."
    quote:
      text: "The CPI(M) condemns the inaction of the Delhi Police which was stationed there in sizeable strength."
      locator: "Second paragraph of the statement"
      source: s20
    sources: [s20]
