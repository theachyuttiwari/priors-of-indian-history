    sources: [s13, s8]
  - party: BJP
    person: Kiren Rijiju
    role_at_time: Union Minister of State for Home Affairs
    in_power: true
    date: 2016-02-12
    kind: paraphrase
    statement: "Said slogans against the nation were not acceptable at JNU or any other university, that the government considered it a serious offence, and that stern action would be taken against all those involved."
