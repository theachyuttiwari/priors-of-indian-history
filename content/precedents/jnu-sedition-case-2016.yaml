id: jnu-sedition-case-2016
title: JNU sedition case, February 2016
summary: >
  On 9 February 2016 students at Jawaharlal Nehru University held an event on the hanging
  of Afzal Guru at which slogans were allegedly raised. Delhi Police registered a sedition
  FIR on 11 February and arrested JNU Students' Union president Kanhaiya Kumar on 12 February.
  After lawyers sent by the Supreme Court reported that he was manhandled at Patiala House court,
  the Court made the Delhi Police Commissioner responsible for his safety, and the Delhi High Court granted him interim bail on 2 March.
  Delhi Police filed a chargesheet in January 2019, the Delhi government granted prosecution
  sanction in February 2020, and a magistrate took cognizance in February 2021.
period:
  start: 2016-02-09
  end: 2021-02-15
