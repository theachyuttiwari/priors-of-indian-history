id: telangana-agitation-2009-2011
title: Telangana statehood agitation (2009 to 2011)
summary: >
  K. Chandrashekar Rao (KCR), president of the Telangana Rashtra Samithi (now BRS),
  was arrested on 29 November 2009 on his way to begin a fast-unto-death for a separate
  Telangana state, and began the fast in custody. Student protests at Osmania University and a region-wide
  agitation followed. The Centre announced on 9 December 2009 that it would initiate
  the process of forming Telangana, then on 23 December 2009 called for wider
  consultations after resignations by legislators from coastal Andhra and Rayalaseema.
  The agitation continued through the Srikrishna Committee (2010), the Million March
  at Tank Bund (10 March 2011) and the 42-day Sakala Janula Samme general strike
  (13 September to 24 October 2011).
period:
  start: 2009-11-29
  end: 2011-10-24
location:
  states: [Andhra Pradesh]
  places: [Hyderabad, Osmania University, Khammam, Siddipet, Tank Bund, Karimnagar, Warangal, Nizamabad, Adilabad]
protest:
  cause: Creation of a separate Telangana state out of Andhra Pradesh
  organisers: [Telangana Rashtra Samithi (TRS, now BRS), Telangana Joint Action Committee (M. Kodandaram), Osmania University Students JAC, government employees' unions]
  scale: "Region-wide agitation across the 10 Telangana districts; about 400,000 government employees, teachers and workers and over 100,000 Singareni coal workers joined the 2011 general strike"
government:
  centre:
    party: INC
    alliance: UPA
    head: Manmohan Singh
    role: Prime Minister
    note: "Home Minister P. Chidambaram (INC) issued the 9 December and 23 December 2009 statements and set up the Srikrishna Committee"
  state:
    party: INC
    head: K. Rosaiah
    role: Chief Minister
    name: Andhra Pradesh
    note: "K. Rosaiah was Chief Minister from September 2009 to November 2010; N. Kiran Kumar Reddy (INC) was Chief Minister from November 2010, including during the Million March and the Sakala Janula Samme"
actions:
  - type: preventive_arrest
    date: 2009-11-29
    claim: happened
    description: "Police arrested KCR near Karimnagar on 29 November, before he reached Siddipet to begin his fast, together with other TRS leaders. The Indian Express reported the charges as spreading disaffection, criminal conspiracy and inciting people to violence. A magistrate in Khammam remanded him to 14 days of judicial custody, and he began the fast in custody. On 30 November he accepted fruit juice at the government hospital in Khammam, as shown in footage released by the authorities; the TRS called this a government conspiracy, and on 1 December KCR said he was continuing the fast. The Srikrishna Committee report says he 'reportedly broke his fast but resumed it soon thereafter'."
    actor: police
    sources: [s1, s19, s27]
    legal_basis: "Charges of spreading disaffection, criminal conspiracy and inciting people to violence, as reported by The Indian Express (sections not named)"
  - type: other
    date: 2009-12-03
    claim: happened
    description: "Police shifted KCR late on the night of 2 December from Khammam to the Nizam's Institute of Medical Sciences (NIMS) in Hyderabad after his condition deteriorated, following repeated TRS requests and directions from the State Human Rights Commission. He was in judicial custody until 12 December. A 2023 Deccan Chronicle retrospective dates the shift to the morning of 4 December."
    actor: state
    sources: [s2, s16]
  - type: detention
    date: 2009-11-29
    claim: happened
    description: "On 29 November police caned groups of slogan-shouting hostel students at Osmania University and at Kakatiya University in Warangal; the Hyderabad Police Commissioner said that a student who died on the Osmania campus that day died of fits and not because of the caning. On 7 December, after students threw stones at Rapid Action Force personnel and police around the Osmania campus, police baton-charged them. Before the planned 10 December march to the Assembly, police evicted students from 12 hostels after the university ordered the rooms vacated; The Indian Express reported that the High Court set aside the government order closing universities and colleges in Hyderabad and nine other Telangana districts and directed that hostels be reopened. A 2023 Deccan Chronicle retrospective, based partly on a student leader's account, adds that central forces stopped an Osmania University students' JAC rally on 29 November, that police picked up student leaders from hostel rooms, that police removed the tents of a relay hunger strike begun on 24 December in a midnight operation about eight days later, and that on 14 February 2010 police fired tear gas shells into B-Hostel rooms."
    actor: police
    sources: [s19, s21, s18, s17]
  - type: preventive_arrest
    date: 2009-12-09
    claim: happened
    description: "Ahead of a 'march to Hyderabad' to the Assembly called by the students' JAC and the TRS for 10 December, additional police forces were deployed in the capital, and police and paramilitary forces took hundreds of students and activists into preventive custody. The Srikrishna Committee report states that during the agitation that began on 29 November 'reportedly over five thousand persons were taken into preventive custody'."
    actor: police
    sources: [s3, s18, s27]
    figures:
      - { what: "persons taken into preventive custody during the agitation from 29 November 2009", value: "over 5,000", claimed_by: "Srikrishna Committee report ('reportedly')", source: s27 }
  - type: concession
    date: 2009-12-09
    claim: ordered
    description: "Home Minister P. Chidambaram announced in New Delhi at about 11.30 pm that 'the process of forming the state of Telangana will be initiated' and that an appropriate resolution would be moved in the state Assembly. The statement asked KCR to end his fast and students to withdraw their agitation, and the Centre asked Chief Minister Rosaiah to withdraw cases filed against students, leaders and others on or after 29 November. KCR broke his fast at NIMS shortly after midnight. The Srikrishna Committee later reported that over 1,600 cases involving more than 8,000 agitators were registered in the state between 29 November 2009 and April 2010, and that the state government withdrew 565 'simple' cases, 440 of them in Telangana."
    actor: centre
    sources: [s3, s18, s30, s27, s28]
    figures:
      - { what: "cases registered against agitators in all regions, 29 November 2009 to April 2010", value: "over 1,600", claimed_by: Srikrishna Committee report, source: s27 }
      - { what: "agitators involved in those cases", value: "more than 8,000", claimed_by: Srikrishna Committee report, source: s27 }
      - { what: "'simple' cases withdrawn by the state government (all regions)", value: "565", claimed_by: Srikrishna Committee report, source: s27 }
      - { what: "'simple' cases withdrawn in Telangana", value: "440", claimed_by: Srikrishna Committee report, source: s27 }
  - type: other
    date: 2009-12-23
    claim: ordered
    description: "After the 9 December statement, legislators from coastal Andhra and Rayalaseema submitted resignations in protest (counts differ, see figures). On 23 December Chidambaram issued a second statement saying that the situation in Andhra Pradesh had altered since 9 December and that the Centre would hold wide-ranging consultations with all political parties and groups in the state and take steps to involve all concerned. Chidambaram later denied a flip-flop and said the two statements had to be read together."
    actor: centre
    sources: [s4, s20, s5, s34, s27, s28, s7, s26, s15]
    figures:
      - { what: "MLAs who submitted resignations by 10 December 2009", value: "100", claimed_by: "The Tribune (Suresh Dharur)", source: s4 }
      - { what: "MLAs who submitted resignations by late night of 10 December 2009", value: "117 (76 Congress, 29 TDP, 12 PRP)", claimed_by: "The Indian Express (Sreenivas Janyala)", source: s20 }
      - { what: "resignations submitted against the 9 December announcement", value: "9 MPs, 143 MLAs and 41 MLCs", claimed_by: "Srikrishna Committee report ('reportedly')", source: s27 }
  - type: lathi_charge
    date: 2009-12-24
    claim: happened
    description: "After the 23 December statement, students at Osmania University clashed with police and threw stones; police baton-charged them. IANS reported that police fired rubber bullets at Osmania University, injuring one student, and caned Nizam College students in Basheerbagh who threw stones when stopped from marching to the Assembly. Protesters burned buses and stopped trains across Telangana. Ten CRPF companies were flown in from Delhi, bringing central forces in the state to 38 companies, about 4,000 personnel."
    actor: police
    sources: [s6, s33, s37]
    figures:
      - { what: "buses damaged by protesters on 24 December", value: "57", claimed_by: "IGP A.R. Anuradha (quoted in The Tribune)", source: s6 }
      - { what: "trains stopped on 24 December", value: "11", claimed_by: "IGP A.R. Anuradha (quoted in The Tribune)", source: s6 }
      - { what: "buses damaged in Telangana on a single day after the 23 December statement", value: "268", claimed_by: "government and police sources (agency report in The Indian Express)", source: s37 }
      - { what: "students injured by rubber bullets at Osmania University", value: "1", claimed_by: IANS, source: s33 }
      - { what: "Nizam College students injured in the cane charge", value: "4", claimed_by: IANS, source: s33 }
      - { what: "central forces in the state", value: "38 companies, about 4,000 personnel", claimed_by: The Tribune, source: s6 }
  - type: negotiation
    date: 2010-01-05
    claim: happened
    description: "Chidambaram convened a meeting in New Delhi of the eight recognised political parties of Andhra Pradesh as 'the first step in the consultations' to devise a mechanism and roadmap; Chief Minister Rosaiah was invited in his official capacity. The Srikrishna Committee report states that the TRS, BJP and CPI said no further consultations were needed, that the Congress, CPI(M), AIMIM and PRP favoured wide-ranging consultations, that the TDP's two representatives took divergent positions, and that all the parties appealed to the people to keep the peace."
    actor: centre
    sources: [s7, s26, s27, s28]
  - type: commission_of_inquiry
    date: 2010-02-03
    claim: ordered
    description: "The Centre constituted a five-member Committee for Consultations on the Situation in Andhra Pradesh headed by Justice B.N. Srikrishna, with Ranbir Singh, Abusaleh Shariff, Ravinder Kaur and Vinod K. Duggal. It submitted its report on 30 December 2010. The Home Ministry released it on 6 January 2011 with six options; the committee held that simply maintaining the status quo was not a practical approach and treated a united state with a statutory Telangana Regional Council as the first choice and bifurcation as the 'second best option'. TRS, TDP and BJP boycotted the 6 January meeting at which the report was handed to the parties."
    actor: centre
    sources: [s27, s28, s29, s8, s9, s10]
  - type: permission_denied
    date: 2011-03-10
    claim: ordered
    description: "Hyderabad Police Commissioner A.K. Khan refused permission for the Telangana JAC's 'Million March' at Tank Bund. The Indian Express reported his reason as the march throwing traffic out of gear; PTI reported that police cited disruption to normal life and possible law and order problems."
    actor: police
    sources: [s11, s22, s23]
  - type: section_144
    date: 2011-03-10
    claim: ordered
    description: "Prohibitory orders under Section 144 CrPC banning assemblies, rallies and processions were in force in the Hyderabad and Cyberabad police commissionerate limits. Routes to Tank Bund were barricaded with barbed wire, and state police and central paramilitary forces were deployed."
    actor: police
    sources: [s11, s23, s35]
    legal_basis: Section 144 CrPC
  - type: detention
    date: 2011-03-10
    claim: happened
    description: "Police detained JAC convener M. Kodandaram as he left the JAC office, TRS MLA T. Harish Rao, TDP MLA E. Dayakar Rao and BJP leader Ch. Vidyasagar Rao, and made preventive arrests in Telangana districts to stop activists reaching Hyderabad. Kodandaram said hundreds were arrested across Telangana; Police Commissioner A.K. Khan said preventive arrests were made only against those violating the ban orders. Thousands still reached Tank Bund."
    actor: police
    sources: [s11, s12, s23, s35]
    figures:
      - { what: "people arrested across Telangana", value: "hundreds", claimed_by: "M. Kodandaram, Telangana JAC (to PTI)", source: s11 }
      - { what: "Telangana supporters detained in the two days before the march", value: "hundreds", claimed_by: PTI, source: s35 }
      - { what: "people gathered on the Tank Bund road", value: "about 20,000", claimed_by: PTI, source: s35 }
  - type: tear_gas
    date: 2011-03-10
    claim: happened
    description: "Police lobbed tear gas shells at Tank Bund. A release from the Director General of Police's office said that after the main JAC leaders left at about 5 pm, a group of about 1,000 people from the Indian Federation of Trade Unions surged towards police and threw stones, and police dispersed them with tear gas. Police also fired tear gas at Osmania University students who threw stones after being stopped from marching to Tank Bund. During the march, protesters attacked two Congress MPs and journalists, set some police vehicles on fire and damaged statues of Telugu cultural figures on Tank Bund."
    actor: police
    sources: [s12, s23, s35]
    figures:
      - { what: "people in the group dispersed with tear gas after 5 pm", value: "about 1,000", claimed_by: "DGP's office (release quoted by PTI)", source: s35 }
  - type: other
    date: 2011-09-12
    claim: happened
    description: "On the eve of the Sakala Janula Samme, the state government said it would not hesitate to invoke the Essential Services Maintenance Act (ESMA) against strikers, would implement a 'no work, no pay' rule and would take disciplinary action. Reports differ on whether ESMA was applied: a PTI report at the end of the strike said the government threatened ESMA but did not enforce it, while an agency report carried by The Indian Express on 12 October said the employees' JAC demanded withdrawal of ESMA 'enforced in certain departments'. The 'no work, no pay' rule was Government Order No. 177, which the 12 October report said was being implemented on the orders of the High Court."
    actor: state
    sources: [s13, s24, s14, s36]
    legal_basis: "Essential Services Maintenance Act (threatened); Government Order No. 177 ('no work, no pay')"
  - type: detention
    date: 2011-09-13
    claim: happened
    description: "On the first day of the general strike, police arrested Telugu Desam Party leaders from Telangana who tried to lay siege to the state secretariat."
    actor: police
    sources: [s13]
  - type: negotiation
    date: 2011-10-24
    claim: happened
    description: "After talks led by Deputy Chief Minister Damodar Rajanarasimha, the government accepted nine demands, including withdrawal of cases against striking employees, treating the strike period as special leave, and seeking High Court permission to relax GO 177. Employees called off the strike on 24 October 2011 after 42 days; teachers, APSRTC and Singareni workers had withdrawn earlier. A Coal Ministry reply in the Lok Sabha records the Singareni strike in support of the Telangana bandh call as running from 13 September to the third shift of 17 October 2011."
    actor: state
    sources: [s14, s25, s31]
  - type: concession
    date: 2014-03-01
    claim: ordered
    description: "After the agitation period, the Union Cabinet cleared a separate Telangana on 3 October 2013; the Andhra Pradesh Reorganisation Bill passed the Lok Sabha on 18 February 2014 and the Rajya Sabha on 20 February 2014, received presidential assent on 1 March 2014, and Telangana was formed on 2 June 2014."
    actor: centre
    sources: [s32, s16]
outcome: >
  The 2011 strike ended on 24 October 2011 with the state accepting nine employee demands;
  the statehood demand itself stayed open. The UPA coordination committee decided in favour
  of Telangana on 30 July 2013, the Andhra Pradesh Reorganisation Bill passed Parliament in
  February 2014 and received assent on 1 March 2014, and Telangana was formed on 2 June 2014.
positions:
  - party: INC
    person: P. Chidambaram
    role_at_time: Union Home Minister
    in_power: true
    date: 2009-12-09
    kind: verbatim
    statement: "Announced that the Centre would initiate the process of forming the state of Telangana and that an appropriate resolution would be moved in the state Assembly, asked KCR to end his fast and asked students to withdraw their agitation."
    quote:
      text: "The process of forming the state of Telangana will be initiated. An appropriate resolution will be moved in the Assembly."
      locator: "Paragraph beginning 'Said Home Minister P Chidambaram late in the night'"
      source: s18
    sources: [s18, s3, s30, s28]
  - party: INC
    person: P. Chidambaram
    role_at_time: Union Home Minister
    in_power: true
    date: 2009-12-23
    kind: paraphrase
    statement: "Said the 9 December announcement had rested on the consensus among Andhra Pradesh parties at the 7 December all-party meeting, but that the situation in the state had since altered and parties were divided. The Centre would hold wide-ranging consultations with all political parties and groups and involve all concerned. Appealed to parties and students to withdraw their agitations."
    sources: [s5, s34, s28]
  - party: INC
    person: P. Chidambaram
    role_at_time: Union Home Minister
    in_power: true
    date: 2009-12-31
    kind: verbatim
    statement: "Denied that the Centre had made a flip-flop. Said the 5 January meeting was the first step in the consultations, meant to devise a mechanism and a roadmap, and that the 23 December statement responded to divisions within the political parties after 9 December."
    quote:
      text: "The government was simply responding to the altered situation as a result of divisions in the political parties"
      locator: "Paragraph 3"
      source: s26
    sources: [s7, s26]
  - party: INC
    person: P. Chidambaram
    role_at_time: Union Home Minister
    in_power: true
    date: 2011-07-04
    kind: paraphrase
    statement: "Said the 9 December 2009 statement was made on behalf of the Government of India, not by an individual, that it had to be read together with the 23 December 2009 statement, and that the Centre had not yet taken a final decision on Telangana."
    sources: [s15]
  - party: INC
    person: P. Chidambaram
    role_at_time: Union Home Minister
    in_power: true
    date: 2011-08-05
    kind: verbatim
    statement: "Replying to a calling-attention motion in the Lok Sabha, said the 9 December 2009 announcement was made by the Government through him on the basis of the minutes of the 7 December all-party meeting. After the ruling party and the main opposition party in Andhra Pradesh divided, the Government took note of the altered situation and made the 23 December statement."
    quote:
      text: "But shortly after that statement was made on December 9, the situation at the ground altered. That is an undeniable fact."
      locator: "Lok Sabha debates, 5 August 2011, calling attention, reply of the Home Minister (PDF p. 8)"
      source: s29
    sources: [s29]
  - party: INC
    person: K. Rosaiah
    role_at_time: Chief Minister of Andhra Pradesh
    in_power: true
    date: 2009-12-10
    kind: paraphrase
    statement: "Said the Telangana resolution would be moved in the Assembly only after consulting everyone and would pass only with majority support, and advised legislators not to resign in the heat of emotion."
    sources: [s4, s20]
  - party: BRS
    person: K. Chandrashekar Rao
    role_at_time: President, Telangana Rashtra Samithi (TRS, renamed BRS in 2022); Lok Sabha MP, opposition
    in_power: false
    date: 2009-12-24
    kind: paraphrase
    statement: "KCR rejected suggestions that the UPA might set up a States Reorganisation Commission, said no amount of central paramilitary forces could keep Andhra Pradesh intact, and urged the Prime Minister to begin the constitutional process to bifurcate the state without delay."
    sources: [s6]
  - party: BRS
    person: K. Chandrashekar Rao
    role_at_time: President, Telangana Rashtra Samithi (TRS, renamed BRS in 2022); opposition
    in_power: false
    date: 2011-09-12
    kind: verbatim
    statement: "At a public meeting in Karimnagar, warned the government against invoking ESMA against strikers and said the agitation would continue until the Centre fulfilled its 9 December 2009 promise."
    quote:
      text: "Telangana will burn if the government dares to use ESMA against any employee, teacher or worker"
      locator: "Paragraph on the Karimnagar public meeting, near the end of the report"
      source: s13
    sources: [s13]
  - party: TDP
    person: N. Chandrababu Naidu
    role_at_time: TDP president; Leader of the Opposition, Andhra Pradesh Assembly
    in_power: false
    date: 2009-12-10
    kind: paraphrase
    statement: "Naidu, who had earlier challenged the Congress to table the resolution and pledged TDP support, called the Centre's decision hasty, unilateral and arbitrary, said no one had been consulted, and held the Congress responsible for the crisis. He said the TDP would support a separate Telangana provided there was consensus."
    sources: [s4, s20]
  - party: BJP
    person: M. Venkaiah Naidu
    role_at_time: BJP leader; Rajya Sabha MP, opposition
    in_power: false
    date: 2009-12-10
    kind: verbatim
    statement: "In the Rajya Sabha, objected that the Home Minister had announced the Telangana decision outside Parliament while it was in session, and asked the Government to assure the House that the announcement was its policy. The BJP accused the Government of undermining the dignity of Parliament."
    quote:
      text: "A policy statement should not be made outside."
      locator: "Rajya Sabha debates, 10 December 2009, 'Re: Telangana issue', p. 2"
      source: s30
    sources: [s30, s4]
  - party: BJP
    person: Bandaru Dattatreya
    role_at_time: BJP leader, Telangana; former Union minister
    in_power: false
    date: 2011-09-13
    kind: verbatim
    statement: "At a BJP rally on the first day of the general strike, said the strike would grow into a larger battle that would force the Chief Minister out of the secretariat."
    quote:
      text: "The indefinite strike in coming days will turn into a mega battle and a stage will come where Chief Minister Kiran Kumar Reddy will have to leave the state secretariat"
      locator: "Paragraph on the BJP rally to the martyrs' memorial at Gun Park"
      source: s13
    sources: [s13]
  - party: other (Telangana Joint Action Committee)
    person: M. Kodandaram
    role_at_time: Convener, Telangana Joint Action Committee
    in_power: false
    date: 2011-03-10
    kind: verbatim
    statement: "Said police were acting undemocratically and had arrested hundreds of people across Telangana, and alleged that plain-clothes police were arresting people."
    quote:
      text: "Police have been behaving in a very undemocratic way."
      locator: "Paragraph after the report of his detention"
      source: s11
    sources: [s11, s12]
  - party: other (Telangana Joint Action Committee)
    person: M. Kodandaram
    role_at_time: Convener, Telangana Joint Action Committee
    in_power: false
    date: 2011-10-24
    kind: paraphrase
    statement: "Said the employees had called off their strike temporarily, and thanked them for their support to the Telangana cause."
    sources: [s14]
