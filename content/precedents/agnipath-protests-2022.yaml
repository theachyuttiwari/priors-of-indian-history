id: agnipath-protests-2022
title: Protests against the Agnipath military recruitment scheme, June 2022
summary: >
  The Union government announced the Agnipath scheme on 14 June 2022. It recruits people
  aged 17.5 to 21 into the armed forces for four-year terms, with about a quarter retained.
  Job aspirants protested from 15-16 June in Bihar, Uttar Pradesh, Haryana, Rajasthan,
  Madhya Pradesh, Telangana and other states. Protesters set train coaches on fire, attacked
  BJP offices and blocked rail lines. The East Central Railway said more than 60 coaches were
  burnt in Bihar. Estimates of railway losses differ: India Today, citing the East Central
  Railway, put losses in Bihar at about Rs 700 crore, and the Railway Minister told the Rajya
  Sabha in July 2022 that damage to railway assets in the agitation came to Rs 259.44 crore.
  The Centre raised the 2022 age limit to 23 and announced 10% reservations for Agniveers in
  the Central Armed Police Forces, the Assam Rifles and Defence Ministry posts, but did not
  withdraw the scheme.
period:
  start: 2022-06-15
  end: 2022-06-20
location:
  states: [Bihar, Uttar Pradesh, Haryana, Telangana, Rajasthan, Madhya Pradesh, Delhi]
  places: [Bhabua, Chhapra, Nawada, Samastipur, Lakhisarai, Ballia, Palwal, Faridabad, Secunderabad, Gwalior]
protest:
  cause: Withdrawal of the Agnipath four-year recruitment scheme and a return to regular recruitment with pension
  organisers: [Largely unorganised job aspirants; a Bharat Bandh on 20 June was called on social media without a named organiser]
  scale: Protests in about 13 states; about 60 train coaches burnt in Bihar; hundreds of trains cancelled; one dead in Secunderabad
government:
  centre:
    party: BJP
    alliance: NDA
    head: Narendra Modi
    role: Prime Minister
  state:
    party: JD(U)
    head: Nitish Kumar
    role: Chief Minister
    name: Bihar
actions:
  - type: tear_gas
    date: 2022-06-16
    claim: happened
    description: "Police in Bihar fired tear gas shells and baton-charged protesters at several places, on a day when protesters set train coaches on fire at Bhabua, Chhapra and other stations and a BJP office was set on fire in Nawada. Hindustan Times reported tear gas at Ara and Bhabua and baton charges in Begusarai, Nawada, Jehanabad and other districts; at Chhapra, an RPF inspector said the RPF fired eight rounds in the air to disperse the crowd."
    actor: police
    sources: [s1, s16, s17]
  - type: firing
    date: 2022-06-16
    claim: happened
    description: "In Palwal, Haryana, protesters attacked the Deputy Commissioner's office and residence, threw stones and set police vehicles on fire. Hindustan Times and The Tribune reported that police fired in the air to disperse them; Palwal SP Mukesh Malhotra, quoted by The Tribune, described the police response as a cane charge and tear gas. Police said two SHOs and 15 other policemen were seriously injured."
    actor: police
    sources: [s1, s2, s18, s33]
    figures:
      - { what: "police personnel seriously injured in Palwal", value: "two SHOs and 15 other policemen", claimed_by: "Palwal SP Mukesh Malhotra (quoted by The Tribune)", source: s33 }
  - type: concession
    date: 2022-06-16
    claim: ordered
    description: "The Union government gave a one-time waiver that raised the upper age limit for Agnipath recruitment in 2022 from 21 to 23. The Defence Ministry release said this was because it had not been possible to undertake recruitment during the last two years."
    actor: centre
    sources: [s11, s2, s41]
  - type: internet_shutdown
    date: 2022-06-17
    claim: ordered
    description: "The Haryana government suspended mobile internet, SMS and dongle services in Palwal district for 24 hours from 16 June, and on 17 June for 24 hours in Mahendragarh district and the Ballabhgarh area of Faridabad, saying it wanted to stop the spread of disinformation and rumours. The Bihar Home Department suspended internet services in 12 districts from 17 June until 19 June. Reports differ on the later extent in Bihar: a Police Headquarters statement on 19 June said 17 of 38 districts remained under suspension, while Hindustan Times and The Times of India reported 20 districts. Services were restored on 21 June."
    actor: state
    sources: [s3, s5, s18, s24, s25, s27, s33, s34, s39, s40]
    legal_basis: "Haryana (Palwal): Section 5 of the Indian Telegraph Act, 1885, read with Rule 2 of the Temporary Suspension of Telecom Services (Public Emergency or Public Safety) Rules, 2017, as quoted from the order by The Indian Express. Bihar: Home Department order No. C/C.I.Misc-4013/2017-01 of 17 June 2022, as cited by SFLC.in (law not named in the sources opened)"
    figures:
      - { what: "Bihar districts with internet suspended from 17 June", value: "12 of 38", claimed_by: "ADG (Law and Order) Sanjay Singh (to PTI); Bihar government order (reported by ThePrint)", source: s24 }
      - { what: "Bihar districts with internet still suspended on 19 June", value: "17 of 38", claimed_by: "Bihar Police Headquarters statement (PTI)", source: s34 }
      - { what: "Bihar districts with mobile internet suspended", value: "20", claimed_by: "Hindustan Times (Subhash Pathak)", source: s27 }
  - type: firing
    date: 2022-06-17
    claim: happened
    description: "Police opened fire on protesters at Secunderabad railway station in Telangana after protesters vandalised the station and set train coaches on fire. One person, Damera (Damira) Rakesh from Warangal district, died; Gandhi Hospital's superintendent said 13 people were brought to the hospital. Reports differ on which force fired: The Indian Express reported that Telangana police allegedly opened fire, while The Hindu reported that the station manager's complaint, on which the Secunderabad Railway Police registered a case, said police opened fire on the legs in self-defence to stop protesters setting fire to locomotives. Reports give Rakesh's age as 24 (The Indian Express) and 18 (The News Minute)."
    actor: police
    sources: [s3, s4, s20, s21, s22, s23]
    figures:
      - { what: "people killed", value: "1", claimed_by: "Gandhi Hospital superintendent Raja Rao (quoted by The Indian Express)", source: s20 }
      - { what: "people brought to Gandhi Hospital, including the dead man", value: "13", claimed_by: "Gandhi Hospital superintendent Raja Rao (quoted by ANI, via Scroll)", source: s3 }
      - { what: "rounds fired by police", value: "at least 10", claimed_by: "The Indian Express ('reportedly')", source: s20 }
      - { what: "rounds fired by police", value: "at least 15", claimed_by: "The Hindu ('preliminary reports')", source: s21 }
  - type: section_144
    date: 2022-06-17
    claim: ordered
    description: "Prohibitory orders under Section 144 CrPC were imposed in Palwal on 16 June and in Faridabad. On 17 June, Gurugram District Magistrate Nishant Kumar Yadav issued an order prohibiting the free movement of persons and gatherings of more than four people in Gurugram district, in force until further orders. On 20 June, the day of a Bharat Bandh call, police in several areas imposed Section 144, and prohibitory orders were reported in some districts of Bihar, Jharkhand, Uttar Pradesh, Kerala, Assam and Rajasthan."
    actor: state
    sources: [s3, s6, s5, s19, s43, s33]
    legal_basis: Section 144 CrPC
  - type: fir
    date: 2022-06-18
    claim: ordered
    description: "Police in Bihar, Uttar Pradesh, Haryana and Telangana registered cases and made arrests. Bihar figures given by police and officials rose from 24 FIRs on 17 June to between 145 and 159 FIRs by 19-20 June, and arrests from more than 125 to between 804 and 879; one figure from the ADG (Law and Order), 600 cases, differs from the others (see figures). In Uttar Pradesh, police said on 18 June that 340 people had been arrested and 29 cases lodged in 12 districts. In Palwal, Haryana, police booked over 1,000 people in three FIRs and arrested 23. In Secunderabad, the Railway Police registered a case on the station manager's complaint under rioting, attempt to murder and other IPC sections, the Prevention of Damage to Public Property Act and the Railways Act."
    actor: police
    sources: [s3, s7, s8, s24, s26, s27, s28, s31, s32, s34, s23]
    legal_basis: "Secunderabad: IPC sections 143, 147, 324, 307, 435, 427, 448, 336, 332 and 341 read with 149, the Prevention of Damage to Public Property Act and the Railways Act (as reported by The Hindu)"
    figures:
      - { what: "Bihar FIRs and people detained, by 17 June", value: "24 FIRs; more than 125 detained", claimed_by: "ADG (Law and Order) Sanjay Singh (to ANI)", source: s3 }
      - { what: "Bihar arrests and FIRs, by 18 June", value: "about 620 arrested; 130 FIRs", claimed_by: "ADG (Law and Order) Sanjay Singh (to ANI)", source: s7 }
      - { what: "Bihar arrests and FIRs, by 18 June", value: "over 325 arrested; about 60 FIRs", claimed_by: "Bihar police (reported by The Hindu)", source: s28 }
      - { what: "Bihar cases registered, by 18 June", value: "600", claimed_by: "ADG (Law and Order) Sanjay Kumar Singh (reported by ThePrint)", source: s24 }
      - { what: "Bihar arrests and cases, by 19 June", value: "718 arrested; 25 cases", claimed_by: "Bihar Police (reported by The Indian Express, via Scroll)", source: s8 }
      - { what: "Bihar arrests and FIRs, by 19 June", value: "804 arrested; 145 FIRs", claimed_by: "Bihar Police Headquarters statement (PTI)", source: s34 }
      - { what: "Bihar arrests and FIRs, by 19 June", value: "805 arrested; 148 FIRs", claimed_by: "officials (reported by Hindustan Times)", source: s26 }
      - { what: "Bihar arrests and FIRs, by 20 June", value: "879 arrested; 159 FIRs", claimed_by: "Bihar Home Department official (reported by Hindustan Times)", source: s27 }
      - { what: "Uttar Pradesh arrests and FIRs, by 18 June", value: "260 arrested; 6 FIRs", claimed_by: "Uttar Pradesh Police (reported by ANI, via Scroll)", source: s7 }
      - { what: "Uttar Pradesh arrests and cases, by 18 June", value: "340 arrested (145 preventive under Section 151 CrPC, 195 under FIRs); 29 cases in 12 districts", claimed_by: "Uttar Pradesh Police (reported by The Hindu)", source: s31 }
      - { what: "Palwal arrests and people booked", value: "23 arrested; over 1,000 booked in three FIRs", claimed_by: "Palwal district police (reported by The Tribune)", source: s32 }
  - type: concession
    date: 2022-06-18
    claim: ordered
    description: "The Home Ministry announced 10% reservation of vacancies for Agniveers in the Central Armed Police Forces and Assam Rifles, with a 3-year age relaxation (5 years for the first batch). Defence Minister Rajnath Singh approved 10% reservation of Ministry of Defence job vacancies for Agniveers, in the Indian Coast Guard, defence civilian posts and 16 defence PSUs. On 19 June, Lt Gen Anil Puri, Additional Secretary in the Department of Military Affairs, said the reservation announcement was planned and was not a reaction to the protests."
    actor: centre
    sources: [s12, s13, s4, s7b, s30]
  - type: other
    date: 2023-02-27
    claim: held
    description: "A Division Bench of the Delhi High Court (Chief Justice Satish Chandra Sharma and Justice Subramonium Prasad) dismissed a batch of writ petitions that challenged the Agnipath scheme or sought completion of earlier recruitment processes. It held that the scheme was not arbitrary, capricious or devoid of reason and that it was made in national interest to ensure that the Armed Forces are better equipped."
    actor: court
    sources: [s37]
outcome: >
  The government did not roll back the scheme. The Army issued a notification on 20 June
  to begin registrations for the first batch from July. The opposition raised the scheme in
  the Bihar Assembly on 27 June 2022, and the Assembly was adjourned for the day. On 27 February
  2023 the Delhi High Court dismissed the petitions challenging the scheme.
positions:
  - party: BJP
    person: Ashwini Vaishnaw
    role_at_time: Union Railway Minister
    in_power: true
    date: 2022-06-17
    kind: verbatim
    statement: "Appealed to young people not to take part in violent protests or damage railway property, saying the Railways are the property of the country. On 18 June, as reported by Scroll, he repeated that rail property belongs to the country and said the government was listening to protesters' grievances with sensitivity."
    quote:
      text: "I appeal to the youth to not indulge in violent protests and not damage the property of the Railways."
      locator: "ANI post of 17 June 2022 with video, beginning '#WATCH | I appeal to the youth'"
      source: s15
    sources: [s15, s3, s8]
  - party: BJP
    person: Rajnath Singh
    role_at_time: Union Defence Minister
    in_power: true
    date: 2022-06-18
    kind: verbatim
    statement: "His office announced that he had approved a proposal to reserve 10% of Ministry of Defence job vacancies for Agniveers, in addition to existing reservations for ex-servicemen, and that recruitment rules would be amended and age relaxation provided."
    quote:
      text: "This reservation would be in addition to existing reservations for ex-servicemen."
      locator: "First paragraph of the release on rajnathsingh.in, last sentence"
      source: s13
    sources: [s13, s4]
  - party: INC
    person: Rahul Gandhi
    role_at_time: Lok Sabha MP, opposition
    in_power: false
    date: 2022-06-15
    kind: paraphrase
    statement: "Said on Twitter that, with India facing threats on two fronts, the Agnipath scheme reduces the operational effectiveness of the armed forces, and that the BJP government must stop compromising the dignity, traditions, valour and discipline of the forces."
    sources: [s10, s35, s36]
  - party: INC
    person: Mallikarjun Kharge
    role_at_time: Leader of Opposition, Rajya Sabha
    in_power: false
    date: 2022-06-20
    kind: verbatim
    statement: "Said service chiefs were being fronted to defend a government policy decision for the first time in 75 years, and asked why the Prime Minister, Home Minister and Defence Minister were quiet on the scheme."
    quote:
      text: "For the first time in 75 years, service chiefs are being fronted to defend a policy decision by the government."
      locator: "Post on X, first sentence"
      source: s14
    sources: [s14, s6, s5]
  - party: RJD
    person: Tejashwi Yadav
    role_at_time: Leader of Opposition, Bihar Assembly
    in_power: false
    date: 2022-06-19
    kind: paraphrase
    statement: "At a press conference in Patna, asked whether the scheme was a MGNREGA-like step for educated youth or a hidden agenda of the RSS, demanded its withdrawal and urged protesters to demonstrate peacefully."
    sources: [s7b, s38]
  - party: JD(U)
    person: Lalan Singh
    role_at_time: JD(U) National President, BJP ally in Bihar
    in_power: true
    date: 2022-06-18
    kind: verbatim
    statement: "Replying to Bihar BJP president Sanjay Jaiswal, who had accused the state administration and police of standing by while BJP offices and leaders' homes were attacked, asked why BJP-led state governments had not had police fire on protesters, and said BJP leaders were targeted because the BJP heads the Union government. The Indian Express reported that he also said the BJP had not consulted the JD(U) before announcing the scheme."
    quote:
      text: "They don’t realise a simple thing: that BJP leaders are being targeted because the party heads the government at the Centre."
      locator: "Paragraph beginning 'Reacting sharply to Jaiswal’s statement'"
      source: s29
    sources: [s29, s24, s28, s7b]
