id: election-commission-sir-protests-2026
title: Protests demanding the Chief Election Commissioner's resignation
summary: >
  In October 2026 the Cockroach Janta Party (CJP), student groups and opposition parties held
  protests in New Delhi and Mumbai demanding the resignation of Chief Election Commissioner
  Gyanesh Kumar over the Special Intensive Revision (SIR) of voter rolls, which removed more
  than 130 million names. Protests grew after an Indian Express report that two election
  commissioners had questioned Kumar's decisions. On 10 October police denied permission for a
  Jantar Mantar rally, sealed central Delhi, suspended mobile internet and detained CJP
  leaders and thousands of protesters. The Election Commission denies wrongdoing.
period:
  start: 2026-10-04
  end: null
location:
  states: [Delhi, Maharashtra]
  places: [Jantar Mantar, Parliament Street, Supreme Court, Delhi airport, RK Ashram, Dilli Haat, Mumbai]
protest:
  cause: "Alleged misconduct in the Election Commission's voter-roll revision (SIR); demand for CEC Gyanesh Kumar's resignation and a halt to the revision"
  organisers: [Cockroach Janta Party, AISA, INC, INDIA bloc parties]
  scale: "Thousands in New Delhi on 10-13 October; detention counts range from more than 2,000 (AP) to more than 15,000 (CJP)"
government:
  centre:
    party: BJP
    alliance: NDA
    head: Narendra Modi
    role: Prime Minister
actions:
  - type: detention
    date: 2026-10-04
    description: "Police detained AISA national president Neha Bora at a protest over alleged assaults on women protesters and journalists by Delhi Police."
    actor: police
    sources: [o5]
  - type: detention
    date: 2026-10-05
    description: "Police in Delhi and Mumbai detained demonstrators for a third day as youth and opposition supporters rallied for the election chief's resignation. No count was given."
    actor: police
    sources: [o9]
  - type: detention
    date: 2026-10-07
    description: "Police detained Rahul Gandhi at an opposition protest demanding Kumar's resignation; he was held briefly."
    actor: police
    sources: [o4, o5]
  - type: permission_denied
    date: 2026-10-10
    description: "Authorities denied permission for the 10 October rally at Jantar Mantar, saying the request was submitted late."
    actor: police
    sources: [o8]
  - type: barricading
    date: 2026-10-10
    description: "Police sealed Jantar Mantar, set up checkpoints and concrete barriers on main roads, and deployed more than 30,000 police and paramilitary personnel (local media figure). Dozens of metro stations and markets were shut and more than 200 trains were cancelled."
    actor: police
    sources: [o1, o4, o8]
  - type: internet_shutdown
    date: 2026-10-10
    description: "Mobile internet was suspended in the central business district and several other areas of New Delhi around the protest site."
    actor: police
    sources: [o1, o4, o8]
  - type: preventive_arrest
    date: 2026-10-10
    description: "Police detained CJP founder Abhijeet Dipke and leaders Saurav Das and Ashutosh Ranka on arrival at Delhi airport from Mumbai, before the rally. YouTuber Dhruv Rathee was detained from his home and Neha Bora was also detained."
    actor: police
    sources: [o2, o4]
  - type: detention
    date: 2026-10-10
    description: "Mass detentions across New Delhi. Counts differ: more than 2,000 (AP photo caption), more than 5,000 (The Hindu, as cited by France 24), more than 15,000 (CJP). TV channels reported that Mamata Banerjee, Arvind Kejriwal and Pinarayi Vijayan were detained. ANI reported about 600 arrests in Mumbai. Police did not comment."
    actor: police
    sources: [o1, o4, o8]
  - type: detention
    date: 2026-10-10
    description: "Several journalists, including reporters from Scroll and Newslaundry, were detained during the weekend protests; Reporters Without Borders counted at least 16. Newslaundry said some equipment was seized."
    actor: police
    sources: [o1, o3, o4]
  - type: other
    date: 2026-10-11
    description: "An executive magistrate's court ordered the release of the three CJP leaders on condition of 'no breach of peace' for one year; Dhruv Rathee was also released. Police said all detainees were released. Al Jazeera reported that the Supreme Court called the detention 'illegal'; France 24 reported only that the Supreme Court was due to hear a petition against the metro closures."
    actor: court
    sources: [o2, o4]
  - type: barricading
    date: 2026-10-12
    description: "For a third day police deployed thousands of personnel in central Delhi, erected metal barricades and closed six major metro stations as Rahul Gandhi led MPs and protesters toward the Supreme Court. The march turned back at the second barricade after Congress said its petition had been submitted."
    actor: police
    sources: [o3, o5]
  - type: other
    date: 2026-10-12
    description: "Delhi Police announced that Jantar Mantar was no longer an official protest site and named three new venues. The reports seen do not give the legal basis for the change."
    actor: police
    sources: [o6]
  - type: detention
    date: 2026-10-13
    description: "Police detained about 20 CJP volunteers, including Ashutosh Ranka, Saurav Das and Ajinkya Shinde, after they crossed barricades into Jantar Mantar."
    actor: police
    sources: [o6]
  - type: detention
    date: 2026-10-14
    description: "Ashutosh Ranka and Saurav Das were sent to five days in jail after entering Jantar Mantar. The report does not name the ordering authority or the charges."
    actor: other
    sources: [o7]
outcome: >
  Ongoing as of 15 October 2026. The CJP and opposition parties say they will continue protests
  until Gyanesh Kumar resigns. No talks between the government and protesters have been reported.
