id: election-commission-sir-protests-2026
title: Protests demanding the Chief Election Commissioner's resignation
summary: >
  In October 2026 the Cockroach Janta Party (CJP), student groups and opposition parties held
  protests in New Delhi and Mumbai demanding the resignation of Chief Election Commissioner
  Gyanesh Kumar over the Special Intensive Revision (SIR) of voter rolls, which removed more
  than 130 million names. Protests grew after an Indian Express report that two election
  commissioners had questioned Kumar's decisions. Police denied permission for a 10 October
  Jantar Mantar rally; authorities sealed central Delhi, suspended mobile internet and detained
  CJP leaders and thousands of protesters. On 11 October the Supreme Court directed that no one
  be detained except under procedure established by law. Delhi Police then denotified Jantar
  Mantar as a protest site. The Election Commission denies wrongdoing.
period:
  start: 2026-10-02
  end: null
location:
  states: [Delhi, Maharashtra]
  places: [Jantar Mantar, Parliament Street, Connaught Place, Supreme Court, Delhi airport, RK Ashram, Dilli Haat, Mumbai]
protest:
  cause: "Alleged misconduct in the Election Commission's voter-roll revision (SIR); demand for CEC Gyanesh Kumar's resignation and a halt to the revision"
  organisers: [Cockroach Janta Party, AISA, INC, INDIA bloc parties]
  scale: "Thousands in New Delhi on 10-13 October; detention counts for 10 October range from about 2,000 (a Home Ministry official, via Reuters) to more than 15,000 (CJP)"
government:
  centre:
    party: BJP
    alliance: NDA
    head: Narendra Modi
    role: Prime Minister
actions:
  - type: detention
    date: 2026-10-04
    claim: happened
    description: "Police detained AISA national president Neha Bora during a protest in New Delhi demanding Kumar's resignation (Reuters photo caption)."
    actor: police
    sources: [o5]
  - type: detention
    date: 2026-10-04
    claim: happened
    description: "Police in Delhi and Mumbai detained some demonstrators for a third day as youth and opposition supporters rallied for the election chief's resignation. No count was given."
    actor: police
    sources: [o9]
  - type: detention
    date: 2026-10-07
    claim: happened
    description: "Police detained Rahul Gandhi, Priyanka Gandhi Vadra and other INDIA bloc MPs as they tried to march to Jantar Mantar to demand Kumar's resignation. AP and Reuters reported it was Gandhi's third detention in two days. He was taken to Barakhamba police station and released later that day."
    actor: police
    sources: [o5, o4, o38, o39]
  - type: permission_denied
    date: 2026-10-09
    claim: ordered
    description: "Delhi Police denied permission for the CJP's 10 October rally at Jantar Mantar. Joint Commissioner Nupur Prasad said the application, from CJP co-convener Saurav Das, came too late under a guideline that requires 10 days' notice, that the CJP had not complied with its undertakings at an earlier protest, and that law and order, public safety and traffic were considered. She said prohibitory orders under Section 163 of the BNSS were in force in the New Delhi area."
    actor: police
    legal_basis: "Section 163, Bharatiya Nagarik Suraksha Sanhita (prohibitory orders in the New Delhi area); Delhi Police guideline requiring 10 days' notice for protests at Jantar Mantar"
    sources: [o15, o12, o16, o8]
  - type: barricading
    date: 2026-10-10
    claim: happened
    description: "Police sealed Jantar Mantar, set up checkpoints and concrete barriers on main roads and entry points, and deployed tens of thousands of police and paramilitary personnel. Entry and exit at dozens of metro stations were closed from the night of 9 October at Delhi Police's request, and trains into New Delhi were cancelled. Counts of personnel, closed stations and cancelled trains differ."
    actor: police
    sources: [o4, o10, o17, o1, o8, o11]
    court_outcomes:
      - summary: "On 9 October the Supreme Court, in M.A. Baby v. Union of India, observed that Delhi Police communications closing 57 metro stations and cancelling trains appeared to be overreaching and said metro services could be regulated but not banned outright. On 11 October it directed that metro and rail services run normally subject to public order, that barricades be reviewed and that free movement be permitted, and issued notice on a contempt petition over the closures."
        source: o11
    figures:
      - { what: police and paramilitary personnel deployed, value: "more than 30,000", claimed_by: local media (via Al Jazeera), source: o4 }
      - { what: police, paramilitary and state force personnel deployed, value: "over 35,000", claimed_by: The Tribune, source: o17 }
      - { what: metro stations named for closure in Delhi Police communications, value: "57", claimed_by: Supreme Court order of 9 October (via LiveLaw), source: o11 }
      - { what: metro stations closed or restricted on 10 October, of 303, value: "47", claimed_by: Solicitor General Tushar Mehta, source: o11 }
      - { what: metro stations closed, of 303, value: "45", claimed_by: The Tribune, source: o17 }
      - { what: trains cancelled, value: "more than 200", claimed_by: AFP, source: o1 }
      - { what: trains to Delhi cancelled by Northern Railways, value: "nearly 250", claimed_by: The Tribune, source: o17 }
  - type: internet_shutdown
    date: 2026-10-09
    claim: ordered
    description: "The Union Home Ministry authorised the suspension of all mobile internet services within a 4-km radius of the Janpath-Kartavya Path crossing in New Delhi from 10 pm on 9 October to 10 pm on 10 October. Reports differ on whether the order was issued by the Home Ministry or by Delhi Police with Home Ministry approval. MediaNama reported that the order was not published officially and did not state its grounds, and that a 12-hour shutdown within 1.5 km of Jantar Mantar had been imposed on 2 October."
    actor: centre
    legal_basis: "Rule 3(1), Telecommunications (Temporary Suspension of Services) Rules, 2024, read with Section 20(2)(b), Telecommunications Act, 2023"
    sources: [o12, o13, o14, o4, o10]
    court_outcomes:
      - summary: "On 11 October the Supreme Court directed that internet facilities remain undisturbed and recorded the Solicitor General's statement that the internet connection had been restored."
        source: o11
  - type: preventive_arrest
    date: 2026-10-10
    claim: happened
    description: "Police boarded the Air India flight that brought CJP founder Abhijeet Dipke and leaders Saurav Das and Ashutosh Ranka from Mumbai and detained them on arrival in New Delhi, before the rally. The CJP said they were denied access to lawyers. YouTuber Dhruv Rathee was detained from his home in Gurugram and AISA president Neha Bora was also detained."
    actor: police
    sources: [o4, o10, o2, o1, o17]
  - type: detention
    date: 2026-10-10
    claim: happened
    description: "Mass detentions across New Delhi; detainees were held in stadiums, community centres and police stations. Those detained included former chief ministers Mamata Banerjee, Arvind Kejriwal, Pinarayi Vijayan and Manik Sarkar. Counts differ (see figures). ANI reported about 600 arrests in Mumbai. Police did not comment on the numbers."
    actor: police
    sources: [o4, o10, o8, o1, o40, o17, o11]
    court_outcomes:
      - summary: "In a special sitting on 11 October on a habeas corpus petition by Menaka Guruswamy and a contempt petition, the Supreme Court directed that no person be detained except in accordance with procedure established by law, particularly peaceful and unarmed assemblies outside the area under Section 163 BNSS orders, and that advocates not be hindered in their professional duties. The Solicitor General said the habeas petition may not survive because the detainees had been released."
        source: o11
    figures:
      - { what: people detained in New Delhi on 10 October, value: "more than 2,000", claimed_by: AP, source: o8 }
      - { what: people detained in New Delhi on 10 October, value: "about 2,000", claimed_by: Home Ministry official (via Reuters), source: o40 }
      - { what: people detained in New Delhi on 10 October, value: "nearly 2,500", claimed_by: Delhi Police sources (via The Hindu), source: o40 }
      - { what: people detained in Delhi-NCR on 10 October, value: "nearly 3,000", claimed_by: The Tribune, source: o17 }
      - { what: people detained in New Delhi on 10 October, value: "more than 5,000", claimed_by: The Hindu (via AFP), source: o1 }
      - { what: people reported detained, value: "7,000", claimed_by: Menaka Guruswamy (petitioner, Supreme Court hearing), source: o11 }
      - { what: protesters detained, value: "more than 15,000", claimed_by: CJP (Ajinkya Shinde), source: o1 }
      - { what: people arrested in Mumbai, value: "some 600", claimed_by: ANI (via Al Jazeera), source: o4 }
  - type: detention
    date: 2026-10-10
    claim: happened
    description: "Police detained journalists covering the protests, including three Newslaundry reporters and an intern and Scroll's Ayush Tiwari and Shoaib Daniyal on 10 October; Newslaundry said some equipment was seized. More journalists were detained on 11 October. All were later released."
    actor: police
    sources: [o18, o4, o3, o19, o1]
    figures:
      - { what: journalists detained on 11 October, value: "at least 11", claimed_by: Scroll, source: o19 }
      - { what: journalists detained over the weekend of 10-11 October, value: "at least 16", claimed_by: Reporters Without Borders, source: o3 }
  - type: other
    date: 2026-10-11
    claim: happened
    description: "An executive magistrate's court released the three CJP leaders on condition of no breach of peace for one year, according to CJP lawyer Ratna Singh; Delhi Police confirmed the release and its conditions. IANS reported that they furnished a bond of Rs 50,000. Dhruv Rathee was also released. Police said all detainees had been released. Al Jazeera reported that detainees were released after the Supreme Court called their detention illegal; LiveLaw's report of the 11 October hearing records directions against detention except under procedure established by law, and no such finding."
    actor: court
    sources: [o10, o4, o2, o22, o11]
  - type: barricading
    date: 2026-10-12
    claim: happened
    description: "For a third day police deployed thousands of personnel in central Delhi, set up metal barricades and kept six major metro stations shut as Rahul Gandhi and INDIA bloc leaders led a march from Connaught Place toward the Supreme Court. Police stopped the march on Bhagwan Das Marg, about 600 m from the court, after protesters crossed the first barricade. The leaders filed a petition against the SIR that evening."
    actor: police
    sources: [o20, o5, o3]
    figures:
      - { what: police officers deployed, value: "more than 30,000", claimed_by: Al Jazeera, source: o5 }
  - type: other
    date: 2026-10-11
    claim: ordered
    description: "A standing order issued by Delhi Police Commissioner Anurag Kumar on 11 October, and made public on 12 October, denotified Jantar Mantar as the designated protest site and named Ramlila Ground, Burari Ground and CBD Ground in East Delhi as new venues. The order cites the recommendations of a committee set up by the Home Ministry and says revised procedures for the new venues will be issued separately."
    actor: police
    legal_basis: "Delhi Police standing order of 11 October 2026, in partial modification of Standing Order No. L&O/48/22 dated 28.04.2022"
    sources: [o25, o26, o6, o27]
  - type: detention
    date: 2026-10-13
    claim: happened
    description: "Police detained CJP leaders Ashutosh Ranka, Saurav Das and Ajinkya Shinde and other volunteers after they climbed the gates and barricades into Jantar Mantar with the national flag. Police registered an FIR alleging unlawful assembly and disobedience of an order promulgated by a public servant."
    actor: police
    sources: [o21, o6, o24, o23, o41]
    figures:
      - { what: CJP volunteers who entered Jantar Mantar and were detained, value: "about 20", claimed_by: Reuters, source: o6 }
      - { what: CJP members detained, value: "14", claimed_by: Delhi Police (via Onmanorama), source: o23 }
  - type: detention
    date: 2026-10-14
    claim: ordered
    description: "A Special Executive Magistrate remanded Ashutosh Ranka and Saurav Das to five days of judicial custody in Tihar Jail; Ajinkya Shinde was released on a personal bond. Police said the two had violated the peace bonds signed after their 10 October detention. Their lawyer Abhisht Hela said the Special Executive Magistrates were police officers of Superintendent rank, not judicial magistrates, and that the order was passed without application of judicial mind."
    actor: other
    legal_basis: "Sections 126 and 170, Bharatiya Nagarik Suraksha Sanhita (as stated by Delhi Police)"
    sources: [o21, o22, o23, o7]
outcome: >
  Ongoing as of 15 October 2026. The CJP and opposition parties say they will continue protests
  until Gyanesh Kumar resigns. Ashutosh Ranka and Saurav Das are in judicial custody. Supreme
  Court proceedings on the detentions and the metro closures are pending. No talks between the
  government and protesters have been reported.
