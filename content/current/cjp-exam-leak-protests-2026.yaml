id: cjp-exam-leak-protests-2026
title: Cockroach Janta Party protests over exam paper leaks
summary: >
  After the NEET-UG 2026 medical entrance paper leaked and the May exam was annulled, the
  youth-led Cockroach Janta Party (CJP) held protests at Jantar Mantar in New Delhi from June
  2026 to demand the resignation of Education Minister Dharmendra Pradhan and exam reform.
  Sonam Wangchuk began a hunger strike on 28 June. On 20 July a march toward Parliament met
  tear gas and batons, and opposition leaders were detained on 21 July. Pradhan resigned on
  25 July and the CJP called off the protests after talks with Union ministers.
period:
  start: 2026-06-06
  end: 2026-07-25
location:
  states: [Delhi, Maharashtra]
  places: [Jantar Mantar, Parliament Street, Prime Minister's residence, Mumbai]
protest:
  cause: NEET-UG 2026 paper leak and other exam irregularities; demand for the Education Minister's resignation
  organisers: [Cockroach Janta Party, AISA, AISF, SFI, KYS, Sonam Wangchuk]
  scale: "Tens of thousands marched in New Delhi on 20 July (The Guardian, Al Jazeera); solidarity protests in Mumbai, Bengaluru, Kolkata, Goa, Ahmedabad and abroad"
government:
  centre:
    party: BJP
    alliance: NDA
    head: Narendra Modi
    role: Prime Minister
actions:
  - type: censorship
    date: 2026-06-16
    claim: ordered
    description: "After the 3 May NEET-UG exam was cancelled over a paper leak, the Ministry of Electronics and Information Technology, on the National Testing Agency's recommendation, directed under Section 69A of the IT Act that access to Telegram in India be restricted until 22 June, covering the 21 June re-examination. Telegram was also directed to disable message editing in India until 30 June. The Pioneer reported that the order required Google and Apple to delist the app and that existing accounts kept working. About 2.2 million candidates had to retake the exam."
    actor: centre
    legal_basis: Section 69A, Information Technology Act, 2000
    sources: [s7, s8, s9, s1]
    figures:
      - { what: candidates who had to retake the exam, value: "about 2.2 million", claimed_by: Al Jazeera, source: s1 }
      - { what: candidates who appeared in the 21 June re-examination, value: "close to 20 lakh", claimed_by: National Testing Agency, source: s6 }
  - type: permission_granted
    date: 2026-06-06
    claim: ordered
    description: "Delhi Police granted permission for the first Jantar Mantar protest until 5 pm, which police called a one-time exception, and relaxed the advance-notice requirement. Police sources told PTI that more than 1,000 personnel were deployed across New Delhi district and other locations."
    actor: police
    state: Delhi
    sources: [s11, s10]
    figures:
      - { what: police personnel deployed across New Delhi district and other locations, value: "more than 1,000", claimed_by: police sources (PTI), source: s11 }
  - type: other
    date: 2026-07-18
    claim: happened
    description: "Police and paramilitary personnel removed Sonam Wangchuk, on hunger strike since 28 June, from the stage at Jantar Mantar and took him to Safdarjung Hospital. DCP Sachin Sharma said he was moved in compliance with a court order and on medical advice. The BBC and The Guardian reported that he was removed by force; his wife Gitanjali Angmo called his confinement in hospital illegal detention."
    actor: police
    state: Delhi
    sources: [s12, s13]
  - type: section_144
    date: 2026-07-19
    claim: ordered
    description: "Prohibitory orders under Section 163 of the BNSS were in force across New Delhi district before the 20 July 'Chalo Sansad' march. A public advisory from the DCP, New Delhi said that protest marches, processions, demonstrations and assemblies of five or more persons were prohibited except at the designated site at Jantar Mantar, with prior permission."
    actor: police
    state: Delhi
    legal_basis: Section 163 BNSS
    sources: [s15, s14, s13, s16]
  - type: permission_denied
    date: 2026-07-19
    claim: ordered
    description: "In a public advisory posted on X on 19 July, the DCP, New Delhi said that no permission had been sought or granted for the CJP's proposed march to Parliament on 20 July."
    actor: police
    state: Delhi
    sources: [s15, s14, s13, s16]
  - type: tear_gas
    date: 2026-07-20
    claim: happened
    description: "Police fired tear gas at marchers heading toward Parliament. Police said protesters tried to breach barricades and threw stones at security forces, and that 118 personnel and 60 civilians were injured and about 70 people detained. Organisers said at least 150 protesters were wounded."
    actor: police
    state: Delhi
    sources: [s13, s18, s19, s1, s3]
    figures:
      - { what: police personnel injured, value: "118", claimed_by: Delhi Police, source: s3 }
      - { what: civilians injured, value: "60", claimed_by: Delhi Police, source: s3 }
      - { what: protesters wounded, value: "at least 150", claimed_by: organisers, source: s1 }
      - { what: people detained, value: "over 70", claimed_by: Delhi Police, source: s19 }
  - type: lathi_charge
    date: 2026-07-20
    claim: happened
    description: "Police used batons and canes on the march. The use of pellets is contested: Delhi Police denied using pellet guns, while The Hindu reported a hospital source who said one protester had pellet injuries, and the Hindustan Times reported a police general diary entry that recorded plastic pellets fired by the Rapid Action Force on a DCP's orders."
    actor: police
    state: Delhi
    sources: [s13, s17, s18, s20, s21, s1]
    court_outcomes:
      - summary: On 22 July the Delhi High Court asked the Union government and Delhi Police to respond to petitions alleging excessive force and directed that CCTV and video records of the march be preserved; the Additional Solicitor General said protesters had thrown stones.
        source: s22
  - type: internet_shutdown
    date: 2026-07-17
    claim: ordered
    description: "The Ministry of Home Affairs ordered mobile internet services suspended within about 1.5 km of Jantar Mantar, in orders dated 17, 20, 22 and 23 July, citing public safety and averting a public emergency. Mobile internet was cut or disrupted around the protest site in central Delhi on 20 July. A public interest petition by SFLC.in that challenged the orders in the Delhi High Court was withdrawn after the protests were called off. Human Rights Watch and Amnesty International condemned the suspension."
    actor: centre
    legal_basis: Section 20(2)(b), Telecommunications Act, 2023; Telecommunications (Temporary Suspension of Services) Rules, 2024
    sources: [s23, s24, s13, s17, s25, s42, s2]
  - type: detention
    date: 2026-07-21
    claim: happened
    description: "Police detained Rahul Gandhi, Priyanka Gandhi Vadra and other opposition leaders at a sit-in outside the Prime Minister's residence and released them later the same day."
    actor: police
    state: Delhi
    sources: [s26, s27, s1, s3]
  - type: other
    date: 2026-07-21
    claim: held
    description: "On an appeal by Wangchuk's wife Gitanjali J. Angmo, whose petition called his confinement at Safdarjung Hospital illegal, a Division Bench of the Delhi High Court directed that he be shifted immediately to Medanta Hospital, Gurugram, the hospital of his choice. The Solicitor General said the government had no objection."
    actor: court
    sources: [s28, s1]
  - type: fir
    date: 2026-07-23
    claim: ordered
    description: "Mumbai Police registered 13 FIRs naming about 400 people over protests held without permission since 18 July. Delhi Police registered FIRs over violence during the 20 July march, and police cases were filed against students in Delhi, Assam, West Bengal and Bihar."
    actor: police
    state: [Maharashtra, Delhi, Assam, West Bengal, Bihar]
    sources: [s29, s30, s31]
    figures:
      - { what: FIRs registered in Mumbai, value: "13", claimed_by: Mumbai Police, source: s29 }
      - { what: people named as accused in Mumbai, value: "around 400", claimed_by: Mumbai Police, source: s29 }
      - { what: FIRs registered in Delhi over the 20 July march, by 21 July, value: "4", claimed_by: police sources, source: s30 }
  - type: negotiation
    date: 2026-07-20
    claim: happened
    description: "Union minister J. P. Nadda met CJP spokespersons on 20 July; Nadda and the CJP gave different accounts of who proposed the talks. CJP representatives held further talks with the government on 24 July, and a third round with Nadda and Jitendra Singh took place on 25 July."
    actor: centre
    sources: [s32, s13, s25, s33]
  - type: concession
    date: 2026-07-23
    claim: ordered
    description: "Prime Minister Modi announced in a video on X that a draft law with fast-track courts and stricter punishment for paper leaks would go to the Cabinet the next day. Wangchuk ended his 26-day fast the same night, saying the government had assured him that no legal action would be taken against protesters."
    actor: centre
    sources: [s34, s25, s2]
  - type: concession
    date: 2026-07-25
    claim: ordered
    description: "Dharmendra Pradhan resigned as Education Minister before a third round of talks. The President accepted the resignation on the Prime Minister's advice, and Pralhad Joshi was given charge of the Ministry of Education. The CJP said its demands had been met and called off the protests; its other demands included compensation and the withdrawal of cases against protesters."
    actor: centre
    legal_basis: Article 75(2), Constitution of India
    sources: [s35, s36, s33, s4]
outcome: >
  Pradhan resigned on 25 July 2026 and the CJP called off the Jantar Mantar protests the same
  day. On 27 July the CJP said the government had not kept its pledge against action on
  protesters and threatened to resume protests. Parliament passed the Public Examinations
  (Prevention of Unfair Means) Amendment Bill, 2026 on 29 July, and the President gave assent
  on 31 July.
