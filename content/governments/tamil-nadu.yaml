# Tamil Nadu, from the term in office on 1974-01-01.
# Dates: Tamil Nadu Legislative Assembly list of Chief Ministers. President's Rule dates come from
# the Lok Sabha Secretariat book on President's Rule (2016). The Assembly's reviews of the work of
# the Seventh and Eighth Assemblies cover 1984-85 and the change of Chief Minister in 1987-88.
# Party: the Lok Sabha book and the Assembly's member lists ("Who's Who") for each Assembly.
# Where one term's end date equals the next term's start date, `to` here is the day before.
name: Tamil Nadu
terms:
  # Party: Lok Sabha book, DMK.
  - from: 1971-03-15
    to: 1976-01-30
    head: M. Karunanidhi
    party: DMK
    sources: [tn-la-cms, ls-pr-book]
  # Lok Sabha book: proclaimed 31-1-1976; M.G. Ramachandran (AIADMK) formed the ministry on 30-6-1977.
  - from: 1976-01-31
    to: 1977-06-29
    head: President's Rule
    kind: presidents_rule
    sources: [ls-pr-book, tn-la-cms]
  # Party: Lok Sabha book, AIADMK.
  - from: 1977-06-30
    to: 1980-02-16
    head: M. G. Ramachandran
    party: AIADMK
    sources: [tn-la-cms, ls-pr-book]
  # Lok Sabha book: proclaimed 17-2-1980; M.G. Ramachandran (AIADMK) sworn in on 9-6-1980.
  - from: 1980-02-17
    to: 1980-06-08
    head: President's Rule
    kind: presidents_rule
    sources: [ls-pr-book, tn-la-cms]
  # The Assembly list has two terms: 09-06-1980 to 15-11-1984 (the day the Seventh Assembly was
  # dissolved) and 10-02-1985 to 24-12-1987. The Seventh Assembly review shows his Council of
  # Ministers in place through the 1984-85 election (portfolio changes dated January 1985), so the
  # two terms are merged here. The Eighth Assembly review: he died on 24 December 1987 and his
  # Council was dissolved from the forenoon of that day, so the term ends on 23 December.
  # Party: Lok Sabha book, AIADMK.
  - from: 1980-06-09
    to: 1987-12-23
    head: M. G. Ramachandran
    party: AIADMK
    sources: [tn-la-cms, tn-la-review-7, tn-la-review-8, ls-pr-book]
  # Eighth Assembly review: the Governor appointed V.R. Nedunchezhiyan, senior-most member of the
  # outgoing Council, "to act as Chief Minister" until the majority party elected a leader. His
  # interim Council resigned on the forenoon of 7 January 1988. The Assembly CM list does not show
  # this acting term. Party: AIADMK, as a member of the outgoing AIADMK Council.
  - from: 1987-12-24
    to: 1988-01-06
    head: V. R. Nedunchezhiyan (acting)
    party: AIADMK
    sources: [tn-la-review-8]
  # Eighth Assembly review: leader of the AIADMK Legislative Party, Chief Minister from the forenoon
  # of 7 January 1988.
  - from: 1988-01-07
    to: 1988-01-29
    head: Janaki Ramachandran
    party: AIADMK
    sources: [tn-la-cms, tn-la-review-8]
  # Lok Sabha book: proclaimed 30-1-1988; Karunanidhi (DMK) sworn in on 27-1-1989.
  - from: 1988-01-30
    to: 1989-01-26
    head: President's Rule
    kind: presidents_rule
    sources: [ls-pr-book, tn-la-cms]
  # Party: Lok Sabha book, DMK.
  - from: 1989-01-27
    to: 1991-01-29
    head: M. Karunanidhi
    party: DMK
    sources: [tn-la-cms, ls-pr-book]
  # Lok Sabha book: proclaimed 30-1-1991; AIADMK ministry from 24-6-1991.
  - from: 1991-01-30
    to: 1991-06-23
    head: President's Rule
    kind: presidents_rule
    sources: [ls-pr-book, tn-la-cms]
  # Party: Tenth Assembly member list, AIADMK.
  - from: 1991-06-24
    to: 1996-05-12
    head: J. Jayalalithaa
    party: AIADMK
    sources: [tn-la-cms, tn-la-whoswho-10]
  # Party: Eleventh Assembly member list, D.M.K.
  - from: 1996-05-13
    to: 2001-05-13
    head: M. Karunanidhi
    party: DMK
    sources: [tn-la-cms, tn-la-whoswho-11]
  # The list ends this term on 21-09-2001, the day O. Panneerselvam starts.
  # Party: Thirteenth Assembly member list, AIADMK.
  - from: 2001-05-14
    to: 2001-09-20
    head: J. Jayalalithaa
    party: AIADMK
    sources: [tn-la-cms, tn-la-whoswho-13]
  # Party: Twelfth Assembly member list, A.I.A.D.M.K.
  - from: 2001-09-21
    to: 2002-03-01
    head: O. Panneerselvam
    party: AIADMK
    sources: [tn-la-cms, tn-la-whoswho-12]
  # Party: Thirteenth Assembly member list, AIADMK.
  - from: 2002-03-02
    to: 2006-05-12
    head: J. Jayalalithaa
    party: AIADMK
    sources: [tn-la-cms, tn-la-whoswho-13]
  # Party: Thirteenth Assembly member list, DMK.
  - from: 2006-05-13
    to: 2011-05-15
    head: M. Karunanidhi
    party: DMK
    sources: [tn-la-cms, tn-la-whoswho-13]
  # Party: Fourteenth Assembly member list, AIADMK. The list assigns no Chief Minister to
  # 28 September 2014.
  - from: 2011-05-16
    to: 2014-09-27
    head: J. Jayalalithaa
    party: AIADMK
    sources: [tn-la-cms, tn-la-whoswho-14]
  # Party: Fourteenth Assembly member list, AIADMK.
  - from: 2014-09-29
    to: 2015-05-22
    head: O. Panneerselvam
    party: AIADMK
    sources: [tn-la-cms, tn-la-whoswho-14]
  # Party: Fourteenth Assembly member list, AIADMK. The list assigns no Chief Minister to 22 May 2016.
  - from: 2015-05-23
    to: 2016-05-21
    head: J. Jayalalithaa
    party: AIADMK
    sources: [tn-la-cms, tn-la-whoswho-14]
  # Fifteenth Assembly member list: Chief Minister from 23-5-2016 to 5-12-2016.
  - from: 2016-05-23
    to: 2016-12-05
    head: J. Jayalalithaa
    party: AIADMK
    sources: [tn-la-cms, tn-la-whoswho-15]
  # Party rests on the Fourteenth Assembly member list (AIADMK) for the same person.
  - from: 2016-12-06
    to: 2017-02-15
    head: O. Panneerselvam
    party: AIADMK
    sources: [tn-la-cms, tn-la-whoswho-14]
  # The Assembly list ends this term on 31-05-2021, after M.K. Stalin's start on 07-05-2021 in the
  # same list. The end here is the day before Stalin's start. Party: Fifteenth Assembly member list.
  - from: 2017-02-16
    to: 2021-05-06
    head: Edappadi K. Palaniswami
    party: AIADMK
    sources: [tn-la-cms, tn-la-whoswho-15]
  # The list ends this term on 10-05-2026, the day the next Council of Ministers was sworn in.
  # Party: Sixteenth Assembly member list, DMK.
  - from: 2021-05-07
    to: 2026-05-09
    head: M. K. Stalin
    party: DMK
    sources: [tn-la-cms, tn-la-members-16]
  # Seventeenth Assembly overview: Council of Ministers sworn in on 10-5-2026. Party: Seventeenth
  # Assembly member list, "Joseph Vijay (TVK) (Chief Minister)".
  - from: 2026-05-10
    head: C. Joseph Vijay
    party: other (Tamilaga Vettri Kazhagam)
    sources: [tn-la-overview-17, tn-la-members-17, tn-la-party-17]
