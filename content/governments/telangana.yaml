# Telangana, from its creation on 2014-06-02. Before that date its territory was part of
# undivided Andhra Pradesh (see andhra-pradesh.yaml), which was under President's Rule from
# 2014-03-01. The Lok Sabha Secretariat book gives the end of President's Rule in Telangana as
# 01-06-2014.
# The Telangana Legislature website could not be reached, so dates come from the Lok Sabha book,
# the Prime Minister's Office and news reports.
name: Telangana
terms:
  # Lok Sabha book: K. Chandrasekhar Rao of the TRS sworn in on 02-06-2014. PTI (8 December 2022):
  # the Election Commission accepted the change of the party's name from Telangana Rashtra Samithi
  # to Bharat Rashtra Samithi (BRS). BRS is used for the whole term.
  # IANS (3 December 2023): he resigned on 3 December 2023 and the Governor asked him to continue
  # until a new government was formed; the term runs to the day before Revanth Reddy's oath.
  - from: 2014-06-02
    to: 2023-12-06
    head: K. Chandrasekhar Rao
    party: BRS
    sources: [ls-pr-book, tnm-brs-rename-2022, tnm-kcr-caretaker-2023]
  # PMO: oath on 7 December 2023. Party: ANI, "Congress leader Revanth Reddy".
  - from: 2023-12-07
    head: A. Revanth Reddy
    party: INC
    sources: [pmo-revanth-2023, bs-revanth-2023]
