# Union Territory of Ladakh, from its creation on 2019-10-31 under the Jammu and Kashmir
# Reorganisation Act, 2019, as a Union Territory without a legislature. Before that date the area
# was part of the State of Jammu and Kashmir (see jammu-and-kashmir.yaml).
name: Ladakh
police: centre
police_note: >
  Ladakh has no legislature or Chief Minister. It is administered by the President through a
  Lieutenant Governor, so police and public order are under the Centre.
terms:
  - from: 2019-10-31
    head: Lieutenant Governor of Ladakh (administered by the Centre)
    kind: centre
    sources: [jk-reorganisation-act-2019, pib-2019-section-73]
