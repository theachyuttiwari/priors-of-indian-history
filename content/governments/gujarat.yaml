    title: Gujarat Legislative Assembly (Leader of the House table)
    publisher: Legislative Bodies in India (Lok Sabha Secretariat / NIC)
    url: https://legislativebodiesinindia.nic.in/STATISTICAL/GUJARAT.htm
    archive_url: https://web.archive.org/web/20220704232412/https://legislativebodiesinindia.nic.in/STATISTICAL/GUJARAT.htm
    archive_date: 2022-07-04
    type: official
    tier: record
    accessed: 2026-10-15
  - id: gj-portal-cms
    title: All Chief Ministers of Gujarat
    publisher: Gujarat State Portal, Government of Gujarat
    url: https://gujaratindia.gov.in/Home/AllChiefMinistersofGujarat
    type: official
    tier: record
    accessed: 2026-10-15
  - id: mha-pr-statement
    title: Statement showing date of Proclamation and Revocation regarding President's Rule in States under Article 356 of the Constitution (enclosure to RTI reply V-12011(1)/2016-CSR.I)
    publisher: Ministry of Home Affairs, CS Division (copy published by Factly)
    url: https://factly.in/wp-content/uploads//2018/06/MHA-Presidents-Rule.pdf
    type: official
    tier: record
    accessed: 2026-10-15
  - id: tcpd-cmid
    title: TCPD Chief Ministers of India Dataset (TCPD-CMID), 1962-current (TCPD-CMID_1962_2022.csv)
    publisher: Trivedi Centre for Political Data, Ashoka University
    url: https://github.com/tcpd/cm-data-release
    type: academic
    tier: secondary
    accessed: 2026-10-15
  - id: wp-gujarat-cms
    title: List of chief ministers of Gujarat
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/List_of_chief_ministers_of_Gujarat
    tier: lead
    accessed: 2026-10-15
