# Uttarakhand (Uttaranchal until 2007), from its creation on 2000-11-09.
# Dates: Chief Minister's Office "Former Chief Ministers and their tenure" and the current Chief
# Minister's biography. Party: TCPD-CMID (secondary) unless a comment says otherwise.
# Where one term's end date equals the next term's start date, `to` here is the day before.
name: Uttarakhand
aliases: [Uttaranchal]
